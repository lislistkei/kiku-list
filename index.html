<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>聴くリスト</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* 劇場のプログラム冊子：表紙（本日の演目・目次・聴いた記録）→ 章の曲目 → 1曲のページ。3つの画面を #ハッシュで切りかえる */
:root{
  --paper:#f3ecdc; --paper2:#ebe1cb; --ink:#2a2118; --mute:#73634d; --red:#a8322b; --on-red:#fbf3e3;
  --gold:#b0905a; --rule:#cdbb98; --plate:#2a2118; --pline:#d9b878; --dot:rgba(120,90,40,.06);
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-latin:"Cormorant Garamond",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1a1611; --paper2:#251f17; --ink:#ece2cc; --mute:#a8987c; --red:#e07a6c; --on-red:#1a1611;
  --gold:#c9a86c; --rule:#4a3f30; --plate:#0e0b08; --pline:#d9b878; --dot:rgba(255,230,180,.03); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1a1611; --paper2:#251f17; --ink:#ece2cc; --mute:#a8987c; --red:#e07a6c; --on-red:#1a1611;
  --gold:#c9a86c; --rule:#4a3f30; --plate:#0e0b08; --pline:#d9b878; --dot:rgba(255,230,180,.03); color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--f-display);font-size:16px;line-height:1.75;
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:5px 5px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--paper)}
.wrap{max-width:560px;margin:0 auto}
[hidden]{display:none!important}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.lat{font-family:var(--f-latin)}
.view{display:flex;flex-direction:column}

/* 表紙 */
.backtop{align-self:flex-start;font-size:13px;text-decoration:none;color:var(--mute);letter-spacing:.08em;margin-bottom:8px}
.mast{text-align:center;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:8px 0 6px}
.mast .en{font-family:var(--f-latin);font-size:12px;letter-spacing:.4em;color:var(--mute);text-transform:uppercase}
.mast h1{font-size:34px;font-weight:800;margin:0;letter-spacing:.14em;line-height:1.3;padding-left:.14em;text-wrap:balance}
.mast .eyebrow{font-size:12.5px;color:var(--mute);letter-spacing:.04em}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);padding:6px 2px 0;letter-spacing:.06em}
.lead{margin:12px 2px 0;font-size:14px;color:var(--mute);line-height:1.8}
.sec-h{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font-size:13px;letter-spacing:.3em;color:var(--red);font-weight:600;scroll-margin-top:calc(12px + env(safe-area-inset-top,0px))}
.sec-h::before,.sec-h::after{content:"";flex:1;height:1px;background:var(--rule)}
.sec-h.left::before{display:none}

/* 本日の演目 */
.today{border:1px solid var(--ink);padding:6px}
.today .in{border:1px solid var(--rule);padding:14px 14px 16px;text-align:center;position:relative}
.today .art{display:block;width:100%;max-width:300px;margin:0 auto 12px;aspect-ratio:3/2}
.kicker{font-family:var(--f-latin);font-style:italic;font-size:15px;color:var(--gold)}
.comp{font-size:14px;color:var(--mute);letter-spacing:.12em}
.ttl{font-size:25px;font-weight:800;line-height:1.4;margin:2px 0 4px;letter-spacing:.03em;text-wrap:balance}
.part{font-size:13.5px;color:var(--mute)}
.today .pt{font-size:14.5px;line-height:1.85;text-align:left;margin:12px 2px 14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.btn{display:flex;justify-content:center;align-items:center;gap:10px;background:var(--red);color:var(--on-red);font-size:16px;font-weight:600;letter-spacing:.2em;min-height:50px;text-decoration:none;white-space:nowrap}
.btn .lat{font-size:16px;letter-spacing:.04em;opacity:.85}
.sub-links{display:flex;justify-content:center;gap:18px;margin-top:10px;font-size:13.5px}
.sub-links a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
.today .stamp{position:absolute;right:10px;top:10px;width:64px;height:64px}
.today .stamp b{font-size:14px}

/* 目次 */
ol.toc{list-style:none;margin:0;padding:0}
ol.toc a{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule);text-decoration:none}
ol.toc .r{font-family:var(--f-latin);font-style:italic;font-size:19px;color:var(--red);width:38px;flex:none}
ol.toc .nm{min-width:0;font-size:17px;font-weight:600;letter-spacing:.03em;line-height:1.45}
ol.toc .nm small{display:block;font-size:12px;color:var(--mute);font-weight:400;letter-spacing:0;line-height:1.5;margin-top:1px}
ol.toc .dots{flex:1;border-bottom:1px dotted var(--mute);transform:translateY(-6px);min-width:10px}
ol.toc .n{font-family:var(--f-latin);font-size:20px;font-weight:600;white-space:nowrap}
ol.toc .n i{font-family:var(--f-display);font-style:normal;font-size:11.5px;color:var(--mute);margin-left:2px}

/* 曲の行（章・さがす・おすすめで共通） */
ol.rows{list-style:none;margin:0;padding:0}
ol.rows a{display:grid;grid-template-columns:28px 46px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule);text-decoration:none;position:relative}
ol.rows .no{font-family:var(--f-latin);font-size:18px;color:var(--red);text-align:right;font-weight:600}
ol.rows .pl{width:46px;height:46px;display:block}
ol.rows .tx{min-width:0;line-height:1.45}
ol.rows .tx b{display:block;font-size:15.5px;font-weight:600}
ol.rows .tx small{display:block;font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.rows .tm{font-family:var(--f-latin);font-size:15px;color:var(--mute);text-align:right;line-height:1.2}
ol.rows .tm i{display:block;font-style:normal;font-family:var(--f-display);font-size:10.5px;color:var(--red);letter-spacing:.06em;margin-top:2px}
ol.rows.nonum a{grid-template-columns:46px 1fr auto}
ol.rows.nonum .no{display:none}
.why{grid-column:1/-1;font-size:12px;color:var(--mute);margin-top:-4px}

/* さがす */
.search label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:4px}
.search input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box}
.hits{font-size:12.5px;color:var(--mute);min-height:1.2em;margin-top:4px}

/* 聴いた記録 */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;list-style:none;margin:0 0 6px;padding:0;text-align:center}
.week li{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute)}
.week i{width:30px;height:30px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;font-style:normal;font-family:var(--f-latin);font-size:15px;color:var(--ink)}
.week li.on i{border:1.5px solid var(--red);color:var(--red);font-weight:600;box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px var(--red)}
.week li.now span{color:var(--ink);font-weight:600;border-bottom:1.5px solid var(--red)}
.lstat{font-size:12.5px;color:var(--mute);margin:6px 0 10px}
ol.stubs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
ol.stubs a,ol.stubs .nolink{display:flex;background:var(--paper2);position:relative;text-decoration:none}
ol.stubs .d{width:70px;flex:none;border-right:2px dashed var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 0}
ol.stubs .d b{font-family:var(--f-latin);font-size:21px;line-height:1;font-weight:600}
ol.stubs .d span{font-size:10.5px;color:var(--mute);letter-spacing:.1em}
ol.stubs .t{padding:8px 12px;font-size:14.5px;font-weight:600;line-height:1.45;min-width:0}
ol.stubs .t small{display:block;font-size:11.5px;font-weight:400;color:var(--mute)}
ol.stubs a::before,ol.stubs a::after,ol.stubs .nolink::before,ol.stubs .nolink::after{content:"";position:absolute;left:64px;width:12px;height:12px;border-radius:50%;background:var(--paper)}
ol.stubs a::before,ol.stubs .nolink::before{top:-6px}
ol.stubs a::after,ol.stubs .nolink::after{bottom:-6px}
.more{display:block;margin:12px auto 0;font:inherit;font-size:13px;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:5px 18px;cursor:pointer}

/* おすすめ・コツ */
.recs .stat,.recs .note{font-size:13px;color:var(--mute);margin:0 0 8px}
.recs .note{margin:10px 0 0;font-size:12px}
.recs .btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.recs .btns a{text-decoration:none}
.recs .btns button{font:inherit;font-size:14px;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:9px 12px;cursor:pointer}
#ai-out ol{margin:6px 0 0;padding-left:1.4em;font-size:14.5px}
#ai-out li small{display:block;color:var(--mute);font-size:12.5px}
.tips{margin-top:26px;background:var(--paper2);padding:14px 16px;font-size:14.5px;border-left:3px solid var(--gold)}
.tips h2{font-size:15px;letter-spacing:.14em;color:var(--red);margin:0 0 4px;font-weight:600}
.tips ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.mode{margin-top:22px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--mute)}
.mode button{font:inherit;font-size:13px;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:4px 12px;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.mode small{flex-basis:100%;font-size:12px}
footer{margin-top:22px;font-size:11.5px;color:var(--mute);line-height:1.7}

/* 章のページ */
.crumb{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--mute);letter-spacing:.06em;border-bottom:1px solid var(--ink);padding-bottom:8px}
.crumb a{text-decoration:none;white-space:nowrap}
.crumb span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sechead{text-align:center;padding:18px 0 4px}
.sechead .r{font-family:var(--f-latin);font-style:italic;font-size:22px;color:var(--red);line-height:1}
.sechead h2{font-size:26px;font-weight:800;margin:4px 0 2px;line-height:1.4;letter-spacing:.04em;text-wrap:balance}
.sechead p{margin:0;font-size:13.5px;color:var(--mute)}
.secplay{display:flex;flex-direction:column;gap:6px;margin:14px 0 4px}
.secplay .sm{display:flex;justify-content:center;gap:16px;font-size:13px}
.secplay .sm a{text-decoration:none;border-bottom:1px solid var(--rule)}
h3.grp{display:flex;align-items:center;gap:10px;margin:22px 0 2px;font-size:14px;letter-spacing:.14em;color:var(--red);font-weight:600}
h3.grp::after{content:"";flex:1;height:1px;background:var(--rule)}
h3.grp a{order:2;font-size:12px;letter-spacing:.02em;color:var(--mute);text-decoration:none;font-weight:400;white-space:nowrap}

/* 1曲のページ */
.plate{margin:18px 0 0;background:var(--plate)}
.plate svg{display:block;width:100%;height:auto}
.songhead{text-align:center;margin-top:16px}
.songhead .ttl{font-size:28px}
.ticket{display:flex;margin-top:16px;border:1.5px solid var(--ink);text-decoration:none}
.ticket .l{flex:1;display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--ink);color:var(--paper);min-width:0}
.ticket .c{width:40px;height:40px;flex:none;border-radius:50%;border:1.5px solid var(--paper);display:grid;place-items:center}
.ticket .l b{display:block;font-size:17px;letter-spacing:.2em;font-weight:600;line-height:1.3}
.ticket .l small{display:block;font-family:var(--f-latin);font-size:13px;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticket .rt{width:96px;flex:none;border-left:2px dashed var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:11px;color:var(--mute);line-height:1.3;padding:6px}
.ticket .rt b{font-family:var(--f-latin);font-size:24px;color:var(--ink);font-weight:600}
.h4{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.3em;color:var(--red);font-weight:600;margin:22px 0 6px}
.h4::after{content:"";flex:1;height:1px;background:var(--rule)}
.song p.tx{margin:0;font-size:15.5px;line-height:1.95}
.note{background:var(--paper2);padding:12px 14px;border-left:3px solid var(--gold)}
.note p{margin:0;font-size:14.5px;line-height:1.9}
details.more2{border:1px solid var(--rule);margin-top:10px}
details.more2>summary{cursor:pointer;padding:9px 12px;font-size:14px;font-weight:600;list-style:none}
details.more2>summary::-webkit-details-marker{display:none}
details.more2>summary::before{content:"＋";color:var(--red);margin-right:8px}
details.more2[open]>summary::before{content:"－"}
details.more2>summary small{display:block;font-weight:400;color:var(--mute);font-size:12px;padding-left:1.6em;line-height:1.5}
details.more2 .lyt{padding:0 12px 12px;white-space:pre-wrap;line-height:1.85;overflow-wrap:anywhere;font-size:14.5px}
details.more2 .bi{padding:0 12px 12px;line-height:1.7;overflow-wrap:anywhere;font-size:14.5px}
details.more2 .bi .o{margin:6px 0 0;font-size:13px;color:var(--mute);font-style:italic;font-family:var(--f-latin)}
details.more2 .bi .j{margin:0}
details.more2 .bi .sp{margin:12px 0 0;font-size:12.5px;font-weight:600;color:var(--red)}
details.more2 .bi .gap{height:10px}
details.more2 .lyn{margin:0 12px 8px;font-size:12.5px;color:var(--mute)}
.perf{font-size:12px;color:var(--mute);margin:12px 0 0;overflow-wrap:anywhere}
.verdict{display:flex;gap:16px;align-items:center;margin-top:22px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:14px 2px}
.stamp{width:88px;height:88px;flex:none;border-radius:50%;border:2px dashed var(--mute);color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;background:transparent;font:inherit;cursor:pointer;padding:0}
.stamp b{font-size:18px;letter-spacing:.1em;font-weight:800;padding-left:.1em}
.stamp span{font-size:10.5px;letter-spacing:.02em}
.stamp[aria-pressed="true"],.today .stamp{border:2.5px solid var(--red);color:var(--red);transform:rotate(-12deg);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4.5px var(--red)}
.stamp[aria-pressed="true"] span{font-family:var(--f-latin);font-size:12px;font-weight:600}
.marks{flex:1;min-width:0}
.marks .q{font-size:12px;color:var(--mute);letter-spacing:.1em;margin-bottom:6px}
.rate{display:flex;gap:6px}
.rate button{flex:1;font:inherit;border:1px solid var(--ink);background:transparent;color:var(--ink);text-align:center;font-size:15px;padding:7px 0;font-weight:600;cursor:pointer}
.rate button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.hnote{font-size:11.5px;color:var(--mute);margin-top:6px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.pager a{flex:1;min-width:0;text-decoration:none;border:1px solid var(--rule);padding:8px 10px;font-size:13px;line-height:1.45}
.pager a small{display:block;font-size:11px;color:var(--mute);letter-spacing:.1em}
.pager a span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager a.nx{text-align:right}

/* ページの中のプレーヤー */
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:3px double var(--ink);
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.player .pin{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.player .ph{display:flex;align-items:center;gap:8px;font-size:13px}
.player .ph span{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.player .ph a,.player .ph button{font:inherit;font-size:12px;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:3px 10px;text-decoration:none;cursor:pointer;white-space:nowrap}
.player .pv{position:relative;width:100%;aspect-ratio:16/9;max-height:34vh;background:#000;overflow:hidden}
.player iframe,.player #pframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .pmsg{margin:0;font-size:12.5px;color:var(--red)}
body.playing{padding-bottom:calc(40vh + 40px)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>

  <div class="meta"><span id="m-date"></span><span>4つのリスト</span></div>

  <div class="sec-h">本日の演目</div>

  <div class="sec-h">目　次</div>

<script>
const ALL = {"classical/abendrot":{"c":"R.シュトラウス","w":"4つの最後の歌","p":"「夕映えの中で」","pt":"オーケストラが、夕焼け空のようにゆったりと大きく広がって始まります。ソプラノが、長い人生を共に歩んできた2人の静かな心境を、深く落ち着いた声で歌います。フルートが2羽のひばりのようにさえずり、空へと舞い上がっていくのも美しいところ。歌が終わってからも、オーケストラの響きが夕闇の中にゆっくりと溶けていきます。","len":"9:59","g":"クラシック"},"classical/adagietto":{"c":"マーラー","w":"交響曲第5番","p":"第4楽章「アダージェット」","pt":"弦楽器とハープだけで、ゆっくりとためらうように始まります。ハープがぽつり、ぽつりと音を置き、その上で弦がささやくように想いを語りかけます。旋律は少しずつ熱を帯び、大きくふくらんで、胸がいっぱいになるような頂点へ。そのあとまた静かな祈りに戻っていく、甘くて切ない、愛の告白とも言われる音楽です。","len":"11:53","g":"クラシック"},"classical/albinoni":{"c":"アルビノーニ（ジャゾット）","w":"アルビノーニのアダージョ","p":"1曲","pt":"オルガンの静かな和音と、低い弦がぽつりぽつりとつまびく音の上で、ヴァイオリンが重く悲しいメロディを歌い出します。深い霧の中をゆっくり歩いていくような、しみるような哀しさです。途中でメロディは高く激しく高まり、こらえていた感情があふれ出したあと、また静けさに戻っていきます。じつは20世紀の学者ジャゾットの作とされる、バロック風の名曲です。","len":"6:57","g":"クラシック"},"classical/alpine":{"c":"R.シュトラウス","w":"アルプス交響曲","p":"全曲","pt":"深い夜の闇の中、低い音がゆっくりと沈んでいくところから始まります。やがて金管が輝かしく鳴りわたり、山の向こうから太陽が昇る瞬間は、思わず息をのむほどです。登山道をのぼり、滝や花畑を越えて、山頂では大きな感動が広がります。帰り道には激しい嵐に追われ、最後はふたたび静かな夜に包まれて、一日の旅が終わります。","len":"1:00:47","g":"クラシック"},"classical/american":{"c":"ドヴォルザーク","w":"弦楽四重奏曲「アメリカ」","p":"第1楽章","pt":"ヴァイオリンとチェロがさざめくように静かにリズムを刻むと、その上でヴィオラがのびやかな主題を歌い出します。どこか懐かしく素朴な旋律で、広い大地や青い空が目に浮かぶようです。アメリカ滞在中に書いた、明るい気分にあふれた曲。4人が楽しげに語り合い、ときに夢見るように歌いながら、さわやかに駆け抜けていきます。","len":"9:09","g":"クラシック"},"classical/appass":{"c":"ベートーヴェン","w":"ピアノ・ソナタ第23番「熱情」","p":"第3楽章","pt":"強く鋭い和音がくり返したたきつけられ、そこから細かい音が渦を巻くように流れ出して、一気に嵐の中へ投げこまれます。速い音の流れは止まることなく、怒りや不安がうねり続け、息をのむような緊迫感が続きます。終わり近くでテンポがさらに速まり、最後の力をふりしぼるような猛烈な勢いに。嵐のような情熱を燃やしつくし、激しくたたきつけるように終わります。","len":"7:35","g":"クラシック"},"classical/apresunreve":{"c":"フォーレ","w":"夢のあとに","p":"1曲","pt":"歌曲で、チェロでもよく弾かれます。静かな和音の上に、夢のなごりをたどるような、ため息まじりの旋律が流れます。思い出がよみがえるにつれて歌は高く熱をおび、「もう一度」と願う気持ちが胸にせまります。最後は目覚めたあとの静けさに戻り、さびしさを残して終わります。","len":"2:44","g":"クラシック"},"classical/arabesque":{"c":"ドビュッシー","w":"アラベスク第1番","p":"1曲","pt":"ピアノが、川の流れのように、なめらかに上がったり下がったりする音を描いて始まります。その流れの中から、透明でやさしい旋律が浮かび上がってきます。中ほどでは少し軽やかになり、光がはねるように楽しげな表情に。最後はまた流れるような音に戻り、水面に光が溶けていくように終わります。","len":"4:41","g":"クラシック"},"classical/aranjuez":{"c":"ロドリーゴ","w":"アランフエス協奏曲","p":"第2楽章","pt":"ギター協奏曲の名旋律です。ギターがやさしく和音を鳴らす中、イングリッシュホルン（オーボエの仲間で少し低い楽器）が、心にしみる旋律を歌いだします。ギターがそれを受けて、こまやかな飾りをつけながら語りなおします。後半、ギターひとりの深い独白のあと、オーケストラがせきを切ったように大きく歌いあげます。最後は静かに消えていきます。","len":"11:16","g":"クラシック"},"classical/arlminuet":{"c":"ビゼー","w":"「アルルの女」より","p":"メヌエット","pt":"ハープがやさしく和音を広げると、その上でフルートが澄んだ旋律を歌いはじめます。朝の光が差しこむ部屋のような、すがすがしく美しいメヌエットです。やがて弦も加わってふくらみ、温かさが増していきます。最後はまたフルートとハープのふたりに戻り、そっと静かに閉じます。","len":"3:58","g":"クラシック"},"classical/avemaria":{"c":"シューベルト","w":"歌曲「アヴェ・マリア」","p":"1曲","pt":"ピアノがハープのように、和音を1音ずつやさしく流して奏で、その上で歌がゆっくりと祈りを始めます。息の長い清らかな旋律が、少しずつ高まっては静かに落ち着き、心を包みこむように続きます。同じ旋律が節を変えてくり返され、聴くたびに安らぎが深まっていきます。日本でも親しまれる歌の、ろうそくの灯りのような静けさを味わってください。","len":"3:34","g":"クラシック"},"classical/avever":{"c":"モーツァルト","w":"アヴェ・ヴェルム・コルプス K.618","p":"1曲","pt":"弦の短い前奏のあと、合唱がとても小さな声で、ささやくように祈りを歌い始めます。メロディはなめらかに流れ、和音がやさしく移り変わるたびに、光がそっと差しこむような温かさが広がります。途中で少し陰りのある響きをくぐり抜け、最後は静かに、満ち足りたように閉じられます。3分ほどの短い曲なのに、心が深く洗われるようです。","len":"3:08","g":"クラシック"},"classical/b1":{"c":"ベートーヴェン","w":"交響曲第1番 ハ長調","p":"第1楽章","pt":"ゆったりした序奏が、いきなり落ち着かない和音で始まり、「おや？」と首をかしげるような不思議な入り方をします。やがてテンポが上がると、弦が軽やかに駆け出し、明るく元気な主題が勢いよく進んでいきます。ハイドンやモーツァルトのような端正な形の中に、ときどき力強いアクセントが顔を出し、若きベートーヴェンの意気ごみが感じられます。最後は晴れやかに、きっぱりと締めくくられます。","len":"9:46","g":"クラシック"},"classical/b2":{"c":"ベートーヴェン","w":"交響曲第2番 ニ長調","p":"第1楽章","pt":"長くゆったりとした序奏で始まり、堂々とした響きの中に、ときおり不安げな影がよぎります。やがて速い部分に入ると、弦が力強く走り出し、明るくエネルギーに満ちた音楽がはじけます。ところどころに激しいアクセントがあり、苦しみをはねのけるような強さが感じられます。遺書を書いたころとは思えない、まっすぐな明るさに胸が熱くなります。","len":"12:51","g":"クラシック"},"classical/b3":{"c":"ベートーヴェン","w":"交響曲第3番「英雄」","p":"第1楽章","pt":"オーケストラが「ジャン！ジャン！」と2つの力強い和音を打ち鳴らし、すぐにチェロがのびやかな主題を歌い出します。そこから音楽はどんどん大きく広がり、ぶつかり合うような激しいリズムが何度もたたきつけられ、戦いのような緊張が高まります。嵐をくぐり抜けたあとには、新しいメロディがしみじみと歌われる場面も。英雄の生きざまを描くようなスケールの大きな楽章で、ここから中期の「傑作の森」が始まります。","len":"16:56","g":"クラシック"},"classical/b4":{"c":"ベートーヴェン","w":"交響曲第4番 変ロ長調","p":"第1楽章","pt":"静かで薄暗い序奏で始まり、霧の中を手さぐりで歩くような、不思議な緊張がしばらく続きます。そして一気に霧が晴れるように、速く明るい音楽が勢いよく飛び出します。軽やかにはずむ弦と木管が、生き生きとじゃれ合うように駆けまわり、聴いているほうまで笑顔になります。「英雄」と「運命」にはさまれた、のびやかで明るい楽章です。","len":"12:15","g":"クラシック"},"classical/b5-1":{"c":"ベートーヴェン","w":"交響曲第5番 ハ短調「運命」","p":"第1楽章","pt":"いきなり扉をたたくような4つの音で、心臓をつかまれます。その小さな動機が、弦から管へ、ささやきから叫びへと形を変えて追いかけてきて、息をつく暇もありません。嵐のさなかに、オーボエがひとりで短くつぶやく一瞬は、張りつめた空気がふっとゆるむところ。最後はまた4つの音が力強くたたきつけられて終わります。","len":"7:22","g":"クラシック"},"classical/b6":{"c":"ベートーヴェン","w":"交響曲第6番「田園」","p":"第1楽章","pt":"弦楽器が、のどかでやさしいメロディを語りかけるように始めます。短いフレーズが何度もくり返され、少しずつ大きくふくらんでいくのは、まるで野原を歩きながら景色をゆっくり眺めているよう。木管もやわらかく応え、心がどんどんほどけていきます。田舎に着いたときの晴れやかな気分が、そのまま音になったような楽章です。","len":"8:57","g":"クラシック"},"classical/b7-1":{"c":"ベートーヴェン","w":"交響曲第7番 イ長調","p":"第1楽章","pt":"はじめはゆったりした序奏で、大きな和音のあいだに木管がやさしく歌い、何かが始まる予感が満ちていきます。同じ音のくり返しで橋をわたったあと、フルートが軽やかに「タッタ・ター」とはずむリズムを吹き出すと、いよいよ「のだめ」のオープニングでおなじみの部分です。このリズムが全身を揺らすようにくり返され、オーケストラ全体が踊り出すような高揚感へ。最後は勢いよく、晴れやかに駆け抜けます。","len":"13:43","g":"クラシック"},"classical/b7-2":{"c":"ベートーヴェン","w":"交響曲第7番 イ長調","p":"第2楽章","pt":"管楽器の和音がひとつ鳴ったあと、低い弦が「タン・タタ・タン・タン」という同じリズムを、静かにひっそりと刻み始めます。ほかの楽器が少しずつ加わり、葬送の行列が近づいてくるように大きくなっていきます。途中で明るい長調に変わり、クラリネットたちがやさしい夢を見るように歌う場面は、悲しみの中のひとすじの光。最後はまた静かな歩みに戻り、管楽器の和音で閉じられます。","len":"7:30","g":"クラシック"},"classical/b8":{"c":"ベートーヴェン","w":"交響曲第8番 ヘ長調","p":"第1楽章","pt":"前置きなしに、オーケストラ全体がいきなり明るく陽気な主題で始まります。きびきびしたリズムや、思わずくすりとするような、とぼけた強弱の変化があちこちに仕掛けられていて、聴いていて楽しくなります。小ぶりながら力強く盛り上がる場面もあり、充実した響きにも満ちています。最後は意外にも、最初の主題の一部が小さくぽつんと鳴って、いたずらっぽく終わります。","len":"9:17","g":"クラシック"},"classical/b9-4":{"c":"ベートーヴェン","w":"交響曲第9番「合唱つき」","p":"第4楽章","pt":"嵐のような激しい響きのあと、チェロとコントラバスが語りかけるように、前の楽章の思い出を1つずつ打ち消していきます。そして同じ低い弦が、ごく小さな音で「歓喜の主題」を歌い出す瞬間がやってきます。そのメロディはヴィオラ、ヴァイオリン、そしてオーケストラ全体へと、朝日が広がるように大きくなっていきます。やがてバリトン歌手が「おお友よ」と呼びかけ、合唱が加わって、喜びの頂点へとのぼりつめます。","len":"23:57","g":"クラシック"},"classical/bahnfrei":{"c":"エドゥアルト・シュトラウス","w":"ポルカ「テープは切られた」","p":"1曲","pt":"汽車の汽笛のような音を合図に、元気よく走り出します。速いリズムは、線路の上をぐんぐん進んでいく列車そのもの。窓の外の景色が次々に飛び去っていくような、爽快なスピード感が続きます。最後まで勢いを落とさず、楽しく駆け抜けて終点に着きます。","len":"2:42","g":"クラシック"},"classical/baldmt":{"c":"ムソルグスキー","w":"交響詩「禿山の一夜」","p":"1曲","pt":"弦楽器がざわざわとうずを巻き、金管が低くうなるように鳴って、不気味な夜の宴が始まります。魔物たちが飛びまわり、踊り狂う音楽は、どんどん激しく荒々しくなっていきます。待つべきは終わり近く、遠くで鐘が鳴る瞬間。魔物たちが消え、クラリネットやフルートが静かな夜明けを歌って、すがすがしく終わります。","len":"11:47","g":"クラシック"},"classical/ballade1":{"c":"ショパン","w":"バラード第1番 ト短調","p":"1曲","pt":"低い音から、問いかけるような静かな序奏がゆっくりとのぼっていきます。続いて、ためらいながら語り始めるようなもの悲しい旋律があらわれ、やがてやさしく夢見るような第2の旋律が心をなごませます。2つの旋律は姿を変えながら、だんだん大きく情熱的に高まっていきます。最後は嵐のように激しい部分へなだれこみ、劇的に幕を閉じます。","len":"10:28","g":"クラシック"},"classical/ballade4":{"c":"ショパン","w":"バラード第4番 ヘ短調","p":"1曲","pt":"同じ音をそっとくり返す、静かでやさしい序奏から始まります。続いて、ためらいがちで、どこか哀しげな旋律があらわれ、くり返すたびに飾りが増えて、表情を深めていきます。やがて穏やかな第2の旋律が広がり、音楽は大きく高まります。一瞬の静けさのあと、最後は嵐のように激しい部分で劇的に終わります。","len":"12:00","g":"クラシック"},"classical/barbaro":{"c":"バルトーク","w":"アレグロ・バルバロ","p":"1曲","pt":"打楽器のようにピアノをたたく曲です。いきなり、がんがんと低い和音がたたきつけられ、地の底から鳴りひびくようです。その上に、素朴で荒々しい民謡のような旋律が現れます。きれいに弾くことより、ごつごつした力そのものを聴く音楽です。最後まで勢いを落とさず、ぶっきらぼうにどんと終わります。","len":"2:31","g":"クラシック"},"classical/barber":{"c":"バーバー","w":"弦楽のためのアダージョ","p":"1曲","pt":"追悼の場面の定番の曲です。弦楽器だけで、とてもゆっくりと、静かな祈りのような旋律が始まります。旋律は少しずつ階段を昇るように高まり、悲しみがこらえきれなくなるところで、ひときわ高い叫びのような頂点を迎えます。そのあと突然の沈黙。そして静かな祈りに戻り、ろうそくの火が消えるように終わります。","len":"9:02","g":"クラシック"},"classical/barcarolle":{"c":"ショパン","w":"舟歌","p":"1曲","pt":"短い前奏のあと、左手がゆったりとゆれるリズムを刻みはじめ、ゴンドラが水の上をすべり出します。右手は2つの音を重ねた、甘い二重唱のような旋律を歌い、景色が次々に移り変わっていきます。終わり近く、旋律が大きく情熱的に高まるところは、この曲いちばんの聴かせどころ。晩年の傑作らしい深い味わいと輝きが、最後まで心を満たします。","len":"8:35","g":"クラシック"},"classical/bartokvla":{"c":"バルトーク","w":"ヴィオラ協奏曲","p":"全曲","pt":"落ち着いた中音域のヴィオラが主役の協奏曲です。冒頭、ヴィオラがほとんどひとりで、物思いにふけるようにぽつぽつと語りはじめます。全体に、深い孤独とあきらめのような静けさがただよいます。ゆっくりの部分は、心の奥をのぞきこむような祈りの音楽。最後の楽章で、民謡風の速い踊りに変わり、生きる力をとりもどすように終わります。","len":"22:45","g":"クラシック"},"classical/bells":{"c":"ラフマニノフ","w":"前奏曲 嬰ハ短調「鐘」","p":"1曲","pt":"浅田真央選手のプログラムでも有名な曲です。低く重い3つの音が、大きな鐘のように鳴って始まります。静かで暗い祈りのような部分のあと、中ほどでは不安にかられたように速く激しく駆けだします。そして最後、最初の鐘の和音が、何倍もの大きさで鳴りわたる場面が圧巻。余韻の中で静かに終わります。","len":"3:53","g":"クラシック"},"classical/blackkey":{"c":"ショパン","w":"練習曲「黒鍵」作品10-5","p":"1曲","pt":"右手がほぼ黒鍵だけを弾き、きらきら跳ねる光の粒のような音が、軽やかに転がっていきます。左手は弾むリズムで、その楽しさをしっかり支えます。明るくおどけた雰囲気で、まるで鍵盤の上で遊んでいるかのよう。最後は勢いよく駆け下りて、元気に締めくくります。","len":"1:41","g":"クラシック"},"classical/bminor":{"c":"バッハ","w":"ミサ曲 ロ短調 BWV232","p":"キリエ（動画は全曲。冒頭の約12分がキリエ）","pt":"合唱全員が「キリエ（主よ、憐れみたまえ）」と、重く大きな叫びを上げて始まります。そのあと楽器だけで、悲しみをたたえた長いメロディが静かに歩み出し、やがて合唱の声部が1つずつ同じメロディで加わって、何層にも積み重なっていきます。深い悲しみがゆっくり大きな祈りの流れになっていくさまは、まるで大聖堂の中にいるかのよう。晩年のバッハの集大成にふさわしい、重みのある始まりです。","len":"1:48:43","g":"クラシック"},"classical/bolero":{"c":"ラヴェル","w":"ボレロ","p":"1曲","pt":"小太鼓がごく小さな音でリズムを刻み始め、フルートが異国の香りのするメロディをそっと吹き出します。クラリネット、ファゴット…と楽器が次々に交代し、少しずつ仲間がふえて、音の色がうつり変わっていきます。小太鼓は最後まで同じリズムのまま、曲全体が1つの大きなクレッシェンド（だんだん強く）になっていきます。最後に一度だけ調が変わってぱっと景色が開け、頂点で一気にくずれ落ちるように終わります。","len":"14:54","g":"クラシック"},"classical/br1":{"c":"ブラームス","w":"交響曲第1番 ハ短調","p":"第1楽章","pt":"ティンパニが同じ低い音を重々しくたたき続ける中、弦楽器は上へ、木管は下へと引き裂かれるように進み、張りつめた序奏が始まります。やがて音楽は速くなり、激しくぶつかり合うような主題が力強く展開します。苦しみに立ち向かうような、息苦しいほどの緊張がずっと続きます。完成まで約21年かかった交響曲の、ずしりと重い第一歩を感じてください。","len":"16:00","g":"クラシック"},"classical/br2":{"c":"ブラームス","w":"交響曲第2番 ニ長調","p":"第1楽章","pt":"「ブラームスの田園」と呼ばれるとおり、低い弦が小さくつぶやいたあと、ホルンがのどかに歌い出し、夏の野原に日が差すように始まります。やがてチェロとヴィオラが、子守歌のようにやさしい旋律をゆったりと歌います。明るさの中に、ときおり低い金管がふっと影を落とすのもブラームスらしいところ。終わり近くのホルンのひとり歌は、夕暮れの風のようにあたたかく胸にしみます。","len":"20:57","g":"クラシック"},"classical/br3":{"c":"ブラームス","w":"交響曲第3番 ヘ長調","p":"第3楽章","pt":"映画「さよならをもう一度」で知られる哀愁のメロディを、まずチェロが低く、ため息のように歌い出します。同じ旋律がヴァイオリンへ、管楽器へと受けつがれるたびに、切なさが少しずつ色を変えていきます。後半、ホルンがひとりでこの旋律をもう一度歌うところは、遠い日を思い出すような胸の痛む瞬間。踊りのようでいて、どこまでもさびしい楽章です。","len":"6:32","g":"クラシック"},"classical/br4":{"c":"ブラームス","w":"交響曲第4番 ホ短調","p":"第4楽章","pt":"管楽器が、階段をのぼるような8つの和音を厳かに鳴らして始まります。この短い型が30回ほどくり返されながら、上にのる音楽だけが、激しく、やさしく、次々と姿を変えていきます。途中でテンポがゆるみ、フルートがひとりで寂しげに歌う場面は、嵐の合間の静かな祈りのよう。最後は再び激しさを増し、悲劇的な力強さで締めくくられます。","len":"10:55","g":"クラシック"},"classical/brand5":{"c":"バッハ","w":"ブランデンブルク協奏曲第5番 BWV1050","p":"全3楽章（第1楽章から）","pt":"第1楽章は、弦の合奏が明るく元気に走り出し、フルート、ヴァイオリン、チェンバロが楽しげにおしゃべりを始めます。やがてチェンバロがどんどん目立ちはじめ、ついにはほかの楽器がみな黙り込んで、ひとりで長いソロを弾きまくります。細かな音が雨のように降りそそぎ、どこまで行くのかとはらはらする、手に汗にぎる見せ場です。ソロが終わってみんなが戻ってくると、晴れ晴れとした気持ちで楽章が閉じます。","len":"20:48","g":"クラシック"},"classical/brclq":{"c":"ブラームス","w":"クラリネット五重奏曲","p":"第1楽章","pt":"弦楽器が、ゆれるような短い旋律をそっと奏でると、クラリネットが下から静かに立ちのぼってきます。その音色は、やわらかく少しかすれた、夕暮れの光のよう。晩秋に聴きたい曲と言われるとおり、温かさと寂しさがいつも重なり合っています。ときに激しく胸がさわぐ場面もありますが、最後は冒頭の旋律に戻り、静かに暮れていくように終わります。","len":"13:16","g":"クラシック"},"classical/bridal":{"c":"ワーグナー","w":"「婚礼の合唱」（「ローエングリン」より）","p":"1曲","pt":"合唱が、やさしくおだやかな声で、新しい夫婦を祝福する歌を歌い始めます。だれもが知っている旋律が、ゆったりと気品ある響きで広がっていきます。途中でいっそう静かな場面をはさみ、また最初の旋律が戻ってきます。結婚式でおなじみの合唱の、清らかで幸せな空気に包まれてください。","len":"6:30","g":"クラシック"},"classical/bru4":{"c":"ブルックナー","w":"交響曲第4番「ロマンティック」","p":"第1楽章","pt":"弦楽器のかすかなトレモロ（細かくふるわせる音）が霧のように広がる、「ブルックナー開始」で幕を開けます。その霧の中から、ホルンがひとり遠くへ呼びかけるように響き、夜明けの森が目をさまします。音楽はゆっくりとふくらみ、やがて金管が全員でまぶしく鳴りわたる大きな山場へ。静けさと壮大さを行き来する、ロマンティックな情景をたっぷり味わえます。","len":"17:45","g":"クラシック"},"classical/bru7":{"c":"ブルックナー","w":"交響曲第7番","p":"第2楽章","pt":"低くやわらかな金管と弦が、深い悲しみをたたえた旋律を重々しく歌い出します。尊敬するワーグナーの死を予感して書かれたという、葬送の音楽です。やがて弦が慰めるようなやさしい旋律を歌い、悲しみと祈りが何度も波のように寄せては返します。大きく高まって頂点で光が差したあと、音楽は静かに沈み、深い追悼の気持ちで終わります。","len":"21:15","g":"クラシック"},"classical/bru8":{"c":"ブルックナー","w":"交響曲第8番","p":"第4楽章","pt":"弦楽器が馬のひづめのようにリズムを刻み、その上で金管がいかめしいファンファーレを吹き鳴らして始まります。そのあと、静かな歌や祈るような場面をはさみながら、大きな山をいくつも越えていきます。待つべきは最後、それまでの楽章の主題が重なり合い、ハ長調でまばゆく輝くところ。「交響曲の最高峰」と言われるのも納得の、天に届くような終わりです。","len":"21:58","g":"クラシック"},"classical/bru9":{"c":"ブルックナー","w":"交響曲第9番","p":"第3楽章","pt":"ヴァイオリンが大きく跳び上がるような音で、天をあおぐように始まります。「愛する神に」ささげるつもりだった未完の最後の交響曲で、この世に別れを告げるような、深く澄んだ祈りの音楽です。途中、オーケストラ全体が叫びのような激しくぶつかり合う和音に達し、胸がしめつけられます。そのあと音楽はおだやかに静まり、ホルンのやわらかな響きの中で、安らかに消えていきます。","len":"25:32","g":"クラシック"},"classical/brvc":{"c":"ブラームス","w":"ヴァイオリン協奏曲 ニ長調","p":"第1楽章","pt":"まずオーケストラだけで、おだやかな主題がゆったりと広がります。待ちに待ったヴァイオリンは、激しく鋭い音で飛びこんできて、空気が一変。そこからはオーケストラとわたり合う、「三大ヴァイオリン協奏曲」にふさわしい堂々とした音楽です。カデンツァ（独奏者だけが腕を見せる部分）のあと、ヴァイオリンが高く静かに主題を歌う瞬間は、雲間から光が差すような美しさです。","len":"23:16","g":"クラシック"},"classical/bspring":{"c":"ベートーヴェン","w":"ヴァイオリン・ソナタ第5番「春」","p":"第1楽章","pt":"ヴァイオリンが、そよ風のようにやわらかな旋律を歌い出し、ピアノがさざ波のように寄りそいます。すぐにピアノも同じ旋律を歌い返し、2つの楽器が仲よく語り合うように進みます。ときおり力強く高まる場面もありますが、全体はあたたかな光に包まれたまま。明るいメロディから始まるこの楽章で、野原に花がひらくような気分を味わってください。","len":"9:57","g":"クラシック"},"classical/bturkish":{"c":"ベートーヴェン","w":"「トルコ行進曲」（劇音楽「アテネの廃墟」より）","p":"1曲","pt":"遠くから小さな行列が近づいてくるような、軽やかで弾むリズムで始まります。だんだん音が大きくなり、にぎやかな一行が目の前を通り過ぎたかと思うと、また遠ざかっていきます。ユーモラスで、どこか異国風の響きが楽しい短い曲。モーツァルトのものとは別の、ベートーヴェンの「トルコ行進曲」の味わいを楽しんでください。","len":"1:48","g":"クラシック"},"classical/bumblebee":{"c":"リムスキー＝コルサコフ","w":"熊蜂の飛行","p":"1曲","pt":"休みなく続く、細かく速い音の連なりで、熊蜂がブーンと飛びまわる様子をえがきます。上がったり下がったり、まとわりつくような半音（となりあう音）の動きに、思わず耳元がくすぐったくなるほど。1分ほどの短い曲ですが、息つく暇もない超高速の技は見事です。最後は、蜂がどこかへ飛び去っていくように、ふっと終わります。","len":"1:30","g":"クラシック"},"classical/bvc":{"c":"ベートーヴェン","w":"ヴァイオリン協奏曲 ニ長調","p":"第1楽章（動画は全曲。はじめの約25分）","pt":"ティンパニがそっと4つたたく、静かな音で始まります。木管楽器がおだやかな旋律を歌い、オーケストラがゆったりと世界を広げたあと、ようやくヴァイオリンが高い空へのぼるように登場します。のびやかで気品のある歌が、急がず、長い時間をかけて続いていきます。「三大ヴァイオリン協奏曲」の1つらしい、晴れた日の大きな景色のような明るさに身をまかせてください。","len":"47:09","g":"クラシック"},"classical/cage":{"c":"ケージ","w":"4分33秒","p":"1曲","pt":"演奏者は何も弾きません。客席のせき払い、エアコンの音、外の車の音など、そこに流れるすべてが「音楽」になります。聴く人が耳をすますと、ふだん気にもとめない音が、急に生き生きと聞こえてきます。ためしに部屋で、4分33秒、まわりの音に耳をかたむけてみてください。","len":"3:43","g":"クラシック"},"classical/campanella":{"c":"リスト","w":"ラ・カンパネッラ","p":"1曲","pt":"高い音でくり返し鳴る、小さな鐘のような澄んだ音が、まず耳に飛びこんできます。その鐘の音に乗って、どこか寂しげな旋律が歌われ、くり返されるたびに飾りの音がどんどん華やかになっていきます。右手が鍵盤の上を大きく跳び回る、目がくらむような難所が続き、最後は輝かしく一気に盛り上がります。超絶技巧の代表らしい、きらめきと哀愁が同居する曲です。","len":"4:52","g":"クラシック"},"classical/cancan":{"c":"オッフェンバック","w":"「天国と地獄」より","p":"カンカン","pt":"運動会のかけっこの定番です。前の部分が終わると、軽快な伴奏にのって、あの陽気な旋律が勢いよく飛びだします。シンバルやトライアングルがはなやかに鳴り、踊り子たちが足を高く上げてステージを駆けまわる情景が浮かびます。止まることを知らない明るさで、最後は一気にかけぬけて終わります。","len":"2:06","g":"クラシック"},"classical/canon":{"c":"パッヘルベル","w":"カノン","p":"1曲","pt":"チェロなどの低音が、ゆったりした8つの音の流れ（ポップスでおなじみ「カノン進行」の元）を静かにくり返し始めます。その上に1つめのヴァイオリンがメロディを奏で、少し遅れて2つめ、3つめが同じメロディで追いかけてきて、響きがどんどん豊かに重なっていきます。満ちてくる潮のように、温かさがふくらんでいきます。卒業式の定番らしい、別れと感謝がまじり合うような感動に包まれます。","len":"4:41","g":"クラシック"},"classical/cantabile":{"c":"チャイコフスキー","w":"アンダンテ・カンタービレ（弦楽四重奏曲第1番より）","p":"1曲","pt":"弱音器（音をやわらかくする器具）をつけた弦楽器が、ささやくように素朴で懐かしい旋律を歌い出します。民謡をもとにした、ふるさとの歌のような調べです。中ほどでは、チェロがぽつぽつと指ではじく音にのって、ヴァイオリンがもう1つの美しい旋律を歌います。最後は静かな祈りのように消えていき、心の奥にそっと涙がにじむような音楽です。","len":"7:46","g":"クラシック"},"classical/capriccio":{"c":"チャイコフスキー","w":"イタリア奇想曲","p":"1曲","pt":"トランペットの合図のあと、弦楽器が重く悲しげな旋律を歌い、少し暗い幕開けとなります。そこへオーボエが、イタリアの街角で聞こえてきそうな陽気な歌を運んできて、空気がぱっと明るくなります。いくつもの歌や踊りが次々と現れ、旅の思い出をめくっていくよう。最後はタランテラ（南イタリアの速い踊り）で、お祭り騒ぎのように駆け抜けます。","len":"16:01","g":"クラシック"},"classical/caprice24":{"c":"パガニーニ","w":"24のカプリース 第24番","p":"1曲","pt":"ヴァイオリン1本だけで、短く、きびきびとした主題が示されます。そこから変奏（形を変えてくり返すこと）が次々に始まり、同じ主題が跳びはねたり、2つの音を同時に鳴らしたり、指ではじかれたりと、まったくちがう顔を見せます。ひとつの楽器から出ているとは思えない多彩な響きに、息をのむでしょう。多くの作曲家が変奏曲にした主題の、原点です。","len":"4:35","g":"クラシック"},"classical/carmen":{"c":"ビゼー","w":"歌劇「カルメン」","p":"前奏曲","pt":"オペラの幕開けにふさわしい、はなやかな音楽で始まります。闘牛士の行進のにぎわいで、シンバルが鳴り、人々の歓声が聞こえてくるようです。中ほどでは、あの「闘牛士の歌」の旋律が堂々と現れます。ところが最後に、低い弦が暗く重い旋律をうなりだし、空気が一変。これから起こる悲劇の予感を残したまま、突然とぎれます。","len":"2:22","g":"クラシック"},"classical/carnaval":{"c":"シューマン","w":"謝肉祭 作品9","p":"全曲","pt":"華やかで堂々とした前口上のような曲で、仮面舞踏会の幕が開きます。そのあとは、道化師や恋する人、夢見がちな青年と情熱的な青年など、いろいろな人物を描いた短い曲が次々にあらわれ、舞踏会の会場を歩きまわっているよう。一曲ごとに表情がくるくる変わるのが楽しいところです。最後は勢いのよい行進曲で、にぎやかに幕が下ります。","len":"26:42","g":"クラシック"},"classical/casals":{"c":"バッハ","w":"無伴奏チェロ組曲第1番","p":"プレリュード（カザルスの録音）","pt":"この曲を世に知らしめた録音です。チェロが、ゆたかな低音から高い音まで、波のように音を広げながら、流れるように歌いだします。古い録音で雑音もありますが、力強い弓づかいと人間らしいあたたかさが、まっすぐに伝わってきます。終わり近く、高みへのぼりつめていく盛り上がりは、まるで祈りのようです。","len":"2:29","g":"クラシック"},"classical/cello1":{"c":"バッハ","w":"無伴奏チェロ組曲第1番 BWV1007","p":"プレリュード","pt":"チェロ1本が、ゆったりと波打つような分散和音を、途切れなく弾き続けます。低い音のふくよかさと、高い音へのぼっていく明るさが交互に現れ、まるで1人で何人分もの響きを生み出しているよう。後半は少しずつ緊張が高まり、高い音へと駆けのぼったあと、深く豊かな和音で堂々と結ばれます。CMなどでおなじみの、温かく満ち足りた音楽です。","len":"3:16","g":"クラシック"},"classical/cfo":{"c":"バルトーク","w":"管弦楽のための協奏曲","p":"全曲","pt":"オーケストラの各楽器が主役になる曲です。暗い霧の中から始まり、楽章ごとに、ファゴットやトランペットなどがふたりずつ組んで、かけ合いを楽しむ場面もあります。第4楽章では、なつかしい甘い歌が、とつぜん笑い声のような音に邪魔され、ユーモアたっぷり。最後の楽章は弦が猛スピードで駆けまわり、輝かしいフィナーレを迎えます。","len":"44:06","g":"クラシック"},"classical/chaconne":{"c":"バッハ","w":"無伴奏ヴァイオリン・パルティータ第2番","p":"シャコンヌ","pt":"ヴァイオリン1挺が、重い和音を押しつけるように鳴らし、厳かな歩みで始まります。同じ短い和音の流れの上で、少しずつ姿を変える変奏が延々と積み重なり、悲しみ、激しさ、祈りが次々に現れます。途中で明るい長調に変わる場面は、雲間から光が差しこむよう。最後はふたたび暗い調に戻り、大伽藍の扉が静かに閉じるように終わります。","len":"15:17","g":"クラシック"},"classical/clair":{"c":"ドビュッシー","w":"「月の光」（ベルガマスク組曲より）","p":"1曲","pt":"ベートーヴェンの「月光」とは別の、ドビュッシーのピアノ曲です。ピアノが、ためらうように和音をそっと置いて始まり、夜空の月の光が水面にやわらかく映るような情景が広がります。中ほどで、さざ波のような流れる音にのって旋律が大きく歌い、月の光がいっぱいにあふれる瞬間に。やがてまた静かに戻り、夜の空気に溶けこむように終わります。","len":"5:27","g":"クラシック"},"classical/classical":{"c":"プロコフィエフ","w":"古典交響曲（交響曲第1番）","p":"全曲","pt":"ハイドンが今生きていたら、という発想で書かれた、短くて明るい交響曲です。冒頭から音がはずむように飛びだし、ヴァイオリンが軽やかにジャンプします。ゆっくりの楽章では、ヴァイオリンが高い音で夢のような旋律を歌います。最後の楽章は、息をつく間もないほど速く元気で、すがすがしく駆けぬけます。","len":"18:48","g":"クラシック"},"classical/conquering":{"c":"ヘンデル","w":"「見よ、勇者は帰る」（ユダス・マカベウスより）","p":"1曲","pt":"日本では表彰式でおなじみの、晴れやかなメロディで始まります。最初はやわらかく、喜びをかみしめるように歌われ、やがて大きな合唱と楽器が加わって、勝利を祝う響きが堂々と広がっていきます。勇者をむかえる人々の拍手が聞こえてきそうな、誇らしく温かい気持ちに包まれます。くり返される同じメロディが、聴くほどに胸を熱くします。","len":"2:13","g":"クラシック"},"classical/corelli8":{"c":"コレッリ","w":"合奏協奏曲 作品6-8「クリスマス協奏曲」","p":"全曲","pt":"弦楽器の合奏で、ゆっくりと厳かな部分と、きびきびと走る部分が、短い楽章ごとに入れかわっていきます。数人の独奏と大きな合奏が呼びかけと答えのように響き合うのが、合奏協奏曲の楽しさです。落ち着いた和音が重なる場面では、冬の夜の教会に灯がともるような静けさが広がります。全曲が、温かなクリスマスの空気に満ちています。","len":"16:08","g":"クラシック"},"classical/cpc1":{"c":"ショパン","w":"ピアノ協奏曲第1番 ホ短調","p":"第2楽章","pt":"弱音器（音をやわらげる器具）をつけた弦楽器の、やわらかな響きで静かに始まります。やがてピアノが、夢見るように甘く、しっとりとした旋律を歌い出します。途中で少し胸さわぎのする場面もありますが、すぐに穏やかな歌が戻り、繊細な飾りの音が水面の光のようにきらめきます。20歳前後の若いショパンの、純粋でやさしい心が伝わってくる楽章です。","len":"12:35","g":"クラシック"},"classical/csikos":{"c":"ネッケ","w":"クシコス・ポスト","p":"1曲","pt":"運動会のかけっこの定番です。小気味よいリズムが、馬のひづめの音のように、ぱかぱかと駆けだします。はらはらする短調の旋律で走り続け、途中で明るい長調に変わると、ほっとひと息。でもまたすぐに駆けだし、最後は全速力でゴールに飛びこむように終わります。","len":"2:11","g":"クラシック"},"classical/cygnets":{"c":"チャイコフスキー","w":"バレエ「白鳥の湖」","p":"4羽の白鳥の踊り","pt":"ファゴットが「トン、トン」と小刻みにリズムを刻み、その上で木管が、ちょこちょこと可愛らしい旋律を奏でます。小さな白鳥たちが、そろって足を細かく動かす様子が目に浮かぶようです。短い曲ですが、最後まで少しもくずれない、きっちりとした楽しさ。思わず笑顔になれる小品です。","len":"2:14","g":"クラシック"},"classical/d960":{"c":"シューベルト","w":"ピアノ・ソナタ第21番 D960","p":"第1楽章","pt":"おだやかで賛美歌のような旋律が、ゆっくりと語りかけるように始まります。そのすぐあと、低い音がかすかにふるえて、遠くで雷が鳴ったような、言いようのない不安が影を落とします。旋律はさまざまな調へとさまよい、明るさと寂しさが入りまじりながら、長い時間をかけて進んでいきます。最後のピアノ・ソナタの、静かな別れの気配を感じてください。","len":"20:15","g":"クラシック"},"classical/danube":{"c":"J.シュトラウス2世","w":"美しく青きドナウ","p":"1曲","pt":"弦楽器がさざめくような、かすかな響きの中から、ホルンがやさしく呼びかけて始まります。夜明けの川面に光が差しこんでいくような、静かで美しい序奏です。やがて、あの優雅なワルツの旋律が流れ出し、いくつものワルツが次々に姿を変えながら続きます。オーストリアの「第2の国歌」らしい、大河の流れに身をまかせるような気分を味わってください。","len":"10:31","g":"クラシック"},"classical/daphnis":{"c":"ラヴェル","w":"「ダフニスとクロエ」より","p":"夜明け","pt":"せせらぎのような細かい音が、さざ波のようにたえず流れはじめます。その下から低い弦の旋律がゆっくりと昇ってきて、あちこちで鳥のさえずりが聞こえます。光がどんどん強くなり、合唱も加わって、ついに朝日が大地をまぶしく照らす瞬間がやってきます。胸いっぱいに朝の空気を吸いこむような、あふれる高揚感です。","len":"6:31","g":"クラシック"},"classical/deathmaiden":{"c":"シューベルト","w":"弦楽四重奏曲「死と乙女」","p":"第2楽章","pt":"4つの弦楽器が、低く静かな和音で、死神がそっと語りかけるような主題を奏でます。その主題が変奏されるたびに、細かくふるえる音や激しいリズムが加わり、恐れや抵抗、祈りのような感情が次々にわき上がります。いちばん激しい変奏を過ぎると、音楽はだんだん落ち着いていきます。最後に明るい長調の静かな響きで終わるところは、安らぎに迎え入れられるようです。","len":"13:46","g":"クラシック"},"classical/dichter":{"c":"シューマン","w":"歌曲集「詩人の恋」","p":"第1曲「美しい五月に」","pt":"ピアノが、ためらうような、宙に浮いた和音で静かに始まります。歌は「美しい五月に恋が芽生えた」と語りますが、響きは明るいとも暗いとも言いきれず、甘さと不安が入りまじります。曲は落ち着く先のない、問いかけるような響きのまま終わり、心はそのまま次の歌へと引き寄せられます。ハイネの詩による歌曲集の、はかない恋の始まりです。","len":"1:28","g":"クラシック"},"classical/donjuan":{"c":"R.シュトラウス","w":"交響詩「ドン・ファン」","p":"1曲","pt":"弦楽器が勢いよく駆け上がる、まばゆい始まりで、若く情熱的な主人公が飛び出してきます。恋の場面では、ヴァイオリンやオーボエが甘くとろけるように歌い、うっとりさせられます。やがてホルンが堂々と英雄的な主題を吹き、音楽は輝きの頂点へ。けれど最後は突然ぷつりと力が抜け、暗く静かな和音で終わる、その落差が胸に残ります。","len":"20:22","g":"クラシック"},"classical/donquixote":{"c":"R.シュトラウス","w":"交響詩「ドン・キホーテ」","p":"1曲","pt":"独奏チェロが、夢見がちで誇り高い騎士ドン・キホーテを演じます。風車に突っこんだり、空を飛んだつもりになったりと、思いこみの大冒険が、変奏（同じテーマの形を変えていく）としてにぎやかに続きます。おかしさの奥には、いつもどこか物悲しさが漂います。最後、正気に戻った騎士が静かに息を引き取る場面で、チェロが下へすべり落ちる音は、涙をさそう別れです。","len":"43:44","g":"クラシック"},"classical/dorfschw":{"c":"ヨーゼフ・シュトラウス","w":"オーストリアの村つばめ","p":"1曲","pt":"のどかな田舎の風景が広がるような、おだやかな序奏で始まります。そこに小鳥の鳴き声のような音が加わり、つばめが空を飛び交う様子が目に浮かびます。ワルツが始まると、素朴でやさしい旋律が、春の野をわたる風のように流れていきます。鳥の声をまねる楽器が入るのが楽しい、ほのぼのとしたワルツです。","len":"8:49","g":"クラシック"},"classical/dupre":{"c":"エルガー","w":"チェロ協奏曲","p":"全曲（デュ・プレの録音）","pt":"若き天才の燃えるような演奏です。冒頭、チェロが力強く和音をかき鳴らし、心の底から叫ぶように始まります。続いてヴィオラが静かに歌いだす、哀しみをたたえた旋律を、チェロが受けつぎ、胸をえぐるような音で歌いあげます。ゆっくりの楽章では、ささやくような優しさに心をうばわれます。全曲を通して、情熱がほとばしる演奏です。","len":"29:55","g":"クラシック"},"classical/dvcello":{"c":"ドヴォルザーク","w":"チェロ協奏曲 ロ短調（ドボコン）","p":"第1楽章（動画は全曲。はじめの約15分）","pt":"クラリネットが低く静かに主題を奏で、少しずつオーケストラ全体が高まっていきます。やがてホルンがひとりで歌う第2主題は、ふるさとの山々を思わせる、胸がしめつけられるような美しさ。そして満を持して、チェロが堂々と力強く主題を歌い出す瞬間は鳥肌ものです。ほとばしる情熱と深い郷愁が交わる、チェロ協奏曲の最高峰の始まりです。","len":"39:43","g":"クラシック"},"classical/eine":{"c":"モーツァルト","w":"アイネ・クライネ・ナハトムジーク K.525","p":"第1楽章","pt":"弦楽器だけが声をそろえて、元気よく駆け上がる出だしで幕が開きます。だれもが一度は耳にしたこの明るいメロディのあとには、もっとやわらかで上品な歌が続き、晴れた日の庭を散歩しているよう。「小さな夜の音楽」という題のとおり小さな弦の合奏なのに、きびきびとしたリズムで気持ちが自然と弾みます。最後まで曇りのない、すがすがしい楽しさにあふれた楽章です。","len":"5:39","g":"クラシック"},"classical/elephant":{"c":"サン＝サーンス","w":"「動物の謝肉祭」より","p":"象","pt":"コントラバスが重い象を演じます。ピアノのはずむ伴奏にのって、いちばん低い弦楽器がずしん、ずしんとワルツを踊りだします。本人はいたって真剣に、優雅にステップを踏んでいるつもりなのが、かえってほほえましいところ。重たい体でくるりと回る姿が目に浮かんで、思わず笑顔になります。","len":"1:36","g":"クラシック"},"classical/elgarcello":{"c":"エルガー","w":"チェロ協奏曲 ホ短調","p":"第1楽章","pt":"独奏チェロが、重く力強い和音で、苦しみを吐き出すように始まります。続いてヴィオラが、ゆれるような哀しい旋律をそっと歌い、チェロがそれを受けついで、胸の奥の悲しみを切々と歌い上げます。秋の枯れ野にひとり立つような、静かで深い孤独を感じる音楽です。デュ・プレの演奏で知られるとおり、チェロの太く温かい声が心をゆさぶります。","len":"8:07","g":"クラシック"},"classical/elise":{"c":"ベートーヴェン","w":"エリーゼのために","p":"1曲","pt":"ミとレ♯を行き来する、ためらうような小さな音型から始まります。おなじみの旋律のあと、少し明るくやさしい部分や、低い音がざわざわと鳴り続ける不安げな部分がはさまります。そのたびに最初の旋律が戻ってきて、ほっとするような、切ないような気持ちに。だれに宛てたのか謎のままの「エリーゼ」の面影を、想像しながら聴いてみてください。","len":"4:01","g":"クラシック"},"classical/emperor":{"c":"ベートーヴェン","w":"ピアノ協奏曲第5番「皇帝」","p":"第1楽章","pt":"オーケストラの堂々とした和音が鳴るたびに、ピアノがきらびやかな音の階段で応える、華やかな幕開けです。続いてオーケストラが力強い主題を示し、やがてピアノも加わって、ときに雄々しく、ときに夢見るように歌います。明るく輝かしい響きは、まさに王者の風格。最後のピアノ協奏曲らしい、堂々とした広がりを胸いっぱいに感じてください。","len":"20:45","g":"クラシック"},"classical/erde":{"c":"マーラー","w":"大地の歌","p":"第1楽章","pt":"ホルンが叫ぶように鳴りひびき、テノールが酒をたたえる歌を、ほとんどやけになったように歌い始めます。唐の詩をもとにした「大地の哀愁をうたう酒の歌」です。にぎやかな音楽の中に、「生は暗く、死もまた暗い」という言葉がくり返し現れ、そのたびに背すじが冷たくなります。陽気さと絶望が背中合わせの、激しく苦い楽章です。","len":"8:07","g":"クラシック"},"classical/erlking":{"c":"シューベルト","w":"歌曲「魔王」","p":"1曲","pt":"ピアノの激しい連打で、夜の森を馬が駆けていく緊迫感が、いきなり伝わってきます。父・子・魔王・語り手を1人の歌手が歌い分け、魔王の甘くささやく声と、おびえて叫ぶ子どもの声の対比にぞっとさせられます。子どもの叫びは、くり返すたびに高く、切迫していきます。最後にピアノが止まり、語り手が静かに告げる結末に息をのみます。","len":"4:13","g":"クラシック"},"classical/fantimp":{"c":"ショパン","w":"幻想即興曲","p":"1曲","pt":"低い音のひと鳴らしのあと、右手と左手がちがうリズムで速く駆けめぐり、胸さわぎのような渦が巻き起こります。中間部では一転して、ゆったりと甘く夢見るような旋律が歌われ、時間が止まったかのよう。そしてまた速い渦が戻ってきます。最後は静かに、遠い思い出をかみしめるように、そっと消えていきます。","len":"6:23","g":"クラシック"},"classical/farandole":{"c":"ビゼー","w":"「アルルの女」より","p":"ファランドール","pt":"南フランスの踊りです。はじめに、弦が力強い行進の旋律をくり返し、重々しく堂々と歩みだします。やがて太鼓がリズムを刻み、軽やかで速い踊りの旋律が、くるくると回りはじめます。最後は、行進と踊りのふたつの旋律が重なり合い、お祭りの熱気が最高潮にのぼりつめて、一気に終わります。","len":"3:01","g":"クラシック"},"classical/farewell":{"c":"ショパン","w":"練習曲「別れの曲」作品10-3","p":"1曲","pt":"ゆったりとした、心にしみる美しい旋律が、静かに語りかけるように始まります。中間では音楽が急に高ぶり、激しくぶつかり合うような和音が続いて、胸がざわめきます。その嵐が過ぎると、ふたたび最初の旋律が戻ってきて、さっきよりいっそういとおしく響きます。日本での愛称「別れの曲」のとおり、なごりを惜しむような切なさにあふれています。","len":"4:28","g":"クラシック"},"classical/faune":{"c":"ドビュッシー","w":"牧神の午後への前奏曲","p":"1曲","pt":"ひとりのフルートが、けだるくゆらめくように吹きはじめます。この数秒の響きが、新しい時代の扉を開けたと言われます。ハープがさっと光をまき、ホルンが遠くでこたえると、夏の午後の熱気と眠気がゆっくり広がっていきます。中ほどで弦がふくらむ甘い歌は、夢がいちばん近づく瞬間。最後は小さな鐘のような響きの中に、ふっと溶けて消えます。","len":"11:46","g":"クラシック"},"classical/fetes":{"c":"ドビュッシー","w":"「夜想曲」より","p":"祭り","pt":"いきなり弦が軽やかに走りだし、木管がはしゃいで、夜祭りの浮き立つ空気に包まれます。ふと音が静まると、遠くからかすかな行進のリズムが聞こえてきます。弱音器をつけたトランペットの音が、一歩ずつ近づき、ついに目の前を華やかに通りすぎる瞬間が聴きどころ。最後は祭りの灯が遠ざかるように、すっと消えていきます。","len":"6:16","g":"クラシック"},"classical/feuxfollets":{"c":"リスト","w":"超絶技巧練習曲 第5番「鬼火」","p":"1曲","pt":"とても軽く小さな音で、指先から光の粒がこぼれ落ちるような細かい動きが始まります。音がちらちらと上下にゆれ、つかもうとすると逃げていく、いたずらな火の玉のよう。ときに少し強まって不思議な影がさしますが、すぐにまた暗闇へ溶けこみます。ちらちら光る鬼火を描く超難曲の、重さをまったく感じさせない軽やかさにおどろかされます。","len":"4:06","g":"クラシック"},"classical/fidelio":{"c":"ベートーヴェン","w":"オペラ「フィデリオ」","p":"序曲","pt":"オーケストラの力強い呼びかけでいきなり幕が開き、すぐにゆっくりした静かな部分へ移ります。ホルンや木管がやわらかく響き、これから始まる物語への期待がふくらんでいきます。やがて音楽は速く明るく走り出し、最後は勢いよく盛り上がって終わります。唯一のオペラにつけられた序曲の、短くても晴れやかな幕開けを楽しんでください。","len":"6:59","g":"クラシック"},"classical/figaro":{"c":"モーツァルト","w":"オペラ「フィガロの結婚」","p":"序曲","pt":"弦楽器が、ひそひそ話をするように小さな音で、すばやく駆けまわって始まります。ほんの一瞬ためたあと、オーケストラ全体が「わっ」と明るく爆発し、楽しい騒ぎの予感でいっぱいに。そのあとも、ささやきと大騒ぎが目まぐるしく入れかわり、早口の喜劇を見ているようなわくわく感が続きます。最後まで勢いよく駆け抜けて、さっと幕を下ろすように終わります。","len":"4:39","g":"クラシック"},"classical/fingal":{"c":"メンデルスゾーン","w":"序曲「フィンガルの洞窟」","p":"1曲","pt":"低めの弦楽器とファゴットが、寄せては返す波のような短い旋律をくり返して始まります。やがてチェロがゆったりと大きな旋律を歌い、海の広さと深さが目の前に広がります。途中では波が荒れ、金管が鳴りひびいて、嵐のような緊張が高まります。スコットランドの島の洞窟の情景が、ひんやりした潮風とともに浮かんでくる曲です。","len":"9:58","g":"クラシック"},"classical/finlandia":{"c":"シベリウス","w":"交響詩「フィンランディア」","p":"1曲","pt":"金管が低く重く、うめくような和音を鳴らし、暗く苦しい始まりとなります。やがて音楽は力強く立ち上がり、たたかうような激しい部分へ。そこからふっと静まり、木管が祈るように清らかな賛歌の旋律を歌い出す瞬間は胸がいっぱいになります。最後は「第2の国歌」と呼ばれるにふさわしい、希望に満ちた輝かしい響きで締めくくられます。","len":"8:12","g":"クラシック"},"classical/firebird":{"c":"ストラヴィンスキー","w":"バレエ「火の鳥」","p":"カスチェイ王の魔の踊り","pt":"ロシアの民話のバレエです。いきなり、おどろかすような大きな一撃で始まります。魔法をかけられた魔物たちが、とつぜん激しく踊りだし、金管や打楽器がとがったリズムでぐいぐい押しよせます。これでもかと荒れ狂ったあとは、静かな子守歌をはさみ、終曲のまばゆい盛り上がりへとつながっていきます。","len":"4:40","g":"クラシック"},"classical/fireworks":{"c":"ヘンデル","w":"王宮の花火の音楽","p":"序曲","pt":"トランペットとホルン、ティンパニがそろって、堂々とした響きでゆっくりと幕を開けます。祝典にふさわしい誇らしさが、広場いっぱいに満ちていくようです。やがて速い部分に入ると、楽器たちがかけ合いながら勢いよく走り出し、空に花火が次々と打ち上がるような華やかさに。戦争が終わった喜びを、晴れやかな音で高らかに祝います。","len":"6:04","g":"クラシック"},"classical/flax":{"c":"ドビュッシー","w":"亜麻色の髪の乙女","p":"1曲","pt":"前奏曲集の1曲で、ピアノがひとり、素朴でやさしい旋律を口ずさむように始まります。風にそよぐ明るい髪の少女が、ほほえんでいる姿が目に浮かぶようです。和音はやわらかく重なり、ふっと遠い夢を見るように色合いを変えていきます。短い曲ですが、心がほどけるような、やさしい余韻が残ります。","len":"2:43","g":"クラシック"},"classical/flowers":{"c":"チャイコフスキー","w":"バレエ「くるみ割り人形」","p":"花のワルツ","pt":"木管の和音に続いて、ハープが花びらを広げるように華やかな前奏を奏でます。そしてホルンたちが、やわらかく歌うようにワルツを始め、クラリネットが答えます。中ほどでは、ヴィオラとチェロが大きく胸をふくらませる熱い旋律を歌い、気持ちが高まります。最後は花が一斉に咲きほこるように、まぶしく盛り上がって終わります。","len":"7:32","g":"クラシック"},"classical/fortuna":{"c":"オルフ","w":"「カルミナ・ブラーナ」より","p":"おお、運命の女神よ","pt":"映画・CM・テレビで大人気の曲です。大合唱とティンパニが、いきなり天をふるわせるような叫びを上げます。そのあと声は急に小さくなり、ひそひそとささやくように速く歌い続け、不安な気持ちをあおります。そして一気にあふれ出すように大きくなり、最後は全員の大音量で、運命の重さをたたきつけて終わります。","len":"2:22","g":"クラシック"},"classical/fruhling":{"c":"J.シュトラウス2世","w":"春の声","p":"1曲","pt":"短い前奏のあと、すぐに明るく弾むワルツが、春の光のようにきらきらと流れ出します。高い音が小鳥のさえずりのように軽やかに舞い、雪どけの野原に花が咲きはじめるよう。旋律は途切れることなく次々に移り変わり、うきうきした気分がどこまでも続きます。春らしい華やかなワルツで、心まで軽くなります。","len":"7:46","g":"クラシック"},"classical/funeral":{"c":"ショパン","w":"ピアノ・ソナタ第2番","p":"第3楽章「葬送行進曲」","pt":"低い和音が、重い足取りのように、鐘の音のように規則正しく鳴り続け、悲しみの行列がゆっくりと進んでいきます。中間部では一転して、やさしく清らかな旋律が、天からの慰めのように静かに歌われます。そのあと再び重い行進が戻り、悲しみがいっそう深く胸に迫ります。葬送行進曲で有名なソナタの、心の奥にずしりと響く楽章です。","len":"10:33","g":"クラシック"},"classical/furt9":{"c":"ベートーヴェン","w":"交響曲第9番","p":"全曲（フルトヴェングラーのバイロイト盤）","pt":"戦後初めてのバイロイト音楽祭の再開を飾ったライヴ録音です。第1楽章は、霧の中から何かが生まれるような、かすかなふるえから始まります。指揮者は大きく自由にテンポを動かし、演奏全体に、生きている人間の息づかいのような熱がこもります。最後の合唱では「歓喜の歌」が高らかに鳴り、終わり近くで指揮者が一気に速めて、オーケストラが嵐のように駆けぬけます。","len":"1:14:41","g":"クラシック"},"classical/gair":{"c":"バッハ","w":"G線上のアリア（管弦楽組曲第3番より）","p":"1曲","pt":"低音がゆっくり一歩ずつ歩くように進み、その上でヴァイオリンが、ひとつの音を長く長くのばして歌い出します。のびた音がふっと次の音へほどけていくたびに、胸の奥がしずかに温まっていくよう。急ぐところはひとつもなく、祈りのような穏やかさが最後まで続きます。疲れた日の終わりに、深呼吸しながら聴きたい1曲です。","len":"6:03","g":"クラシック"},"classical/glass":{"c":"グラス","w":"メタモルフォシス第1番","p":"1曲","pt":"短い音型を少しずつ変えてくり返すピアノ曲です。左右の手が、同じ形を静かにくり返し、まるで雨の中を歩いているような、ゆらゆらした気分になります。少しずつ響きが変わり、そこはかとない哀しみがしみこんできます。言葉にできないもどかしさや、ひとりの時間の静けさを感じる音楽です。","len":"5:40","g":"クラシック"},"classical/gnoss":{"c":"サティ","w":"グノシエンヌ第1番","p":"1曲","pt":"小節線のない、ふしぎな曲です。同じ伴奏の形が、ゆらゆらとくり返されます。その上を、どこか遠い国の言葉のような、くねくねとした旋律がさまよいます。決まった拍子に縛られず、思いつくままに歩いているような自由さがあります。薄暗い部屋で、ろうそくの火を見つめているような、神秘的な気分になります。","len":"4:11","g":"クラシック"},"classical/godzilla":{"c":"伊福部昭","w":"映画「ゴジラ」","p":"メインタイトル","pt":"だれもが知るゴジラのテーマです。低い音で、ずん、ずん、ずんと重いリズムが始まり、巨大な何かがゆっくり近づいてくるのが伝わってきます。同じ形がしつこくくり返されるうちに、音は大きく、力強くなっていき、背すじがぞくっとします。逃げられない迫力と、どこか悲しい響きがまじり合う音楽です。","len":"2:11","g":"クラシック"},"classical/goldberg":{"c":"バッハ","w":"ゴルトベルク変奏曲 BWV988","p":"アリア","pt":"ゆったりとした3拍子の上で、細かな飾りのついたメロディが、ひとりごとのように静かに歌われます。音数は少なく、ひとつひとつの音がやさしく置かれていくので、思わず耳をすませてしまいます。このアリアの低音の流れをもとに、30の変奏が次々と生まれていきます。グールドの録音で聴くと、澄んだ音の粒が夜の静けさにしみこんでいくようです。","len":"5:48","g":"クラシック"},"classical/golliwog":{"c":"ドビュッシー","w":"ゴリウォーグのケークウォーク（子供の領分より）","p":"1曲","pt":"娘のために書いた曲集の1曲です。ころころと転がり落ちるような出だしのあと、黒い人形がおどけて腰をふるような、はずむリズムが始まります。途中で急に足を止め、わざと大げさにため息をつく場面があり、思わずくすっと笑ってしまいます。最後はまたはしゃぎだし、ぴょんと跳ねて終わります。","len":"2:58","g":"クラシック"},"classical/gorecki":{"c":"グレツキ","w":"交響曲第3番「悲歌のシンフォニー」","p":"第2楽章","pt":"静かで祈るような曲です。低い弦が、暗く重い和音をゆっくりと鳴らすところから始まります。そこにソプラノ（女声の高い声）が、ささやくように、そっと歌いはじめます。声は少しずつ高くなり、悲しみをこらえて祈る気持ちが胸に迫ります。最後は静かに、すべてを包みこむような響きの中で終わります。","len":"9:28","g":"クラシック"},"classical/gould55":{"c":"バッハ","w":"ゴルトベルク変奏曲","p":"アリア（1955年のデビュー盤）","pt":"1981年盤と聴きくらべる定番のデビュー盤です。冒頭のアリア（ゆっくりした歌のような曲）を、一音一音くっきりと、すがすがしく弾きます。若々しさにあふれ、霧が晴れた朝のような透明感があります。このあと続く変奏では、指が軽やかに躍り、生きる喜びにあふれた演奏が楽しめます。","len":"2:30","g":"クラシック"},"classical/grandev":{"c":"ショパン","w":"華麗なる大円舞曲 作品18","p":"1曲","pt":"同じ音を連打するファンファーレのような合図で、舞踏会の幕が開きます。続いて軽やかで弾むワルツが次々にあらわれ、色とりどりのドレスがくるくる回る様子が浮かびます。ときに優雅に、ときにいたずらっぽく表情を変え、楽しさがどんどん広がっていきます。最後は華やかに盛り上がって、舞踏会の夜を締めくくります。","len":"5:21","g":"クラシック"},"classical/great":{"c":"シューベルト","w":"交響曲「ザ・グレート」ハ長調","p":"第1楽章","pt":"ホルン2本が、広い野原に響くようなのびやかな旋律を吹いて始まります。ゆったりした序奏がだんだん明るさを増し、やがて弾むようなリズムの速い部分へ流れこみます。同じリズムが波のように何度も押し寄せ、聴いているうちに大きな流れに乗せられていくよう。シューマンが「天国的な長さ」とほめた、歩くほど景色が広がっていくような楽章です。","len":"12:45","g":"クラシック"},"classical/grossefuge":{"c":"ベートーヴェン","w":"大フーガ 作品133","p":"1曲","pt":"4つの楽器がいっせいに強く鳴らす、ごつごつとした序奏で始まります。続くフーガ（同じ旋律を次々に追いかけ合う形）では、激しいリズムがぶつかり合い、きしむような響きにおどろかされます。途中でふっと静かでやさしい場面が訪れ、また嵐のような戦いへと戻っていきます。後期弦楽四重奏曲の世界の、聴く人を試すような厳しさと、その奥の力強さを感じてください。","len":"17:41","g":"クラシック"},"classical/gymno":{"c":"サティ","w":"ジムノペディ第1番","p":"1曲","pt":"ゆっくりした伴奏が、ふたつの和音を行ったり来たりしながら始まります。その上に、ぽつりぽつりとさびしげな旋律がのります。何も起こらないのに、ふしぎと心が落ち着き、雨の午後の窓辺にいるような気持ちになります。聞き流してもいい、ただ空気のようにそこにある、静かな音楽です。","len":"3:25","g":"クラシック"},"classical/h100":{"c":"ハイドン","w":"交響曲第100番「軍隊」","p":"第2楽章","pt":"はじめは弦と木管が、のどかで愛らしいメロディを穏やかに奏でます。ところが途中から、トライアングルやシンバル、大太鼓といったトルコ風の打楽器が加わり、行進するような力強い響きに一変します。後半ではトランペットがひとりで軍隊の合図のようなラッパを吹き鳴らし、太鼓のとどろきとともに緊張が一気に高まります。平和な庭に軍隊がやって来たような、驚きとわくわく感のある楽章です。","len":"6:08","g":"クラシック"},"classical/h101":{"c":"ハイドン","w":"交響曲第101番「時計」","p":"第2楽章","pt":"ファゴットと弦のつまびく音が、「チクタク、チクタク」と規則正しく時を刻み始めます。その上でヴァイオリンが、上品でおっとりしたメロディをのびやかに歌います。途中で短調に変わり、少しだけ嵐が来たように激しくなりますが、また穏やかな時計の音に戻ってきます。ゆったり流れる時間を楽しむような、ほほえましい楽章です。","len":"9:13","g":"クラシック"},"classical/h103":{"c":"ハイドン","w":"交響曲第103番「太鼓連打」","p":"第1楽章","pt":"ティンパニが「ドロドロドロ…」と長く打ち鳴らす音で、静かに幕が開きます。続いて低い弦が、暗く重々しいメロディを手探りするように奏で、ひんやりとした不思議な空気が広がります。そこから一転して、軽快にはずむ速い音楽が走り出し、明るい活気に包まれます。終わり近くで、ふと冒頭の暗い響きが戻ってくる瞬間も聴きのがさないでください。","len":"9:51","g":"クラシック"},"classical/h104":{"c":"ハイドン","w":"交響曲第104番「ロンドン」","p":"第1楽章","pt":"オーケストラ全員が力強く同じ音をそろえて鳴らす、厳かな序奏で始まります。重く陰りのある空気の中、問いかけるような静かな音楽が続きます。そこから明るい長調の速い部分へ、ぱっと光が差しこむように移り、弦の晴れやかなメロディが軽やかに駆けていきます。ハイドン最後の交響曲らしい、堂々として充実した楽章です。","len":"9:25","g":"クラシック"},"classical/h45":{"c":"ハイドン","w":"交響曲第45番「告別」","p":"第4楽章","pt":"第4楽章は、速くせわしない音楽で始まり、どこか追い立てられるような落ち着かなさがあります。ところが途中で急にゆったりした音楽に変わり、そこから楽器が1つ、また1つと音を止め、楽員が退場していきます。響きがだんだん薄く小さくなり、最後は2挺のヴァイオリンだけがそっと残ります。静まりかえった舞台に、さびしさと、ほのかなユーモアがただよいます。","len":"8:51","g":"クラシック"},"classical/h94":{"c":"ハイドン","w":"交響曲第94番「驚愕」","p":"第2楽章","pt":"弦が、子どもの歌のような素朴なメロディを、とても小さな音で弾き始めます。同じメロディがもう一度、さらにひそやかにくり返されて、思わず身を乗り出したその瞬間、オーケストラ全体が「ジャン！」と大きな音を鳴らします。そのあとは、同じメロディがいろいろな衣装に着替える変奏が、のどかに続いていきます。わかっていても毎回少しどきっとする、楽しい楽章です。","len":"5:40","g":"クラシック"},"classical/hall":{"c":"グリーグ","w":"「ペール・ギュント」より","p":"山の魔王の宮殿にて","pt":"チェロやコントラバスが指で弦をはじき、ファゴットが忍び足のような旋律を、低く、こっそりと奏でて始まります。同じ旋律が何度もくり返され、楽器がふえるたびに、だんだん速く、大きくなっていきます。追いかけてくるトロルたちの足音が迫ってくるようで、手に汗にぎるスリル。最後は大騒ぎの頂点で、ドーンと叩きつけるように終わります。","len":"2:29","g":"クラシック"},"classical/hallelujah":{"c":"ヘンデル","w":"オラトリオ「メサイア」","p":"ハレルヤ・コーラス","pt":"短い前奏のあと、合唱が「ハレルヤ！」と弾むように何度も呼びかけ、喜びがはじけます。力強い歌にハレルヤの合いの手が重なり、響きがどんどん厚くなっていきます。「王の王、主の主」と歌う声が一段ずつ高く積み上がり、トランペットとティンパニも加わって、天が開けるような輝きに。最後の一瞬、すべてが止まる沈黙のあと、「ハレルヤ」が大きく響いて第2部をしめくくります。","len":"3:48","g":"クラシック"},"classical/hammer":{"c":"ベートーヴェン","w":"ピアノ・ソナタ第29番「ハンマークラヴィーア」","p":"第1楽章","pt":"低い音から高い和音へ跳び上がるような力強い響きで、巨大な建物の扉が開くように始まります。そのあとは堂々とした響きと、ふっと歌うようなやさしい旋律が入れかわりながら進みます。音がぎっしり重なり、ピアノ1台とは思えない厚みに圧倒されるはず。巨大で超難曲の楽章を、高い山を一歩ずつ登るような気持ちで聴いてみてください。","len":"11:25","g":"クラシック"},"classical/handelharp":{"c":"ヘンデル","w":"ハープ協奏曲 変ロ長調 作品4-6","p":"全曲","pt":"ハープの協奏曲は数が少なく、貴重な1曲です。弦楽器の軽やかな前奏のあと、ハープが、ころころと真珠を転がすような、やさしくきらめく音で歌いだします。ゆっくりの楽章では、しっとりと落ち着いた響きに心がやすらぎます。最後の楽章では、再び明るく優雅な音楽が戻り、晴れやかな気分で終わります。","len":"10:23","g":"クラシック"},"classical/harold":{"c":"ベルリオーズ","w":"交響曲「イタリアのハロルド」","p":"全曲","pt":"独奏ヴィオラが主人公ハロルドを演じる交響曲です。重く沈んだ序奏のあと、ヴィオラが、さすらう若者の孤独を語るような、ものうげな旋律を歌いだします。山の景色、夕べの祈りを歌う巡礼の行列、恋の歌など、ハロルドが見た情景が楽章ごとに広がります。最後は山賊たちの荒々しい宴に変わり、にぎやかに幕を閉じます。","len":"43:57","g":"クラシック"},"classical/heiden":{"c":"シューベルト","w":"歌曲「野ばら」","p":"1曲","pt":"ピアノの短い前奏のあと、野に咲くばらを見つけた少年の歌が軽やかに始まります。素朴で親しみやすい旋律が、同じ形で何度かくり返される、とても短い歌です。かわいらしい響きの中に、少年がばらを折ってしまう物語のほろ苦さがひそんでいます。日本でも親しまれる歌を、口ずさむような気持ちで聴いてみてください。","len":"2:04","g":"クラシック"},"classical/heldenleben":{"c":"R.シュトラウス","w":"交響詩「英雄の生涯」","p":"全曲","pt":"ホルンと低い弦が、胸を張って大きく駆け上がるような、作曲者自身をえがいた堂々とした英雄のテーマで始まります。途中では、意地悪な声やあまい語らいの場面が次々に現れ、英雄の人生が絵巻物のように広がります。トランペットが鳴りわたる戦いの場面は、手に汗にぎる大スペクタクル。最後は嵐がすぎたあと、おだやかな音楽に包まれ、静かな夕暮れのように人生を閉じます。","len":"50:40","g":"クラシック"},"classical/heroic":{"c":"ショパン","w":"ポロネーズ第6番「英雄」 作品53","p":"1曲","pt":"低い音から一気にせり上がる、ざわめくような序奏で胸が高鳴ります。そして堂々とした主題が、ピアノ1台とは思えない厚い和音で鳴りひびき、思わず背すじがのびるような誇らしさに満ちます。中間部では低い音がとどろき続け、遠くから何かが迫ってくるような緊張が高まります。最後は主題が戻り、輝かしく勝ちほこるように終わります。","len":"7:15","g":"クラシック"},"classical/htpt":{"c":"ハイドン","w":"トランペット協奏曲","p":"第3楽章","pt":"オーケストラが明るく弾むような主題で始まり、そこへトランペットが軽やかに加わります。音階を吹けなかった昔のトランペットではむずかしかった細かな音の動きを、すいすいと吹きこなしていくのが聴きどころ。主題が何度も戻ってくるたびに、晴れやかな気分がふくらんでいきます。最後はオーケストラと一緒に、輝かしく勢いよく締めくくります。","len":"4:41","g":"クラシック"},"classical/humoresque":{"c":"ドヴォルザーク","w":"ユーモレスク","p":"1曲","pt":"はずむような、少しおどけたリズムにのって、軽やかな旋律が始まります。肩の力が抜けて、思わず口ずさみたくなるような、のんびりした楽しさです。中ほどでは短調に変わり、ふっと切なく、胸の奥を見つめるような表情を見せます。やがてまた軽やかな旋律が戻り、ほほえみながら静かに終わります。","len":"3:46","g":"クラシック"},"classical/hungarian2":{"c":"リスト","w":"ハンガリー狂詩曲第2番","p":"オーケストラ版","pt":"ゆっくりした部分は、重々しく哀しげな語りかけで始まり、ひなびた民謡のような旋律がしみじみと響きます。速い部分に入ると、軽快なリズムが少しずつ速さを増し、聴く人をどんどん巻きこんでいきます。オーケストラ版では、さまざまな楽器の色彩が加わり、にぎやかさもひとしお。最後は熱狂のうずの中で、一気に駆け抜けて終わります。","len":"11:17","g":"クラシック"},"classical/impromptu":{"c":"シューベルト","w":"即興曲 作品90-3","p":"1曲","pt":"右手の細かく流れる音の上に、ゆったりとした歌が浮かび上がり、静かな水面に光がゆれているようです。左手の深い低音が全体をやさしく支え、旋律は途切れることなく続いていきます。途中で少し影がさし、不安げになる場面もありますが、またおだやかな歌へと戻ります。晩年のピアノ曲らしい、しみじみとした美しさに心がほどけていきます。","len":"7:04","g":"クラシック"},"classical/italian":{"c":"メンデルスゾーン","w":"交響曲第4番「イタリア」","p":"第1楽章","pt":"木管楽器が細かく刻む明るいリズムに乗って、ヴァイオリンがはじけるような旋律を勢いよく歌い出します。まぶしい太陽の下を駆けていくような、軽やかで生き生きとした音楽が止まらずに続きます。ときにかげりを見せても、すぐに光が差しこみ、さらに勢いを増していきます。イタリア旅行の明るい思い出がそのまま音になったような、胸おどる楽章です。","len":"8:21","g":"クラシック"},"classical/jesu":{"c":"バッハ","w":"主よ、人の望みの喜びよ（BWV147より）","p":"1曲","pt":"流れるような3連符（3つずつまとまった音の動き）のメロディが、やさしく揺れながらずっと続いていきます。その流れの中に、合唱がゆったりと落ち着いたコラール（教会の賛美歌）を、ひとふしずつ重ねていきます。せせらぎの上に、静かな祈りの声が浮かぶような美しさ。結婚式でもおなじみの、心が明るく満たされていくカンタータの合唱曲です。","len":"3:04","g":"クラシック"},"classical/jetv":{"c":"サティ","w":"ジュ・トゥ・ヴー（あなたが欲しい）","p":"1曲","pt":"カフェで弾いたような、甘くかろやかなワルツです。くるりと回るような三拍子の旋律が、ほほえみながら近づいてきます。ほろ酔いの夜の街で、恋人の手をとって踊りだしたくなるような、うきうきした気分にさせてくれます。気取らない、ちょっとおしゃれなパリの香りを楽しんでください。","len":"5:29","g":"クラシック"},"classical/jeux":{"c":"ラヴェル","w":"水の戯れ","p":"1曲","pt":"噴水のきらめきを描くピアノ曲です。高い音域で細かい音が次々にはじけ、光の粒が水しぶきとなって飛び散るようです。ときどき流れがふくらんで、大きな水柱がわっと上がるような盛り上がりがあり、また静かなさざめきに戻ります。最後は水面に光が残るように、きらきらと消えていきます。","len":"5:44","g":"クラシック"},"classical/john":{"c":"バッハ","w":"ヨハネ受難曲 BWV245","p":"冒頭合唱「主よ、われらの統治者よ」","pt":"低い弦が渦を巻くようにうねり続け、その上でオーボエとフルートが、ぶつかり合う痛い響きを重ねていきます。不安と緊張が高まりきったところで、合唱が「主よ！」と3度叫ぶように入ってくる瞬間は鳥肌ものです。苦しみの中にこそ神の栄光がある、という祈りが、重く激しい響きで歌い上げられます。マタイ受難曲より短く、最初からぐっと劇的な世界に引き込まれます。","len":"10:33","g":"クラシック"},"classical/june":{"c":"チャイコフスキー","w":"ピアノ曲集「四季」","p":"6月「舟歌」","pt":"ピアノが、小舟にゆられるようなゆったりとしたリズムにのって、もの悲しい旋律を歌い出します。月夜の水辺で、ひとり静かに思いにふけるような情景です。中ほどで少しテンポが上がり、明るく波立つような場面がありますが、やがてまた静かな歌に戻ってきます。最後は水面に消える波紋のように、そっと終わります。","len":"4:44","g":"クラシック"},"classical/jupiter":{"c":"ホルスト","w":"組曲「惑星」より「木星」","p":"1曲","pt":"弦がざわざわと細かく動き出し、ホルンが楽しげな主題を吹き鳴らして、お祭りが始まったようなにぎやかさに包まれます。いくつものはずむメロディが次々に現れ、明るい活気が広がります。そして中間部、ゆったりと大きく歌われる旋律こそ、平原綾香「Jupiter」の原曲です。胸の奥から湧き上がるような気高い感動を味わったら、また陽気なお祭りに戻って華やかに終わります。","len":"8:04","g":"クラシック"},"classical/kaiserq":{"c":"ハイドン","w":"弦楽四重奏曲「皇帝」作品76-3","p":"第2楽章","pt":"第1ヴァイオリンが、穏やかで気高い讃歌のメロディをゆったりと歌い出します。これが今のドイツ国歌になった旋律です。そのあと同じメロディが第2ヴァイオリン、チェロ、ヴィオラと順番に受けわたされ、ほかの楽器がそのまわりを美しく飾っていきます。最後はしみじみとした和音に包まれ、祈りのような静けさの中で終わります。","len":"6:34","g":"クラシック"},"classical/kaiserwalzer":{"c":"J.シュトラウス2世","w":"皇帝円舞曲","p":"1曲","pt":"小さな足音のような、軽やかな行進曲のリズムで静かに始まります。それがだんだん大きくなり、やがてゆったりとした、気品あふれるワルツへと移っていきます。宮殿の広間で、きらびやかな人々が優雅に踊る様子が目に浮かぶよう。行進曲風に始まる堂々としたワルツは、最後に華やかに締めくくられます。","len":"11:56","g":"クラシック"},"classical/kleiber57":{"c":"ベートーヴェン","w":"交響曲第7番","p":"第7番 全曲（クライバー／ウィーン・フィル）","pt":"躍動感の極みと言われる演奏です。ゆっくりした序奏のあと、はずむようなリズムが次々に現れ、体が自然にゆれてきます。第2楽章の静かで重い行進も、緊張感にあふれて胸にせまります。最後の楽章は、指揮者が踊るように音楽をあおり、オーケストラが熱狂の渦の中を全速力で駆けぬけて、爽快な興奮を残して終わります。","len":"38:37","g":"クラシック"},"classical/kreisler":{"c":"シューマン","w":"クライスレリアーナ","p":"全曲","pt":"1曲目から、激しく燃え上がるような速い音の渦に巻きこまれます。全8曲は、荒々しく駆けまわる曲と、ゆっくり心の内をうち明けるような甘く静かな曲とが、交互にあらわれます。熱い情熱と深いやさしさが、ゆれ動く心そのもののように入れかわります。最後の曲は、どこか不思議な気配のまま、ふっと消えるように終わります。","len":"29:47","g":"クラシック"},"classical/kreutzer":{"c":"ベートーヴェン","w":"ヴァイオリン・ソナタ第9番「クロイツェル」","p":"第1楽章","pt":"ヴァイオリンがひとりで、重い和音をゆっくりと鳴らして始まります。ピアノが加わった静かな序奏のあと、急に速く激しい部分へなだれこみ、2つの楽器がまるで決闘のようにぶつかり合います。ときに歌うような旋律で一息つきますが、すぐにまた嵐のような勢いが戻ってきます。激しいヴァイオリン・ソナタの、息をのむような緊張感を感じてください。","len":"11:51","g":"クラシック"},"classical/lacrimosa":{"c":"モーツァルト","w":"レクイエム K.626","p":"ラクリモサ（涙の日）","pt":"弦楽器が、すすり泣くような短い音を、ゆっくりと揺れるリズムでくり返し始めます。そこへ合唱が「ラクリモサ（涙の日）」と静かに歌い出し、一段ずつ階段をのぼるように、声を高く、強く高めていきます。この高まっていく最初の8小節が、モーツァルトの最後の筆で、続きは弟子たちが完成させました。悲しみがあふれる頂点のあと、最後の「アーメン」が重く響いて、心に長い余韻を残します。","len":"3:13","g":"クラシック"},"classical/lamer":{"c":"ドビュッシー","w":"交響詩「海」","p":"全曲","pt":"北斎の大波を思い浮かべて聴いてみてください。3つの楽章で、夜明け前の暗い海が少しずつ光をおび、真昼に金管が堂々と鳴りわたります。まん中の楽章では、波が光と遊ぶように細かくきらめきます。最後の楽章は風と海がぶつかり合う嵐で、うねりが何度も押しよせ、まぶしい高揚の中で幕を閉じます。","len":"27:24","g":"クラシック"},"classical/lavalse":{"c":"ラヴェル","w":"ラ・ヴァルス","p":"1曲","pt":"はじめは低い音が霧の中でうごめくだけで、何が始まるのかわかりません。やがてワルツのかけらが浮かびあがり、きらびやかな舞踏会の大広間がぱっと目の前に広がります。ところが、踊りはだんだん熱を帯びすぎ、旋律がゆがみ、渦を巻いて崩れていきます。最後は大きな音でたたきつけるように、突然終わります。","len":"14:43","g":"クラシック"},"classical/liebestraum":{"c":"リスト","w":"愛の夢 第3番","p":"1曲","pt":"たっぷりとした伴奏の中から、甘くあたたかい旋律が、人の声のようにゆったりと歌い出されます。途中で、きらめくような速い音の流れがはさまり、気持ちが少しずつ高まっていきます。やがて旋律は大きく情熱的に盛り上がり、愛の思いがあふれ出すよう。最後はまた静かになり、夢からさめるように、やさしく消えていきます。","len":"5:33","g":"クラシック"},"classical/lindenbaum":{"c":"シューベルト","w":"歌曲集「冬の旅」","p":"第5曲「菩提樹」","pt":"ピアノが木の葉のざわめきのような細かい音で始まり、なつかしい菩提樹の思い出がおだやかに歌われます。途中で響きが暗くかげり、冷たい風が吹きつけて帽子が飛ばされる場面では、ピアノも荒れ模様に。そのあと、「ここに安らぎがあるよ」と木が呼びかけるような、静かな旋律がもう一度戻ってきます。唱歌にもなった親しみやすい歌に、さすらう若者の孤独がにじみます。","len":"4:37","g":"クラシック"},"classical/m25":{"c":"モーツァルト","w":"交響曲第25番 ト短調 K.183","p":"第1楽章","pt":"弦楽器が、つまずくように少しずらしたリズムで、せきたてるように激しく始まります。「小ト短調」と呼ばれるこの曲には、ひりひりとした緊張と嵐のような感情があふれています。途中、オーボエがひとりで切なげに歌う一瞬が、嵐の中の小さな灯のよう。ふだんの明るいモーツァルトとはまるで違う、暗い情熱に圧倒されます。","len":"7:41","g":"クラシック"},"classical/m35":{"c":"モーツァルト","w":"交響曲第35番「ハフナー」K.385","p":"第1楽章","pt":"オーケストラ全体が、大きく跳ね上がる力強い出だしで、いきなり祝典の幕を開けます。弦が勢いよく駆けまわり、トランペットとティンパニが加わって、晴れやかさが一気に広がります。同じ主題がいろいろな楽器で形を変えて現れ、息つく間もなくぐいぐい進む、エネルギーに満ちた楽章です。名家ハフナー家のお祝いにぴったりの、まぶしいほどの明るさがあります。","len":"5:44","g":"クラシック"},"classical/m36":{"c":"モーツァルト","w":"交響曲第36番「リンツ」K.425","p":"第1楽章","pt":"ゆったりとした序奏で、堂々とした和音と、少し陰りのある静かな音楽が交互に現れ、期待がふくらんでいきます。やがて速い部分に入ると、弦がやわらかく歌い出し、すぐにトランペットとティンパニを加えたにぎやかな響きに変わります。明るく晴れやかでありながら、どこかゆとりのある気品が感じられます。旅先のリンツでわずか数日で書いたとは思えない、充実した楽章です。","len":"10:45","g":"クラシック"},"classical/m38":{"c":"モーツァルト","w":"交響曲第38番「プラハ」K.504","p":"第1楽章","pt":"長くゆったりとした序奏で始まり、堂々とした和音のあとに、ふと影がさすような短調の響きが現れます。やがて速い部分に入ると、弦が小刻みにざわめき出し、さまざまなメロディが次々に重なり合って、生き生きとした流れになります。明るさと緊張がたえず入れかわり、ドラマを見ているようなわくわく感があります。メヌエットを置かない3楽章の交響曲の、充実した第1楽章です。","len":"13:28","g":"クラシック"},"classical/m40":{"c":"モーツァルト","w":"交響曲第40番 ト短調 K.550","p":"第1楽章","pt":"ヴィオラがさざ波のように小刻みな伴奏を始め、その上でヴァイオリンが、ため息をつくようなメロディを歌い出します。速いテンポなのに、どこか胸がしめつけられるような切なさが流れ続けます。途中で木管がやわらかく歌う場面もありますが、すぐにまた不安な影が戻ってきます。最後まで哀しみをかかえたまま、きっぱりと閉じられます。","len":"8:16","g":"クラシック"},"classical/m41":{"c":"モーツァルト","w":"交響曲第41番「ジュピター」K.551","p":"第4楽章","pt":"ヴァイオリンが「ド・レ・ファ・ミ」という4つの音をのびやかに奏で、明るく軽やかに始まります。この短い主題やほかのいくつかの主題が、楽器から楽器へと追いかけ合い、からみ合いながら、ぐんぐん勢いを増していきます。そして最後、5つの主題が同時に重なり合う場面がやってきます。まるで光の糸が一気に織り上がるような、まぶしく壮大なしめくくりです。","len":"8:12","g":"クラシック"},"classical/ma1":{"c":"マーラー","w":"交響曲第1番「巨人」","p":"第3楽章","pt":"ティンパニがぽつん、ぽつんと歩みを刻み、低い楽器が「グーチョキパー」でおなじみの旋律を、短調で重く歌い出します。知っている歌なのに、どこかおかしく、うすら寒い葬送行進曲です。やがて酒場の楽隊のような、皮肉っぽくにぎやかな音楽が割りこんできます。中ほどでは、ハープにのって夢のようにやさしい歌が流れ、ふっと遠い思い出にひたるような静けさが訪れます。","len":"11:22","g":"クラシック"},"classical/ma10":{"c":"マーラー","w":"交響曲第10番","p":"第1楽章アダージョ","pt":"未完に終わった交響曲から、ふつうはこの楽章だけが演奏されます。ヴィオラだけが、さまようように静かな旋律で始め、やがてヴァイオリンが、あたたかく切ない歌を大きく歌い出します。待つべきは後半、オーケストラ全体が叫ぶような不協和音（ぶつかり合う和音）を鳴らす瞬間で、心が引き裂かれるような痛みが走ります。そのあと音楽はゆっくりと落ち着き、やすらぎの中で静かに終わります。","len":"23:42","g":"クラシック"},"classical/ma2":{"c":"マーラー","w":"交響曲第2番「復活」","p":"第5楽章","pt":"叫び声のような大音響で幕を開け、世界の終わりのような激しい音楽がうねります。遠くから聞こえる金管の呼び声と、鳥の声のようなフルートのあと、すべてが静まりかえります。そこへ合唱が、ほとんど聞こえないほど小さな声で「よみがえる」と歌い出す瞬間は鳥肌もの。そこから少しずつ光が増し、最後はオルガンや鐘も加わって、天まで届くような輝かしさで終わります。","len":"35:21","g":"クラシック"},"classical/ma3":{"c":"マーラー","w":"交響曲第3番","p":"第6楽章","pt":"弦楽器だけで、祈りのように静かな旋律がゆっくりと歌い出されます。約100分の巨大な交響曲を結ぶのは、にぎやかなフィナーレではなく、この深い愛の歌です。何度も高まっては、ふと迷うように影がさし、またやさしい歌に戻ってきます。最後は金管が厳かに旋律を歌い、ティンパニが大地を踏みしめるように打たれる中、大きな光に包まれて終わります。","len":"25:49","g":"クラシック"},"classical/ma4":{"c":"マーラー","w":"交響曲第4番","p":"第4楽章","pt":"クラリネットがのどかな旋律を吹き、ソプラノが子どものような無邪気さで「天上の生活」を歌い始めます。歌の節目ごとに、鈴の音とともに少しせわしない音楽が割りこんでくるのも楽しいところ。最後の節で音楽はいっそうやわらかくなり、ハープにのって、静かにほほえむように消えていきます。光の中でまどろむような、あたたかい結びです。","len":"8:35","g":"クラシック"},"classical/ma6":{"c":"マーラー","w":"交響曲第6番「悲劇的」","p":"第4楽章","pt":"低い音がうごめく、不安な霧の中から始まる、長く大きな終楽章です。希望に向かって突き進むような明るい場面と、暗い嵐が何度もぶつかり合います。待つべきは、巨大なハンマーが「ドスン」と打ち下ろされる瞬間で、高まった希望がたたきつぶされるような衝撃が走ります。最後は静まったあと、全員で突然の一撃が鳴り、暗く重く幕が下ります。","len":"29:10","g":"クラシック"},"classical/ma7":{"c":"マーラー","w":"交響曲第7番「夜の歌」","p":"第2楽章「夜曲」","pt":"ホルンが遠くへ呼びかけ、もう1本のホルンがこだまのように答えて始まります。2つある「夜曲」の1つ目で、月明かりの下を夜の見回りが歩いていくような、少しおどけた行進曲です。木管が鳥や夜の生きもののようにさえずり、遠くからカウベル（牛の首につける鈴）も聞こえてきます。ふしぎで、なつかしい夜の散歩の気分を楽しめる楽章です。","len":"15:54","g":"クラシック"},"classical/ma8":{"c":"マーラー","w":"交響曲第8番「千人の交響曲」","p":"第1部","pt":"オルガンの和音がとどろき、すぐに大合唱が「来たれ、創造主なる聖霊よ」と高らかに呼びかけて始まります。2つの合唱と独唱者たちが、呼びかけ合いながら天に向かって声を重ねていきます。初演で約1000人が出演したという大編成の響きは、まさに圧倒的。最後は子どもの合唱も加わり、金管が鳴りわたって、まぶしい光の中で終わります。","len":"24:15","g":"クラシック"},"classical/ma9":{"c":"マーラー","w":"交響曲第9番","p":"第4楽章","pt":"弦楽器が、すべてを込めるように深く熱い祈りの歌を歌い出します。何度も高まり、別れを惜しむように大きくうねったあと、音楽は少しずつ細く、まばらになっていきます。最後は弦のかすかな音だけが残り、息をひそめるように消えていきます。音が消えたあとの静けさまでが音楽の一部のような、別れの楽章です。","len":"25:56","g":"クラシック"},"classical/macabre":{"c":"サン＝サーンス","w":"死の舞踏","p":"1曲","pt":"真夜中に骸骨たちが踊る曲です。時を告げる鐘のあと、死神のヴァイオリンが、わざと不気味に調子をはずした音でかき鳴らします。やがて不気味なワルツが始まり、木琴のカタカタという音とともに、踊りはどんどん激しくなります。最後に、オーボエがにわとりの鳴き声で夜明けを告げると、骸骨たちはあわてて墓に戻り、ひっそりと終わります。","len":"7:46","g":"クラシック"},"classical/maiden":{"c":"バダジェフスカ","w":"乙女の祈り","p":"1曲","pt":"一部の地域ではごみ収集車でもおなじみの曲です。ピアノの細かい音が、きらきらと流れ落ちるように始まります。そこに、少女がそっと手を合わせるような、甘くかわいらしい旋律が現れます。くり返すごとに飾りが増え、少しずつ華やかになっていきます。素朴で、まっすぐな願いがこもった音楽です。","len":"4:34","g":"クラシック"},"classical/mars":{"c":"ホルスト","w":"組曲「惑星」より","p":"火星","pt":"弦楽器が弓の木の部分で弦をたたく、カタカタという乾いた音で、5拍子の不気味なリズムを刻み始めます。その上で金管が低くうなり、遠くから軍隊が近づいてくるように、音楽はじりじりと大きくなっていきます。頂点では、耳をつんざくような激しい和音がぶつかり合います。最後は同じリズムが、たたきつけるように鳴りひびいて終わります。","len":"6:58","g":"クラシック"},"classical/masquerade":{"c":"ハチャトゥリアン","w":"「仮面舞踏会」のワルツ","p":"1曲","pt":"浅田真央選手の演技でもおなじみの、渦を巻くように回り出すワルツです。短調の、どこか暗く情熱的な旋律は、仮面の下に秘密を隠した舞踏会のよう。旋律は何度もくり返されながら、波のように激しく高まっていきます。華やかさと不安が入りまじる、ドラマチックな響きに引きこまれます。","len":"4:07","g":"クラシック"},"classical/matthew":{"c":"バッハ","w":"マタイ受難曲 BWV244","p":"アリア「憐れみたまえ、わが神よ」","pt":"ペテロがイエスを3度「知らない」と言ってしまい、激しく泣く場面のあとに歌われるアリアです。独奏ヴァイオリンが、すすり泣くような長いメロディを先に奏で、アルト（低めの声）が「憐れみたまえ」と神にゆるしを乞います。ヴァイオリンと歌がからみ合いながら、後悔と祈りが静かに深まっていきます。キリストの受難を描く約3時間の大作の中でも、とくに胸を打つ名曲です。","len":"6:24","g":"クラシック"},"classical/mazurka":{"c":"ショパン","w":"マズルカ 作品17-4","p":"1曲","pt":"どこか宙に浮いたような、あいまいな和音で、ひっそりと始まります。やがて、もの悲しく、ゆらゆらとためらうような旋律が歌われ、ポーランドの田舎の踊りの香りがかすかに漂います。途中で少しだけ明るい踊りの場面もありますが、すぐに寂しさが戻ってきます。最後はまた冒頭と同じ、答えの出ないような響きで消えていきます。","len":"4:45","g":"クラシック"},"classical/mbsn":{"c":"モーツァルト","w":"ファゴット協奏曲 K.191","p":"第1楽章","pt":"オーケストラが明るく始めたあと、ファゴット（低い音の木管楽器）が、ちょっととぼけたような温かい音色で登場します。低い音からひょいと高い音へ飛び移ったり、すばしこく駆けまわったり、まるで愛嬌のある人物が舞台で踊っているよう。ゆったりした歌の場面では、意外なほどやさしく、しみじみとした表情も見せてくれます。ファゴットの楽しさと奥深さが一度に味わえる楽章です。","len":"6:58","g":"クラシック"},"classical/mcl":{"c":"モーツァルト","w":"クラリネット協奏曲 K.622","p":"第2楽章","pt":"弦のやさしい伴奏にのって、クラリネットが、深く温かい声で長いメロディを歌い出します。そのメロディをオーケストラがそっとくり返すと、まるで心と心がこだまし合うよう。クラリネットの低い音のまろやかさと、高い音の澄んだ輝きを、ぜひ聴きくらべてみてください。亡くなる年の作品らしい、おだやかでありながらどこか別れを思わせる、静かな美しさに満ちています。","len":"6:52","g":"クラシック"},"classical/mclq":{"c":"モーツァルト","w":"クラリネット五重奏曲 K.581","p":"第1楽章","pt":"弦楽器が、やわらかく包みこむような穏やかなメロディで始まり、そこへクラリネットが、ふわりと舞い上がるような音型で応えます。弦4本とクラリネットが、まるで親しい友人同士のように、かわるがわる語り合っていきます。明るい長調なのに、ところどころに秋の日ざしのような、しみじみとした寂しさがにじみます。晩年の傑作らしい、深い味わいの楽章です。","len":"9:18","g":"クラシック"},"classical/meister":{"c":"ワーグナー","w":"楽劇「ニュルンベルクのマイスタージンガー」","p":"第1幕への前奏曲","pt":"オーケストラ全体が、胸を張るような堂々とした主題を、明るく力強く鳴らして始まります。やがて恋のときめきを思わせるやさしく甘い旋律や、軽やかでおどけた旋律があらわれます。クライマックスでは、それまでの旋律がいくつも同時に重なり合い、ひとつの大きな喜びになって響きます。ワーグナー唯一の喜劇らしく、晴れやかな祝祭の気分にあふれています。","len":"10:29","g":"クラシック"},"classical/mflh":{"c":"モーツァルト","w":"フルートとハープのための協奏曲 K.299","p":"第2楽章","pt":"弦だけのやわらかな伴奏にのって、フルートとハープが、ゆったりと語り合うように歌います。フルートの澄んだ息の音と、ハープのきらめくような粒の音が寄りそい、まるで春の午後の庭にいるよう。ふたつの楽器がメロディを受けわたしたり重なったりするたびに、やさしい会話が深まっていきます。ゆったりとした時間に身をまかせたくなる、上品で甘い楽章です。","len":"9:10","g":"クラシック"},"classical/mhn4":{"c":"モーツァルト","w":"ホルン協奏曲第4番 K.495","p":"第3楽章","pt":"ホルンが、狩りの角笛のようにはずむ6拍子（タッタ・タッタと跳ねるリズム）の主題を元気よく吹き鳴らします。オーケストラがそれに応え、まるで森の中を馬で駆けていくような爽快さがあります。途中ではいろいろなメロディが顔を出しますが、そのたびにまた楽しい主題が戻ってきて、気分がどんどん弾みます。最後まで明るく軽やかに走り抜ける、気持ちのよいロンド（同じ主題が何度も戻ってくる形）です。","len":"4:08","g":"クラシック"},"classical/military":{"c":"ショパン","w":"軍隊ポロネーズ 作品40-1","p":"1曲","pt":"力強い和音が堂々と鳴りひびき、胸を張って進む行列のような旋律が始まります。ポロネーズ（ポーランドの舞曲）らしい誇り高いリズムが、力強く刻まれていきます。中間部では少し落ち着いた響きになりますが、勇ましさは失われません。堂々としたポーランドの舞曲の、輝くような誇らしさを感じてください。","len":"5:35","g":"クラシック"},"classical/minuetG":{"c":"ペツォールト（伝バッハ）","w":"メヌエット ト長調 BWV Anh.114","p":"1曲","pt":"右手が軽やかにステップを踏むような、明るいメロディで始まります。3拍子の小さな舞曲で、左手がやさしく寄りそい、ドレスの裾をひるがえしてくるりと回るような優雅さがあります。後半では少し表情を変えながら、また明るく落ち着いて終わります。ピアノ初心者の定番曲ですが、じつはバッハではなくペツォールトの作です。","len":"1:46","g":"クラシック"},"classical/minute":{"c":"ショパン","w":"子犬のワルツ 作品64-1","p":"1曲","pt":"右手がくるくると同じところを回るように、速く軽やかに駆けまわります。まるで子犬が自分のしっぽを追いかけて、ぐるぐる回っているよう。中間では少しゆったりと、やさしく歌うような場面になり、ひと休みするかのようです。そしてまた元気に回り出し、最後はさっと軽やかに終わります。","len":"2:15","g":"クラシック"},"classical/mob":{"c":"モーツァルト","w":"オーボエ協奏曲 K.314","p":"第1楽章","pt":"オーケストラが明るく晴れやかに始まり、そのあとオーボエが、少し鼻にかかったような、つややかな音で入ってきます。軽やかな音の動きや、ころころと転がるような飾りの音を、オーボエが楽しげに歌いこなしていきます。さわやかな朝の空気のように、どこまでも明るく生き生きとした音楽です。オーケストラの音合わせの「ラ」を出す楽器ならではの、よく通る音色を味わってください。","len":"8:00","g":"クラシック"},"classical/moldau":{"c":"スメタナ","w":"連作交響詩「わが祖国」より「モルダウ」","p":"1曲","pt":"フルート2本が、岩間からわき出る小さな流れのように、ちろちろと音を重ねて始まります。やがて流れが合わさって、弦楽器が大河の雄大な主題を歌い出すところは胸がふくらみます。川は森の狩りや村の婚礼のそばを通り、月夜の妖精たちが舞う静かな場面を経て、激しい急流へ。最後は大きくゆったりと、輝かしく流れていきます。","len":"13:19","g":"クラシック"},"classical/montagues":{"c":"プロコフィエフ","w":"「ロメオとジュリエット」より","p":"モンタギュー家とキャピュレット家","pt":"CMやドラマでおなじみの曲です。はじめに、ぞっとするような不協和音（にごった和音）が鳴り、緊張がはしります。続いて弦が重々しい行進のリズムを刻み、その上で金管が力強い旋律を歌いあげます。気位の高い貴族たちが、ずしりと足音をたてて踊るようです。中ほどでは、フルートが少女のように可憐な旋律を吹く、やさしい場面がはさまります。","len":"5:29","g":"クラシック"},"classical/moonlight":{"c":"ベートーヴェン","w":"ピアノ・ソナタ第14番「月光」","p":"第1楽章","pt":"低い音のゆっくりした歩みと、絶え間なく揺れる3つずつの音の上に、静かなメロディがぽつりぽつりと浮かんできます。音量はずっと小さいまま、ひんやりとした夜の空気の中で、深い物思いにしずんでいくよう。幻想的で、少しさびしい美しさが心にしみます。最後まで声をひそめたまま、深い静けさの中に消えていきます。","len":"5:46","g":"クラシック"},"classical/morning":{"c":"グリーグ","w":"「ペール・ギュント」より","p":"朝","pt":"フルートが、やわらかな朝の光のような旋律をそっと吹き、オーボエがそれにこだまのように答えます。2つの楽器が呼び交わすうちに、少しずつ空が明るくなっていくようです。やがて弦楽器が加わって、大きく輝かしく盛り上がる瞬間は、太陽がすっかり顔を出したよう。そのあと音楽はおだやかに落ち着き、さわやかな静けさの中で終わります。","len":"4:04","g":"クラシック"},"classical/mother":{"c":"ドヴォルザーク","w":"わが母の教えたまいし歌","p":"1曲","pt":"ピアノがやさしく寄りそう中、子守歌のようにゆったりとした旋律が歌い出されます。遠い日の思い出を胸に抱きながら語りかけるような、素朴で温かい調べです。旋律はなだらかに高まり、ふと声がふるえるような、こみ上げる思いがあふれます。短い歌ですが、聴き終えたあとも、なつかしさが心に長く残ります。","len":"3:16","g":"クラシック"},"classical/mpc20":{"c":"モーツァルト","w":"ピアノ協奏曲第20番 ニ短調 K.466","p":"第1楽章","pt":"低い弦がざわざわと不安げにうごめき、遠くで雷が鳴るような暗い響きで始まります。やがてオーケストラ全体が激しく爆発し、嵐の中へ引きずりこまれるよう。ピアノはオーケストラとは別の、ひとりつぶやくような哀しいメロディで静かに入ってきて、やがて激しくぶつかり合っていきます。暗い情熱が渦を巻いたあと、最後は嵐が去ったように静かに消えていきます。","len":"14:40","g":"クラシック"},"classical/mpc21":{"c":"モーツァルト","w":"ピアノ協奏曲第21番 ハ長調 K.467","p":"第2楽章","pt":"弱音器（音をやわらげる道具）をつけた弦が、つまびく音と細かく揺れる伴奏にのせて、夢のように甘いメロディを歌い出します。やがてピアノが同じメロディを受け継ぎ、ひとつひとつの音を大切に置いていきます。ときおり和音がふっと陰り、甘さの奥に切なさがのぞく瞬間があります。時間が止まったような、静かで美しいひとときです。","len":"7:04","g":"クラシック"},"classical/mpc23":{"c":"モーツァルト","w":"ピアノ協奏曲第23番 イ長調 K.488","p":"第2楽章","pt":"ピアノがひとりで、ゆっくりと揺れるような、ひそやかに悲しいメロディを弾き始めます。そのあとオーケストラが、木管の温かい音色をまじえて、そっと寄りそうように応えます。明るい曲の真ん中にぽっかりあいた、静かな哀しみの泉のような楽章です。涙をこらえて遠くを見つめるような、深いさびしさが胸にしみます。","len":"8:04","g":"クラシック"},"classical/mpc27":{"c":"モーツァルト","w":"ピアノ協奏曲第27番 K.595","p":"第1楽章","pt":"弦がやさしく伴奏を刻み始めると、すぐにヴァイオリンが、穏やかで澄んだメロディを歌い出します。ピアノが入ってきても大げさな見せびらかしはなく、ひとつひとつの音が透きとおった水のように流れていきます。明るい長調なのに、ときどきふっと遠くを見るような寂しさが混じり、胸にしみます。最後のピアノ協奏曲らしい、静かに澄みきった晩年の世界です。","len":"13:17","g":"クラシック"},"classical/mrav":{"c":"チャイコフスキー","w":"交響曲第5番","p":"全曲（ムラヴィンスキーの録音）","pt":"チャイコフスキー演奏の規範と言われる録音です。冒頭、クラリネットが暗く沈んだ「運命の旋律」を吹きます。この旋律が4つの楽章を通して形を変えて現れ、最後の楽章では明るく堂々とした行進に生まれ変わります。この録音は、むだのないきびしい響きの中に、燃えるような熱が秘められていて、最後の盛り上がりに圧倒されます。","len":"43:13","g":"クラシック"},"classical/mspc":{"c":"バルトーク","w":"弦楽器、打楽器とチェレスタのための音楽","p":"全曲","pt":"「弦チェレ」の略称でも呼ばれます。はじめは弱音器をつけた弦が、霧の中からはい出してくるように、くねくねとした旋律を重ねていきます。続く楽章では、弦が左右から呼びかけ合い、生き生きとはずみます。第3楽章は木琴のコツコツという音やティンパニの音のうねりが、ぞっとする夜の気配を描きます。最後は民謡風の踊りで明るく終わります。","len":"31:59","g":"クラシック"},"classical/mullerin":{"c":"シューベルト","w":"歌曲集「美しき水車小屋の娘」","p":"第1曲「さすらい」","pt":"ピアノが、くるくる回る水車や流れる水のような伴奏を刻み、元気な歌が始まります。若者が「さすらうことこそ楽しみ」と、旅立ちの喜びを同じ旋律で何度もくり返して歌います。明るく弾むリズムに、これから始まる物語への期待で胸がふくらみます。いくつもの歌で1つの物語を作る連作歌曲の、晴れやかな最初のページです。","len":"2:42","g":"クラシック"},"classical/musici":{"c":"ヴィヴァルディ","w":"「四季」","p":"「春」第1楽章（イ・ムジチの録音）","pt":"日本で「四季」ブームを起こした録音です。全員の明るく元気な合奏で、春の訪れをよろこぶ旋律が始まります。続いてヴァイオリンが、小鳥のさえずりをかろやかに描き、小川のせせらぎも聞こえてきます。とつぜん雷が鳴りひびく場面もありますが、やがて晴れ間がのぞき、最初の明るい旋律が戻って終わります。あたたかく、のびやかな響きが魅力です。","len":"3:32","g":"クラシック"},"classical/mvc":{"c":"メンデルスゾーン","w":"ヴァイオリン協奏曲 ホ短調（メンコン）","p":"第1楽章（動画は全曲。はじめの約13分）","pt":"弦のさざ波のような伴奏が鳴るやいなや、ヴァイオリンが前置きなしに切ない旋律を歌い出します。胸の奥をしめつけるような旋律が高くのぼり、オーケストラと一緒に熱く燃え上がります。ヴァイオリンがひとりで腕を見せるカデンツァ（独奏の聴かせどころ）のあと、最初の旋律が戻ってくるところは鳥肌もの。哀しみと情熱が、最後まで一気に駆け抜けます。","len":"28:03","g":"クラシック"},"classical/mvc5":{"c":"モーツァルト","w":"ヴァイオリン協奏曲第5番「トルコ風」K.219","p":"第3楽章","pt":"第3楽章は、メヌエット（3拍子の上品な踊り）のテンポで、ヴァイオリンが優雅に歌い出します。宮廷で貴族たちが踊っているような気品ある音楽が続いたあと、途中で急に短調の激しい音楽に切りかわり、異国の軍楽隊のようににぎやかになります。その荒々しさと元の優雅さとの落差が、なんとも楽しいところ。最後はまた上品なメヌエットに戻り、さらりと終わります。","len":"8:56","g":"クラシック"},"classical/neptune":{"c":"ホルスト","w":"組曲「惑星」より","p":"海王星","pt":"フルートやハープ、チェレスタが、ゆらゆらとただようような、ふしぎな和音を静かに鳴らします。太陽から遠く離れた、冷たく暗い宇宙の果てにいるような感覚です。音楽はほとんど大きくならず、静かなまま神秘的に続きます。やがて舞台裏から女声合唱が聞こえてきて、ゆっくりと遠ざかり、どこまでも消えていくように終わります。","len":"7:00","g":"クラシック"},"classical/nimrod":{"c":"エルガー","w":"「エニグマ変奏曲」より","p":"ニムロッド","pt":"弦楽器が、ほとんど聞こえないほど静かに、祈るような旋律を歌い始めます。ゆっくりとした歩みの中で、旋律は少しずつ大きくふくらみ、やがて全員の力で胸がいっぱいになるような頂点に達します。そのあと潮が引くように静まり、深い余韻を残して終わります。イギリスで追悼の場によく使われるのもうなずける、気高い悲しみの音楽です。","len":"3:09","g":"クラシック"},"classical/noct2":{"c":"ショパン","w":"ノクターン第2番 変ホ長調 作品9-2","p":"1曲","pt":"左手がゆったりと揺れるリズムを刻み、その上で右手が、夜にささやくような甘いメロディを歌い出します。同じメロディが戻ってくるたびに細かな飾りの音がふえ、きらめきを増していくのを聴きくらべてみてください。終わり近くでは、高い音が小さく震えるように駆けめぐる見せ場があり、そのあと夢から覚めるように静かに閉じます。いちばん有名なノクターンらしい、やさしい夜の空気に包まれます。","len":"4:42","g":"クラシック"},"classical/noct20":{"c":"ショパン","w":"ノクターン第20番 嬰ハ短調「遺作」","p":"1曲","pt":"ゆっくりした静かな和音のあと、深い悲しみをたたえた旋律が、ひとりごとのように歌い出されます。途中で少し明るく軽やかな場面がはさまり、ほんのひととき遠い思い出がよみがえるよう。そしてまた悲しい旋律が戻り、細かい音が涙のようにこぼれ落ちていきます。最後は明るい長調の響きで、ふっと救われるように静かに終わります。","len":"4:40","g":"クラシック"},"classical/november":{"c":"武満徹","w":"ノヴェンバー・ステップス","p":"全曲","pt":"尺八と琵琶とオーケストラの曲です。オーケストラのかすかなざわめきの中に、尺八の息のかすれた音と、琵琶のはじけるような強い音がつきささります。音と音のあいだの「間（ま）」や静けさが、とても大切にされています。中ほどの尺八と琵琶だけの長い対話は、風の吹く山の中で、ふたりが語り合っているような緊張感です。","len":"19:07","g":"クラシック"},"classical/nutmarch":{"c":"チャイコフスキー","w":"バレエ「くるみ割り人形」","p":"行進曲","pt":"金管とクラリネットが、元気な呼びかけのようなリズムで行進を始め、弦楽器が軽やかに答えます。クリスマスの夜、子どもたちがわくわくしながら集まってくる場面です。中ほどで、細かく速い音がいたずらっぽくちらりと顔を出し、また楽しい行進に戻ります。短い中に、きらきらした楽しさがつまった小品です。","len":"2:26","g":"クラシック"},"classical/nw-2":{"c":"ドヴォルザーク","w":"交響曲第9番「新世界より」","p":"第2楽章（ラルゴ）","pt":"金管と木管がそっと重ねる厳かな和音で、夕暮れの幕が上がります。やがてイングリッシュホルン（オーボエより少し低く、やわらかな音の笛）が、あの「家路」のメロディを静かに歌い出します。遠いふるさとを見つめるような、懐かしくて胸がきゅっとなる響き。最後は消え入るように終わり、長い一日がそっと閉じていきます。","len":"14:07","g":"クラシック"},"classical/nw-4":{"c":"ドヴォルザーク","w":"交響曲第9番「新世界より」","p":"第4楽章","pt":"低い弦が2つの音をくり返しながら速さと力を増し、オーケストラ全体が爆発する瞬間から始まります。そこへホルンとトランペットが、胸を張るような力強い主題を高らかに吹き鳴らし、映画音楽のような迫力に包まれます。途中ではクラリネットのやさしい歌や、前の楽章のメロディの思い出も顔を出します。最後の和音は大きく鳴ったあと、長く引きのばされて遠くへ消えていきます。","len":"11:59","g":"クラシック"},"classical/october":{"c":"チャイコフスキー","w":"ピアノ曲集「四季」","p":"10月「秋の歌」","pt":"ピアノが、うつむきがちな悲しい旋律を、ひとつひとつかみしめるように歌い出します。やがてもう1つの声が寄りそい、2人で語り合うように旋律が重なります。散っていく落ち葉や、肌寒い秋の夕暮れが目に浮かぶような音楽です。「四季」の中でも特にさびしく美しい曲で、最後は静かに、名残を惜しむように消えていきます。","len":"5:54","g":"クラシック"},"classical/ombra":{"c":"ヘンデル","w":"「オンブラ・マイ・フ」（オペラ「セルセ」より）","p":"1曲","pt":"短い前置きの歌のあと、弦のやさしい伴奏にのって、ゆったりとしたメロディが歌い出されます。ひとつひとつの音が長くのばされ、木もれ日の下で深く息をつくような、やすらかな時間が流れていきます。声がふくらんでは静まるたびに、心の緊張がほどけていくよう。「ラルゴ」とも呼ばれ、CMでも有名な、穏やかさそのものの1曲です。","len":"3:48","g":"クラシック"},"classical/op111":{"c":"ベートーヴェン","w":"ピアノ・ソナタ第32番 作品111","p":"第2楽章（アリエッタ）","pt":"祈りのように静かで素朴な主題が、ゆっくりと歌われます。その主題が変奏（形を変えてくり返すこと）されるたびにリズムが細かくなり、まるで踊り出すような、はずむ場面も訪れます。やがて高い音で長いトリル（細かくふるえる音）がきらめき、音楽は光に包まれて空へのぼっていくよう。最後のピアノ・ソナタの、この世を静かに離れていくような安らぎを味わってください。","len":"18:35","g":"クラシック"},"classical/orfeo":{"c":"モンテヴェルディ","w":"オペラ「オルフェオ」","p":"トッカータ（幕開け）","pt":"トランペットたちが、きらびやかなファンファーレを高らかに吹き鳴らして、オペラの幕が上がります。同じ華やかな音楽が何度かくり返され、いよいよ物語が始まるという宮廷のざわめきと期待が伝わってきます。ほんの短い曲ですが、時をさかのぼって劇場の客席に座っているような気分に。現存する最初期のオペラの傑作の、晴れがましい入口です。","len":"1:41","g":"クラシック"},"classical/organ":{"c":"サン＝サーンス","w":"交響曲第3番「オルガンつき」","p":"第4楽章（後半）","pt":"パイプオルガンが、どーんと大きな和音を鳴らして始まります。会場ぜんたいの空気がふるえるような、圧倒的な響きです。続いてピアノのきらめきにのり、弦と金管が堂々とした旋律を歌いあげます。何度も波のように盛り上がり、最後はオルガンとオーケストラがひとつになって、まばゆい光の中で力強く終わります。","len":"8:32","g":"クラシック"},"classical/paganini18":{"c":"ラフマニノフ","w":"パガニーニの主題による狂詩曲","p":"第18変奏","pt":"とびきり甘美で、単独でもよく使われる変奏です。まずピアノがひとりで、ゆっくりとやさしい旋律を語りはじめます。それを弦が受けとると、旋律は大きくふくらみ、胸があつくなるような高まりへと向かいます。最高潮のあと、波が引いていくように静まり、甘い余韻だけを残して終わります。","len":"2:57","g":"クラシック"},"classical/pathetique":{"c":"ベートーヴェン","w":"ピアノ・ソナタ第8番「悲愴」","p":"第2楽章","pt":"ピアノが、ゆったりとした落ち着いた声で、歌うようなメロディを語りかけます。メロディは真ん中の音域で温かく響き、その下で伴奏がやさしく支えて、心を包みこむような安らぎがあります。途中で短調に変わって少し不安な影が差しますが、やがてまたあの美しい歌が戻ってきます。歌やCMにも使われるのが納得の、だれの心にも届く深い慰めの音楽です。","len":"5:30","g":"クラシック"},"classical/pavane":{"c":"ラヴェル","w":"亡き王女のためのパヴァーヌ","p":"1曲","pt":"ゆったりとした古風な踊りの曲です。やわらかな旋律が、遠い昔の宮廷の廊下をしずかに歩くように始まります。悲しみというより、なつかしい写真をそっとながめるような、やさしい切なさがあります。中ほどで少し影がさしたあと、最初の旋律が戻ってきて、ゆっくりおじぎをするように終わります。","len":"6:18","g":"クラシック"},"classical/peter":{"c":"プロコフィエフ","w":"ピーターと狼","p":"全曲","pt":"語り手と楽器で物語を語る曲です。元気な弦の旋律でピーターが登場し、さえずる小鳥、のんびりしたアヒル、こっそり歩く猫などが、次々に楽器で描かれます。やがてホルンの暗く重い響きとともに狼が現れ、空気がぴんと張りつめます。最後はみんなが行進して、にぎやかに終わります。","len":"30:02","g":"クラシック"},"classical/petrushka":{"c":"ストラヴィンスキー","w":"バレエ「ペトルーシュカ」","p":"第1場「謝肉祭の市場」","pt":"お祭りのにぎわいから始まります。フルートがくるくる回るような音を吹き、たくさんの人が行き交う冬の市場が目の前に広がります。手回しオルガンや物売りの声、酔っぱらいの歌などが、あちこちから同時に聞こえてくるようです。やがて人形使いの笛が鳴り、人形たちに命が吹きこまれて、急に激しく踊りだします。","len":"10:28","g":"クラシック"},"classical/pictures":{"c":"ムソルグスキー＝ラヴェル","w":"組曲「展覧会の絵」","p":"全曲（最初の「プロムナード」と最後の「キエフの大門」）","pt":"トランペットがひとりで、堂々としながらも素朴な旋律を吹き、金管が答えて「プロムナード」が始まります。そのあと、絵の1枚1枚が音楽になって、こわい絵、さびしい絵、楽しい絵と次々に現れます。最後の「キエフの大門」では、ゆったりと壮大な賛歌がわき上がり、鐘が鳴りひびいて、巨大な門が目の前にそびえるよう。大音響の中で、胸が熱くなるような締めくくりを迎えます。","len":"35:53","g":"クラシック"},"classical/polfant":{"c":"ショパン","w":"幻想ポロネーズ","p":"1曲","pt":"さまようような和音と、ゆらめく音の流れで、夢の中を探るように始まります。やがてポロネーズ（ポーランドの舞曲）の誇り高いリズムが、少しずつ姿をあらわします。途中では、静かに心の内を見つめるような、深く美しい場面が広がります。最後は、それまでの旋律が力強くよみがえり、輝かしい勝利のように締めくくられます。","len":"13:57","g":"クラシック"},"classical/pollini":{"c":"ショパン","w":"練習曲集","p":"作品10-1（ポリーニの録音）","pt":"完璧な技巧の代名詞と言われる録音です。右手が鍵盤のはしからはしまで、大きな波のように駆けのぼり、駆けおりるのをくり返します。その下で左手が、低く力強い音で骨組みを支えます。ひとつのよどみもない、まるで澄んだ水が流れおちるような演奏で、聴いていて気持ちがすっと晴れていきます。","len":"1:58","g":"クラシック"},"classical/polovtsian":{"c":"ボロディン","w":"「だったん人の踊り」（「イーゴリ公」より）","p":"1曲","pt":"静かな前置きのあと、オーボエが、遠い草原を思わせる甘くもの悲しい旋律を歌い出します。CMや映画でもおなじみの、異国の香りに満ちたメロディです。やがてテンポが上がり、太鼓が打ち鳴らされて、荒々しい男たちの踊りが始まります。踊りはどんどん勢いを増し、最後は熱狂のうずの中で一気に終わります。","len":"11:34","g":"クラシック"},"classical/pomp":{"c":"エルガー","w":"行進曲「威風堂々」第1番","p":"1曲","pt":"勢いよく走り出すような、はつらつとした行進曲で始まります。やがて音楽がおだやかに落ち着き、ゆったりと広がる気品ある旋律が流れ出します。これが卒業式でもおなじみの「希望と栄光の国」。最後にはこの旋律がオーケストラ全体でもう一度堂々と鳴りひびき、胸が熱くなるような高揚感で終わります。","len":"8:42","g":"クラシック"},"classical/prelude7":{"c":"ショパン","w":"前奏曲第7番 イ長調","p":"1曲","pt":"ゆったりとしたやさしい舞曲のリズムで、短い旋律が静かに歌われます。小さなフレーズが、ささやくように何度かくり返されるだけの、とても短い曲です。それでも、そっと手紙を読み返すような、ほのかな温かさと余韻が残ります。胃腸薬のCMでおなじみの、ひと息で聴ける小さな宝石のような曲です。","len":"0:42","g":"クラシック"},"classical/preludes":{"c":"リスト","w":"交響詩「前奏曲（レ・プレリュード）」","p":"1曲","pt":"弦楽器がそっとはじく小さな音で、問いかけるように静かに始まります。その短い音型がだんだん大きく育ち、やがて堂々とした響きになって、人生の始まりを告げます。甘い愛の歌、嵐の場面、のどかな田園の場面と景色が移り変わり、どの場面にも同じ音型が姿を変えて登場します。最後は金管が鳴りひびく、勝利のような輝かしい盛り上がりで締めくくられます。","len":"16:49","g":"クラシック"},"classical/propc3":{"c":"プロコフィエフ","w":"ピアノ協奏曲第3番","p":"第1楽章","pt":"プロコフィエフの代表作の協奏曲です。クラリネットがひとりで、ロシアの歌のような静かな旋律を歌って始まります。それを破るように、弦がさっと走りだし、ピアノが勢いよく飛びこんできます。ピアノは機械のように正確に、きらめきながら鍵盤を駆けまわります。最後は、ピアノとオーケストラがぶつかり合うように、力強く終わります。","len":"8:56","g":"クラシック"},"classical/pulcinella":{"c":"ストラヴィンスキー","w":"「プルチネッラ」組曲","p":"全曲","pt":"バロックの曲をもとにした新古典主義の作品です。耳になじむ古風な旋律が、すっきりと軽やかに鳴りはじめます。ところが、ところどころで和音がちょっとずれたり、思いがけない楽器が顔を出したりして、昔の絵に新しい色を塗ったような楽しさがあります。トロンボーンがすべるような音でおどける曲もあり、思わずにやりとします。","len":"23:54","g":"クラシック"},"classical/queen":{"c":"モーツァルト","w":"オペラ「魔笛」","p":"夜の女王のアリア","pt":"夜の女王が、娘のパミーナに、敵を討てと激しく迫る場面のアリアです。怒りに燃える声が、はげしいオーケストラにのって、鋭く突き刺さるように歌い出されます。聴きどころは、言葉をはなれて「ア・ア・ア・ア」と、ぞっとするほど高い音を細かく打ち鳴らす部分。人間の声とは思えない超高音が、冷たい炎のように燃え上がります。","len":"3:01","g":"クラシック"},"classical/rach2":{"c":"ラフマニノフ","w":"ピアノ協奏曲第2番（ラフ2）","p":"第1楽章","pt":"ピアノがひとりで、遠くの鐘のように少しずつ大きくなる和音8つを鳴らして始まります。その鐘が最高潮に達したところで、弦が暗く大きな旋律を歌いだし、ピアノが波のようにそれを包みます。しばらくすると、ピアノがあたたかく甘い第2の旋律を歌い、胸がしめつけられます。最後は力強く、ぐっと前へ進んで終わります。","len":"11:46","g":"クラシック"},"classical/rach3":{"c":"ラフマニノフ","w":"ピアノ協奏曲第3番（ラフ3）","p":"第1楽章","pt":"最難関の一つとされる協奏曲です。それなのに始まりは意外なほど素朴で、ピアノがロシアの古い歌のような旋律を、静かにぽつりと語ります。そこから音はどんどん複雑になり、ピアノが息もつかせぬ速さで駆けまわります。後半のピアノひとりの長い見せ場は、山脈のようにそびえ立つ迫力。静かな語りに戻って、ふっと終わります。","len":"18:44","g":"クラシック"},"classical/rachsym2":{"c":"ラフマニノフ","w":"交響曲第2番","p":"第3楽章","pt":"弦がふわりとふくらむように始まり、まもなくクラリネットがひとりで、息の長い旋律を歌いだします。夕暮れの川べりで、だれかを思い出しているような、やさしく甘い歌です。旋律はほかの楽器へ受けつがれて、だんだん熱をおびて大きな高まりを迎えます。最後は穏やかな光に包まれ、静かに終わります。","len":"13:55","g":"クラシック"},"classical/radetzky":{"c":"J.シュトラウス1世","w":"ラデツキー行進曲","p":"1曲","pt":"短く勢いのある前奏に続いて、明るく勇ましい行進曲の旋律が流れ出します。思わず体がリズムを刻みたくなる、軽快で楽しい曲です。途中でやわらかくやさしい場面をはさみ、また最初の旋律が戻ってきます。ニューイヤーコンサートの最後に手拍子で会場がひとつになる、幸せな光景を思い浮かべながら聴いてください。","len":"3:25","g":"クラシック"},"classical/raindrop":{"c":"ショパン","w":"前奏曲第15番「雨だれ」","p":"1曲","pt":"同じ音が雨だれのようにくり返される中、やさしく穏やかな旋律が歌われます。中間部に入ると、その音が暗く重い低音の響きに包まれ、雨雲が広がるように不安がふくらんで、大きく高まっていきます。やがて雲が晴れるように、最初のやさしい旋律が戻ってきます。静かな雨音を聴きながら物思いにふけるような、しみじみとした曲です。","len":"5:48","g":"クラシック"},"classical/rameau":{"c":"ラモー","w":"クラヴサン曲「めんどり」","p":"1曲","pt":"同じ音をせわしなく連打する、ちょこちょこした音型で始まり、めんどりが落ち着きなく地面をつついている姿が目に浮かびます。チェンバロの、弦をはじく乾いたきらびやかな音が、そのせわしなさをいっそう生き生きと伝えます。くり返すうちに音が重なり、だんだんにぎやかに騒がしくなっていくのがおかしくて、つい笑ってしまいます。フランス・バロックの、機知に富んだ1曲です。","len":"6:40","g":"クラシック"},"classical/ravelpc":{"c":"ラヴェル","w":"ピアノ協奏曲 ト長調","p":"第2楽章","pt":"ジャズの響きが入った協奏曲の、静かな楽章です。まずピアノがひとりで、ゆったりした伴奏にのせて、飾り気のない旋律を長く長く歌います。やがてオーケストラがそっと寄りそい、終わり近くではイングリッシュホルン（オーボエの仲間で少し低い楽器）がその旋律を歌い、ピアノが細かい音でまわりを飾ります。夕暮れの光のような、やさしい静けさです。","len":"9:42","g":"クラシック"},"classical/reich18":{"c":"ライヒ","w":"18人の音楽家のための音楽","p":"全曲","pt":"ミニマル・ミュージック（短い音型をくり返す音楽）の代表作です。マリンバやピアノが、細かい音を休みなく刻み、波のように脈打ちます。そこに女性の声やクラリネットが、息をするようにふくらんでは引いていきます。ヴィブラフォン（鉄琴）の合図で、響きの色が少しずつ変わり、まるで光の当たり方が変わる景色をながめているようです。","len":"56:32","g":"クラシック"},"classical/reverie":{"c":"ドビュッシー","w":"夢（レヴリー）","p":"1曲","pt":"若いころのやさしいピアノ曲で、ゆらゆらとたゆたう伴奏にのって、夢見るような旋律がそっと歌い出されます。まどろみながら、遠い思い出をたどっているような、やわらかな時間です。中ほどで旋律は少し熱を帯び、胸にあふれる想いのように大きくふくらみます。やがてまた静かに戻り、夢からさめる前のひとときのように消えていきます。","len":"4:33","g":"クラシック"},"classical/revolution":{"c":"ショパン","w":"練習曲「革命」作品10-12","p":"1曲","pt":"いきなり強い和音が打ち鳴らされ、左手が高い所から低い所へ、なだれのように駆け下ります。左手の激しい動きは最後までやまず、その上で右手が、怒りと悲しみに満ちた力強い旋律を叫びます。嵐のような勢いの中に、ときおり悲痛な響きが胸に刺さります。最後は大きな和音で、決然と言い切るように終わります。","len":"2:45","g":"クラシック"},"classical/rhapsody":{"c":"ガーシュウィン","w":"ラプソディ・イン・ブルー","p":"1曲","pt":"クラリネットが低い音でトリル（2つの音をすばやく行き来）をしたあと、「しゃくり上げる」ように一気に高い音までかけ上がる出だしです。そこからジャズのにぎわいと、ピアノの自由な語りが入れかわり立ちかわり現れます。中ほどで、弦がゆったりと歌いだす大きな旋律は、大都会の夕焼けのような美しさ。最後は華やかに盛り上がって終わります。","len":"17:21","g":"クラシック"},"classical/rheingold":{"c":"ワーグナー","w":"楽劇「ラインの黄金」","p":"前奏曲","pt":"コントラバスの低い音が、川底からわき出すように、かすかに鳴りはじめます。そこにホルンが1本ずつ加わってゆったりと同じ形の旋律を重ね、水の流れがだんだん速く、豊かになっていきます。1つの和音のまま、音の波がふくらみ続けて、まるで世界がゆっくりと目覚めていくよう。「指環」の始まりにふさわしい、壮大な夜明けのような音楽です。","len":"4:36","g":"クラシック"},"classical/rhenish":{"c":"シューマン","w":"交響曲第3番「ライン」","p":"第1楽章","pt":"序奏なしに、いきなりオーケストラ全体が大きくうねるような主題で始まります。リズムがわざと拍からずれるように感じられ、川の流れが力強く押し寄せてくるような勢いがあります。途中ではやさしく歌う旋律もあらわれ、川辺の明るい景色がゆったりと広がります。ライン川の風景を思わせる、堂々として晴れやかな楽章です。","len":"9:49","g":"クラシック"},"classical/richter2":{"c":"ラフマニノフ","w":"ピアノ協奏曲第2番","p":"第1楽章（リヒテルの録音）","pt":"冒頭の和音のスケール感が伝説的な演奏です。最初の8つの和音を、ごく小さな音から始めて、まるで遠くの鐘がゆっくり近づいてくるように、たっぷり時間をかけて大きくしていきます。重く、深く、ロシアの大地のような響きです。続く弦の旋律も、ゆったりとした歩みで、どっしりとした悲しみを感じさせます。","len":"11:13","g":"クラシック"},"classical/rite":{"c":"ストラヴィンスキー","w":"バレエ「春の祭典」","p":"全曲","pt":"ファゴットの高い音で始まります。ふつうは低い音の楽器が、苦しそうに細く歌いだすので、ぞくっとするはず。やがていろいろな木管がからみ合い、春の大地がうごめきはじめます。続く場面では、弦がずん、ずんと不規則な強さで同じ和音を打ち鳴らし、体がゆさぶられます。最後は、いけにえの乙女の激しい踊りで、たたきつけるように終わります。","len":"35:59","g":"クラシック"},"classical/rosen":{"c":"R.シュトラウス","w":"楽劇「ばらの騎士」","p":"組曲","pt":"ホルンが高らかに叫ぶように駆け上がる、情熱的な始まりで幕を開けます。銀のばらを手渡す場面では、チェレスタなどがきらきらと光る和音を鳴らし、まるで時間が止まったよう。やがてウィーン風のワルツがたっぷりと流れ、甘く、少しけだるい優雅さに包まれます。華やかさの中に、過ぎていく時への切なさもにじむ音楽です。","len":"27:07","g":"クラシック"},"classical/rshn1":{"c":"R.シュトラウス","w":"ホルン協奏曲第1番","p":"全曲","pt":"オーケストラの和音ひとつのあと、すぐにホルンが堂々としたファンファーレを高らかに吹き鳴らします。若々しく、まっすぐで、聴いているだけで胸がすくような始まりです。真ん中のゆっくりした部分では、ホルンがやわらかく深い声で、しみじみと歌います。最後は狩りの角笛のように軽やかに跳ねまわり、明るく駆け抜けて終わります。","len":"18:39","g":"クラシック"},"classical/rsob":{"c":"R.シュトラウス","w":"オーボエ協奏曲","p":"第1楽章","pt":"チェロが小さくゆらぐような音を奏でると、すぐにオーボエが歌い出し、そのまま息つぎを忘れたかのように長く長く旋律をつむいでいきます。その音色は、澄んだ朝の空気のように明るく、やさしいもの。重々しさや激しさはなく、晴れやかな落ち着きに満ちています。年老いた作曲家が、若いころの思い出をほほえみながら振り返るような、透明な音楽です。","len":"24:21","g":"クラシック"},"classical/sabre":{"c":"ハチャトゥリアン","w":"剣の舞","p":
