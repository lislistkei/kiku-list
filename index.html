"1曲","pt":"小太鼓と木琴が激しく打ち鳴らされ、剣を振りまわすような荒々しい踊りが始まります。速いテンポと鋭いリズムに、聴いているだけで心臓がどきどきしてきます。中ほどでは、サクソフォンなどがのびやかで少し哀愁のある旋律を歌い、ひと息つけます。そしてまた激しい踊りに戻って、一気に終わります。","len":"2:36","g":"クラシック"},"classical/salome":{"c":"R.シュトラウス","w":"楽劇「サロメ」","p":"7つのヴェールの踊り","pt":"激しくかき鳴らすような始まりのあと、オーボエなどが、くねくねとからみつくような妖しい旋律を歌い出します。ゆっくりとした踊りは、1枚ずつヴェールを脱いでいくように、少しずつ熱を帯びていきます。テンポはだんだん速く、渦を巻くように高まり、最後は狂おしいほどの勢いで一気に駆け抜けます。美しさと不気味さが入りまじる、めまいのような音楽です。","len":"9:17","g":"クラシック"},"classical/salut":{"c":"エルガー","w":"愛の挨拶","p":"1曲","pt":"婚約者にささげた曲らしく、やさしく語りかけるような旋律がゆったりと流れ出します。大切な人にそっと手紙を手渡すような、はにかんだ温かさに満ちています。中ほどで少しだけ熱を帯び、想いがあふれそうになりますが、またおだやかな旋律に戻っていきます。短い曲に、まっすぐな愛情がつまっています。","len":"2:59","g":"クラシック"},"classical/scarbo":{"c":"ラヴェル","w":"「夜のガスパール」より","p":"スカルボ","pt":"ピアノの低い音が、闇の中でごろごろとうなるように始まります。そこから小悪魔が急に飛びだしては消え、また別の場所に現れるような、不気味な音の跳ね回りが続きます。同じ音をすばやく連打するところは、ぞくっとするほど鋭いです。大きく荒れ狂ったあと、ふっと姿を消すように終わります。超難曲として知られる、ピアニストの腕の見せどころです。","len":"9:27","g":"クラシック"},"classical/scarlatti":{"c":"D.スカルラッティ","w":"鍵盤ソナタ ホ長調 K.380","p":"1曲","pt":"ゆったりとした足取りで、行列が進んでいくような気品ある音楽で始まります。途中で角笛やラッパの呼び声のような明るい響きが、何度もこだまします。ピアノで弾かれると、ひとつひとつの音が宝石のように光り、宮殿の中庭を歩いているような優雅な気分に。わずか数分の中に、華やかさと気高さがぎゅっと詰まっています。","len":"5:13","g":"クラシック"},"classical/sch1":{"c":"シューマン","w":"交響曲第1番「春」","p":"第1楽章","pt":"金管楽器の明るい呼びかけに、オーケストラ全体が大きく応えて、ゆったりとした序奏が始まります。だんだん空気があたたまり、つぼみがふくらむような期待が高まったところで、音楽は一気に速く、軽やかに走り出します。弾むリズムと明るい響きで、喜びがあふれ出すよう。結婚の翌年に書いた幸福な曲らしい、生きる喜びに満ちた楽章です。","len":"12:34","g":"クラシック"},"classical/scheherazade":{"c":"リムスキー＝コルサコフ","w":"交響組曲「シェエラザード」","p":"第1楽章","pt":"オーケストラが低く重々しく、こわい王のテーマを鳴らして始まります。するとハープにのって、独奏ヴァイオリンが、なめらかに語り手シェエラザードの旋律を奏で、物語の幕が開きます。第1楽章は「海とシンドバッドの船」。弦楽器が大きくうねる波をえがき、船がゆったりと大海原を進んでいくような、広々とした音楽が続きます。","len":"10:32","g":"クラシック"},"classical/scherzo2":{"c":"ショパン","w":"スケルツォ第2番 変ロ短調","p":"1曲","pt":"ささやくような小さな問いかけに、突然大きな和音が答える、はっとする始まりです。そのあと、のびやかで情熱的な旋律が大きく歌われ、心が一気に開けていきます。中間部では静かで夢見るような場面が広がり、やがてまた激しい流れへ戻っていきます。激しく劇的な曲は、最後に明るく輝かしく盛り上がって終わります。","len":"11:01","g":"クラシック"},"classical/scottish":{"c":"メンデルスゾーン","w":"交響曲第3番「スコットランド」","p":"第1楽章","pt":"ゆっくりした序奏で、霧の立ちこめる古い礼拝堂を思わせる、もの悲しい旋律が静かに歌われます。やがて音楽は速くなり、その旋律から生まれた、ざわざわと落ち着かない主題が流れ出します。終わり近くには嵐が吹き荒れるように激しく高まる場面もあり、北国の荒々しい自然が目に浮かびます。最後はふたたび冒頭の寂しい旋律が戻り、静かに次の楽章へ受けわたされます。","len":"13:53","g":"クラシック"},"classical/serenade":{"c":"チャイコフスキー","w":"弦楽セレナード","p":"第1楽章","pt":"弦楽器だけが、厚く豊かな響きで、大きな階段をゆっくり下りるような旋律を奏でて始まります。日本ではCMでおなじみの、あの堂々とした出だしです。そのあと、軽やかで明るい音楽に変わり、弦楽器たちが楽しそうに語り合います。最後に冒頭の旋律が戻ってきて、温かく胸に広がるように締めくくられます。","len":"9:38","g":"クラシック"},"classical/shos5":{"c":"ショスタコーヴィチ","w":"交響曲第5番","p":"第4楽章","pt":"ティンパニと金管が、いきなり堂々とした行進をはじめます。テンポはどんどん速まり、すべてが前へ前へと押し流されていきます。中ほどで急に静まり、ひっそりとした物思いの時間が流れます。最後は、ティンパニが同じ音をたたき続ける中、オーケストラが大きく盛り上がって終わります。勝利の行進か、体制批判か、どう聞こえるかは、あなたしだいです。","len":"11:24","g":"クラシック"},"classical/shos7":{"c":"ショスタコーヴィチ","w":"交響曲第7番「レニングラード」","p":"第1楽章","pt":"はじめは穏やかで広々とした旋律が流れ、平和な町の暮らしを思わせます。やがて小太鼓がかすかにリズムを刻みはじめ、どこかのんきな行進の旋律が現れます。同じ行進の旋律がくり返し大きくなり、楽器も増えて、だんだん恐ろしい怪物のような姿に変わっていきます。頂点で響く叫びのあとは、深い悲しみと静けさが残ります。","len":"31:43","g":"クラシック"},"classical/sicilienne":{"c":"フォーレ","w":"シチリアーノ","p":"1曲","pt":"ゆれるような舞曲です。ゆりかごのようにゆったりとした伴奏にのって、どこか物悲しく、それでいて品のよい旋律が流れます。舟に乗って波にゆられているような、心地よいリズムです。中ほどで少し明るさがさしたあと、最初の旋律が戻り、夢見るように終わります。","len":"3:00","g":"クラシック"},"classical/siegfriedfun":{"c":"ワーグナー","w":"ジークフリートの葬送行進曲（「神々の黄昏」より）","p":"1曲","pt":"低い弦楽器と、ずしんと重く打たれるティンパニで、暗く静かに始まります。やがて金管楽器が、英雄の生涯をふりかえるように、いくつもの旋律を次々に奏でます。悲しみはだんだん大きく重くなり、オーケストラ全体が叫ぶような壮大な響きに達します。英雄の死を悼む、圧倒的な重さと荘厳さを全身で受け止めてください。","len":"8:19","g":"クラシック"},"classical/slavdance":{"c":"ドヴォルザーク","w":"スラヴ舞曲 作品72-2","p":"1曲","pt":"ヴァイオリンが、ゆるやかに揺れる、もの悲しくも甘い旋律を歌い出します。遠い故郷を想うような、ほろりとさせる哀愁の調べです。中ほどでは明るい長調に変わり、ふっと日が差して、人々が笑顔で踊り出すような場面に。やがてまたあの切ない旋律が戻り、名残惜しそうに静かに終わります。","len":"5:00","g":"クラシック"},"classical/slavonic":{"c":"チャイコフスキー","w":"スラヴ行進曲","p":"1曲","pt":"ファゴットとヴィオラが、セルビアの民謡をもとにした、暗く悲しげな旋律を重い足取りで奏でて始まります。その旋律が楽器を変えながらくり返され、少しずつ力を増していきます。やがて嵐のような戦いの音楽となり、さらに勇ましい行進曲へ。最後は全員の大音響で、勝利を高らかに宣言するように終わります。","len":"10:35","g":"クラシック"},"classical/sleeping":{"c":"チャイコフスキー","w":"バレエ「眠れる森の美女」","p":"ワルツ","pt":"にぎやかな前置きのあと、弦楽器がふわりと浮き上がるような、優雅なワルツの旋律を歌い出します。ディズニー映画の歌のもとになった、夢の中で踊っているような甘い調べです。くるくると回りながら、だんだんと華やかさを増していきます。宮殿の広間で、人々が楽しげに踊る情景が目に浮かびます。","len":"5:39","g":"クラシック"},"classical/solemnis":{"c":"ベートーヴェン","w":"ミサ・ソレムニス","p":"キリエ","pt":"オーケストラのおごそかな和音で始まり、合唱が「キリエ（主よ、あわれみたまえ）」と大きく呼びかけます。独唱者たちの声がそれに重なり、祈りがやわらかく広がっていきます。中ほどの「クリステ（キリストよ、あわれみたまえ）」で流れが少し変わり、そのあとまた最初の祈りが戻ってきます。「第九」と同じころの大ミサ曲らしい、大きな聖堂にいるような深い響きを味わってください。","len":"11:11","g":"クラシック"},"classical/solveig":{"c":"グリーグ","w":"「ペール・ギュント」より","p":"ソルヴェイグの歌","pt":"静かな前奏にのって、北国の民謡のように素朴で寂しげな旋律が歌い出されます。遠く離れた人を、季節がめぐってもひたすら待ち続ける、切ない想いの歌です。後半は明るい長調に変わり、軽やかに舞うような旋律が、かすかな希望のように響きます。悲しみと希望が交互に訪れる、胸にしみる音楽です。","len":"5:27","g":"クラシック"},"classical/sorcerer":{"c":"デュカス","w":"交響詩「魔法使いの弟子」","p":"1曲","pt":"はじめは静かで、なにか魔法がかかりそうな、ふしぎな空気がただよいます。やがてファゴット（低い木管楽器）が、とぼけた調子でほうきの行進を吹きはじめます。ほうきがどんどん増え、音楽は大混乱へ。そこへ金管の強い響きとともに、師匠が戻ってきて、一瞬で静まります。最後に、ちょっと照れたような短い音でぴしゃりと終わります。","len":"11:26","g":"クラシック"},"classical/sospiro":{"c":"リスト","w":"演奏会用練習曲「ため息」","p":"1曲","pt":"和音を1音ずつ流すさざ波のような伴奏が広がり、その中から美しい旋律がそっと浮かび上がります。両手が交互にメロディを受けわたし、1本の長い歌が切れ目なく続いているように聞こえます。旋律はだんだん熱をおびて大きく高まり、やがてまた静かに落ち着いていきます。題のとおり、思わずため息がもれるような、甘く切ない曲です。","len":"6:24","g":"クラシック"},"classical/sphaeren":{"c":"ヨーゼフ・シュトラウス","w":"天体の音楽","p":"1曲","pt":"弦楽器がひそやかに、夜空の星をながめるような、神秘的でゆったりとした序奏を奏でます。静かな出だしが美しいワルツで、この部分だけでも心が澄んでいきます。やがてその静けさから、なめらかで上品なワルツがすべり出し、ふわりと宙に浮かぶような心地に。華やかさの中にも夢見るような、しっとりとした美しさが続きます。","len":"9:32","g":"クラシック"},"classical/spiegel":{"c":"ペルト","w":"鏡の中の鏡","p":"1曲","pt":"鈴のように澄んだ響きの曲です。ピアノが、雨だれのような静かな音をやさしくくり返します。その上でヴァイオリン（またはチェロ）が、一つずつ長い音をのばしながら、ゆっくりと歩みます。ほとんど何も起こらないのに、心がしんと静まり、時間が止まったように感じられます。最後は、深い静けさの中に溶けていきます。","len":"8:43","g":"クラシック"},"classical/spring":{"c":"ヴィヴァルディ","w":"「四季」より「春」","p":"全3楽章","pt":"第1楽章は、春が来た喜びをはずむように告げる明るい合奏から始まります。やがて独奏ヴァイオリンたちが、小鳥のさえずりを細かく軽やかに描き、小川のせせらぎも聞こえてきます。突然ざわざわと弦が震えて雷が鳴りますが、嵐が過ぎるとまた鳥たちが歌い出します。のどかな第2楽章、田園の踊りのような第3楽章へと、春の一日が絵巻のように続きます。","len":"11:10","g":"クラシック"},"classical/springsong":{"c":"メンデルスゾーン","w":"「春の歌」（無言歌集より）","p":"1曲","pt":"軽やかに弾む伴奏の上を、明るくのびやかな旋律が、歌うように流れていきます。ところどころに小さな飾りの音がきらめき、花びらが風に舞うような楽しさがあります。旋律はやわらかく高まっては、またふんわりと落ち着き、最後まで穏やかな光に満ちています。歌詞のない歌「無言歌」の1曲らしく、ピアノが人の声のように歌うところを味わってください。","len":"2:35","g":"クラシック"},"classical/standchen":{"c":"シューベルト","w":"歌曲「セレナーデ」（白鳥の歌より）","p":"1曲","pt":"ピアノがギターをつまびくような伴奏を刻み、夜の窓辺で恋人に呼びかける歌が静かに始まります。歌のあとをピアノがこだまのように追いかけ、ひそやかな想いがだんだん熱をおびていきます。終わり近くで、短調からふっと明るい長調に変わるところは、願いを信じるような切ない光。日本でも親しまれる歌の、甘くもの悲しい夜の空気を感じてください。","len":"3:44","g":"クラシック"},"classical/sugarplum":{"c":"チャイコフスキー","w":"バレエ「くるみ割り人形」","p":"金平糖の精の踊り","pt":"弦楽器が指ではじく「ピッ、ピッ」という静かな音にのって、チェレスタ（鉄琴のような音が出る、小さなピアノに似た楽器）が、きらきらと鈴のような旋律を奏でます。夜の宮殿に、氷の粒がこぼれ落ちるような、ふしぎで澄んだ響きです。合いの手のように、低いクラリネットがぼそりとつぶやくのもおかしみがあります。甘くて、少しだけ神秘的な、夢の世界の踊りです。","len":"2:29","g":"クラシック"},"classical/swan":{"c":"サン＝サーンス","w":"「動物の謝肉祭」より","p":"白鳥","pt":"ピアノのさざ波のような伴奏が、静かな湖の水面をつくります。その上をチェロの旋律が、白鳥がすべるようにゆったりと進んでいきます。息の長い歌が少しずつ高く昇り、また静かにおりてくるところが美しく、気品の中にほのかな切なさがあります。最後は水面に姿が映るように、そっと消えていきます。","len":"3:07","g":"クラシック"},"classical/swanscene":{"c":"チャイコフスキー","w":"バレエ「白鳥の湖」","p":"情景","pt":"弦楽器のさざ波のようなトレモロとハープにのって、オーボエが哀しいテーマを歌い出します。月明かりの湖に、白鳥が静かに浮かんでいるような情景です。同じ旋律がホルンや弦へと受けつがれ、だんだんと大きく、激しく高まっていきます。最後はオーケストラ全体が悲劇の叫びのように鳴りひびき、かなわない運命を思わせます。","len":"2:58","g":"クラシック"},"classical/syrinx":{"c":"ドビュッシー","w":"シランクス","p":"1曲","pt":"伴奏なしの、フルートひとりだけの曲です。ゆっくりと下へすべり落ちる旋律が、薄暗い森の中で鳴る笛のように響きます。息づかいや音と音のあいだの静けさまでが音楽になっていて、ときおり高く舞い上がっては、また沈んでいきます。最後は低い音がさびしく長くのびて、すうっと消えていきます。","len":"3:22","g":"クラシック"},"classical/t4":{"c":"チャイコフスキー","w":"交響曲第4番","p":"第1楽章","pt":"ホルンとファゴットが、重く鋭いファンファーレを吹き鳴らして始まります。逃れられない「運命の動機」です。続いて弦楽器が、よろめくようなワルツ風の悲しい旋律を歌い、不安な心の揺れがえがかれます。クラリネットが夢見るように歌う場面では、ひととき甘い幻にひたれますが、やがて運命のファンファーレが割りこみ、現実に引き戻されます。","len":"17:44","g":"クラシック"},"classical/t5":{"c":"チャイコフスキー","w":"交響曲第5番","p":"第2楽章","pt":"低い弦楽器がしずかに和音を重ねると、その上にホルンがひとり、あたたかく切ない旋律を歌い出します。夕暮れの空を見上げながら、誰かを想うような音楽です。やがてオーボエとの語らい、弦の大きなうねりへと続き、胸がいっぱいになるほど高まります。ところが頂点で、運命の主題が金管で荒々しく割りこみ、甘い夢が打ちくだかれるのが心に残ります。","len":"12:23","g":"クラシック"},"classical/t6-3":{"c":"チャイコフスキー","w":"交響曲第6番「悲愴」","p":"第3楽章","pt":"弦楽器が小刻みに走り回る、せわしない音から始まります。そのすき間に、木管が小さな行進曲のかけらを、ちらちらとのぞかせます。かけらは少しずつ集まって大きくなり、ついにはオーケストラ全体の勝利の行進曲として鳴りひびきます。最後はたたみかけるような力強さで華やかに終わるので、思わず拍手したくなるのも無理はありません。","len":"8:56","g":"クラシック"},"classical/t6-4":{"c":"チャイコフスキー","w":"交響曲第6番「悲愴」","p":"第4楽章","pt":"弦楽器が、すすり泣くような下りの旋律で始まります。ふつう交響曲の最後は華やかに終わるものですが、この曲はゆっくりと沈んでいく、異例の終楽章です。中ほどで、あたたかい旋律が希望のように大きく高まりますが、やがて崩れ落ちてしまいます。銅鑼（どら）が静かに鳴ったあと、最後は低い弦楽器だけが、心臓の鼓動が消えていくように静かに終わります。","len":"9:53","g":"クラシック"},"classical/tafel":{"c":"テレマン","w":"ターフェルムジーク（食卓の音楽）","p":"序曲","pt":"ゆったりとした堂々たる歩みで始まり、宮廷の広間に人々が集まってくるような晴れがましさがあります。やがてテンポが速まり、楽器たちが軽やかに追いかけっこをしながら、にぎやかな会話を楽しんでいるよう。肩ひじを張らない上品な明るさで、聴いているだけで食卓が華やぐような気分になります。生きていたころはバッハより有名だった、テレマンらしい親しみやすさです。","len":"10:57","g":"クラシック"},"classical/tannhauser":{"c":"ワーグナー","w":"歌劇「タンホイザー」","p":"序曲","pt":"木管楽器が、静かでおごそかな巡礼の歌をゆっくりと奏で、それがだんだん大きく力強い響きへと育っていきます。やがて音楽はがらりと変わり、妖しく、きらびやかで熱っぽい快楽の世界が渦を巻きます。誘惑と、救いを求める祈りとがせめぎ合い、緊張が高まっていきます。巡礼の合唱の旋律に始まるこの序曲の、祈りと誘惑のドラマを感じてください。","len":"14:50","g":"クラシック"},"classical/tapkaara":{"c":"伊福部昭","w":"シンフォニア・タプカーラ","p":"全曲","pt":"北海道のアイヌの踊りの熱気が伝わる曲です。同じリズムが力強くくり返され、足を踏み鳴らすような原始的なエネルギーが体にひびいてきます。ゆっくりの楽章では、遠い北国の静かな夜を思わせる、さびしく素朴な旋律が流れます。最後の楽章は、踊りがどんどん激しくなり、熱狂の渦の中で一気に終わります。","len":"30:55","g":"クラシック"},"classical/tell":{"c":"ロッシーニ","w":"「ウィリアム・テル」序曲","p":"最後の部分（スイス軍の行進）","pt":"運動会でおなじみの部分です。トランペットのファンファーレが高らかに鳴りひびき、出発の合図をつげます。続いて弦が、馬が全速力で駆けていくような、休みのないリズムで走りだします。風を切って野原を駆けぬけるような爽快感で、最後は堂々と、はなやかに終わります。","len":"3:06","g":"クラシック"},"classical/till":{"c":"R.シュトラウス","w":"交響詩「ティル・オイレンシュピーゲルの愉快ないたずら」","p":"1曲","pt":"弦楽器が「むかしむかし」と語りだすようにやさしく始まり、すぐにホルンがいたずら者ティルのテーマを軽やかに吹きます。甲高いクラリネットは、舌を出して笑うティルそのもの。町中を引っかき回すにぎやかな騒ぎのあと、太鼓の音とともに重々しい裁きの場面がやってきます。最後はクラリネットが悲鳴のように叫びますが、おしまいには「むかしむかし」の音楽が戻り、ほほえみで幕が下ります。","len":"16:40","g":"クラシック"},"classical/toccata":{"c":"バッハ（とされる）","w":"トッカータとフーガ ニ短調 BWV565","p":"1曲","pt":"オルガンが高い音で「チャラリ〜」と鋭く鳴らして一気に駆け下り、低い音から積み上がる重い和音がずしんと響きます。教会の天井まで震わせるような迫力に、思わず身がすくみます。そのあとは自由に駆けまわるトッカータから、メロディが追いかけ合うフーガへ。最後はまた嵐のような響きに戻り、堂々と締めくくられます。","len":"9:17","g":"クラシック"},"classical/tpc1":{"c":"チャイコフスキー","w":"ピアノ協奏曲第1番 変ロ短調","p":"第1楽章（動画は全曲。はじめの約20分）","pt":"ホルンが力強く4つの音を吹き下ろし、オーケストラが大きな旋律を歌い出すと、ピアノが鍵盤いっぱいの豪快な和音でそれを支えます。広い大地が目の前に開けるような、壮大な幕開けです。じつはこの名旋律は冒頭にしか出てこず、そのあとはまったく別の、はずむような主題で話が進みます。ピアノとオーケストラがぶつかり合い、ピアノひとりの長い見せ場もあって、最後まで熱く燃え上がります。","len":"37:51","g":"クラシック"},"classical/traumerei":{"c":"シューマン","w":"「トロイメライ」（子供の情景より）","p":"1曲","pt":"ゆっくりと上へのびていく、やさしい旋律で始まります。同じ旋律が少しずつ形を変えながら何度もあらわれ、ふわりと浮かんではまた静かに降りてくるようです。短い曲ですが、遠い日をなつかしむような、あたたかくて少し切ない気持ちが胸に広がります。「夢」という意味の題のとおり、目を閉じて聴きたい静かな小品です。","len":"2:51","g":"クラシック"},"classical/trepak":{"c":"チャイコフスキー","w":"バレエ「くるみ割り人形」","p":"トレパーク","pt":"いきなり元気いっぱいの、はずむようなリズムで始まります。勢いのあるロシアの踊りで、聴いているだけで体が動き出しそう。とても短い曲ですが、最後はどんどん速くなり、タンバリンも加わって、全員で一気に駆け抜けます。拍手したくなるような、にぎやかな締めくくりです。","len":"1:10","g":"クラシック"},"classical/tristan":{"c":"ワーグナー","w":"楽劇「トリスタンとイゾルデ」","p":"前奏曲と愛の死","pt":"チェロがそっと問いかけるような旋律を奏で、そこに重なる不思議な和音が、答えの出ない思いのように宙に浮かびます。そのあと、あこがれは波のように何度も高まっては引き、満たされない切なさが胸をしめつけます。「愛の死」では、その波がついに大きなうねりとなって頂点に達します。最後は、長い長い緊張がようやくほどけて、静かな安らぎの中に溶けていきます。","len":"20:58","g":"クラシック"},"classical/tritsch":{"c":"J.シュトラウス2世","w":"ポルカ「トリッチ・トラッチ」","p":"1曲","pt":"元気いっぱいの速いリズムで、いきなり楽しげに走り出します。オーケストラの楽器たちが、まるで早口でおしゃべりをしているように、次々と短いフレーズを言い合います。息つく暇もないテンポで、笑い声がこぼれるようなにぎやかさ。「おしゃべり」という意味の速いポルカらしい、短くて楽しいひとときです。","len":"3:08","g":"クラシック"},"classical/troldhaugen":{"c":"グリーグ","w":"抒情小品集","p":"「トロルドハウゲンの婚礼の日」","pt":"ピアノが、鐘を鳴らすような明るく堂々とした和音で、お祝いの行列のように始まります。人々が次々と祝いにかけつけてくる、にぎやかでうきうきした情景です。中ほどでは一転して、静かでやさしい旋律が、2人の思い出をいとおしむように歌われます。そしてまた晴れやかな行進が戻り、喜びいっぱいに締めくくられます。","len":"6:54","g":"クラシック"},"classical/trout":{"c":"シューベルト","w":"ピアノ五重奏曲「ます」","p":"第4楽章","pt":"まず弦楽器だけで、歌曲「ます」の親しみやすい旋律がおだやかに紹介されます。そのあと変奏（形を変えてくり返すこと）ごとに、ピアノや低い弦楽器へと主役が入れかわり、同じ旋律がいろいろな顔を見せます。途中には短調の荒々しい変奏も来て、川が急に波立ったような緊張が走ります。最後は、水がはねるような伴奏に乗って、旋律が明るく帰ってきます。","len":"7:42","g":"クラシック"},"classical/turkish":{"c":"モーツァルト","w":"トルコ行進曲（ピアノ・ソナタ第11番 第3楽章）","p":"1曲","pt":"右手が、くるくると細かく回るような音型で、軽やかに始まります。やがて明るい長調の場面に変わり、左手が打楽器のように力強く和音を鳴らして、行進する楽隊が近づいてくるような華やかさに。短調の少し不思議な響きと、明るく堂々とした響きが交互に現れ、景色が次々に入れかわります。最後は長調で、楽隊が勢いよく通りすぎていくように終わります（ベートーヴェンの同名曲とは別の曲です）。","len":"4:07","g":"クラシック"},"classical/tvc":{"c":"チャイコフスキー","w":"ヴァイオリン協奏曲 ニ長調","p":"第1楽章","pt":"オーケストラのやさしい前置きのあと、ヴァイオリンが短いひとりごとのように入り、のびやかで甘い主題を歌い出します。初演で酷評されたのがうそのような、春の光のようにあたたかな旋律です。オーケストラ全体がこの主題を堂々と鳴らす場面は胸が躍ります。カデンツァ（独奏者が一人で腕を見せる部分）のあと、フルートが主題をそっと受け取る瞬間も美しく、最後は目のくらむような速さで終わります。","len":"19:23","g":"クラシック"},"classical/twinkle":{"c":"モーツァルト","w":"きらきら星変奏曲 K.265","p":"全曲","pt":"まず、だれもが知る「きらきら星」のメロディが、ピアノでシンプルに弾かれます。そこから、右手が細かい音でくるくる飾ったり、左手が主役になったり、悲しげな短調になったりと、同じメロディが次々に衣装を着替えていきます。ゆったり歌う変奏ではしっとりと、速い変奏ではわくわくと、表情の変化が楽しめます。最後は華やかに駆け抜けて、明るく締めくくられます。","len":"12:39","g":"クラシック"},"classical/unfinished":{"c":"シューベルト","w":"交響曲「未完成」ロ短調","p":"第1楽章","pt":"チェロとコントラバスが、地の底からのような低い旋律をひっそりとつぶやいて始まります。弦がざわめく上で、オーボエとクラリネットがもの悲しい歌を奏で、続いてチェロが、なつかしくやさしい旋律を歌います。その穏やかさを、突然オーケストラ全体の激しい叫びが打ち破るところに、はっとさせられます。暗い影とやさしい光が交互にさす、切ない楽章です。","len":"11:29","g":"クラシック"},"classical/valkyrie":{"c":"ワーグナー","w":"「ワルキューレの騎行」（楽劇「ワルキューレ」より）","p":"1曲","pt":"木管と弦楽器が、風を切るような細かい音をうずまかせ、馬が空を駆けるような勢いのあるリズムが始まります。そこへ金管楽器が、あの勇ましい旋律を力強く吹き鳴らします。旋律はくり返されるたびに響きが厚くなり、空いっぱいに鳴りわたるような迫力に。荒々しく、胸が高鳴るような高揚感に満ちた曲です。","len":"6:24","g":"クラシック"},"classical/verklarte":{"c":"シェーンベルク","w":"浄められた夜","p":"全曲","pt":"後期ロマン派風で聴きやすい作品です。弦楽器だけで、暗く重い足どりで始まり、月夜の森をとぼとぼと歩くふたりの姿が浮かびます。苦しい告白が胸をしめつけるように続いたあと、やがて温かく包みこむような響きが広がっていきます。最後は、月の光がすべてを浄めるように、明るく、きよらかに消えていきます。","len":"31:01","g":"クラシック"},"classical/vocalise":{"c":"ラフマニノフ","w":"ヴォカリーズ","p":"1曲","pt":"歌詞のない歌です。言葉を使わず、「アー」という声（または楽器）だけで、長く長くつながる旋律が流れます。言葉がないぶん、悲しみやあこがれがそのまま心にしみこんできます。旋律はゆっくりと高みへ昇っていき、いちばん高いところで胸がつまるような切なさに。最後は静かに、ため息のように終わります。","len":"7:10","g":"クラシック"},"classical/waltz2":{"c":"ショスタコーヴィチ","w":"ワルツ第2番（ステージ・オーケストラのための組曲より）","p":"1曲","pt":"映画「アイズ ワイド シャット」でも有名なワルツです。ゆったりとした三拍子にのって、サックスが少し哀しげな旋律を歌いだします。華やかな舞踏会なのに、どこか寂しさや、ノスタルジー（過ぎた日をなつかしむ気持ち）がただよいます。旋律がほかの楽器にも受けつがれて、ゆらゆらと回り続け、最後は堂々と締めくくられます。","len":"4:06","g":"クラシック"},"classical/water":{"c":"ヘンデル","w":"水上の音楽","p":"アラ・ホーンパイプ","pt":"トランペットとホルンが晴れやかに鳴りひびき、弦と木管がにぎやかに応える、きらきらとした音楽です。テムズ川の水面に陽の光がはね返り、華やかな舟がゆったり進んでいく情景が目に浮かびます。中ほどでは少し陰りのある落ち着いた部分に入り、そのあとまた晴れやかな最初の音楽が戻ってきます。国王の舟遊びのための組曲らしい、気品ある楽しさにあふれています。","len":"3:09","g":"クラシック"},"classical/wedding":{"c":"メンデルスゾーン","w":"「結婚行進曲」（「真夏の夜の夢」より）","p":"1曲","pt":"トランペットの華やかなファンファーレで、晴れやかな扉が開きます。続いてオーケストラ全体が、だれもが知っている輝かしい旋律を堂々と鳴らします。途中で少しやさしく甘い表情になる場面をはさみ、また祝福の旋律が戻ってきます。結婚式の定番らしい、まっすぐな喜びにあふれた曲です。","len":"4:59","g":"クラシック"},"classical/wienerwald":{"c":"J.シュトラウス2世","w":"ウィーンの森の物語","p":"1曲","pt":"ホルンや木管の響きで、森の朝の空気が広がるような、のどかな序奏から始まります。やがてツィター（オーストリアの民族楽器）が、素朴でなつかしい音色で、ひとり静かに歌います。そのあと明るく軽やかなワルツが次々に続き、森の中を散歩しているような楽しさに。終わり近くでもう一度ツィターの響きが帰ってきて、思い出をふりかえるような余韻を残します。","len":"12:44","g":"クラシック"},"classical/winter":{"c":"ヴィヴァルディ","w":"「四季」より「冬」","p":"全3楽章","pt":"第1楽章は、弦がぶつかり合う響きを小刻みに重ね、身を切るような寒さにふるえる場面から始まります。独奏ヴァイオリンが激しく走り回り、足を踏み鳴らし、歯をガチガチ鳴らす様子まで聞こえてきます。第2楽章では一転して、ヴァイオリンが暖炉の前のぬくもりをうっとりと歌い上げます。第3楽章は氷の上をそろそろ歩くような足どりから始まり、冬の厳しさと楽しさが入りまじります。","len":"9:27","g":"クラシック"},"classical/winterwind":{"c":"ショパン","w":"練習曲「木枯らし」作品25-11","p":"1曲","pt":"最初はゆっくり静かに、さびしげな旋律が鳴らされます。次の瞬間、右手が嵐のような速さで駆けめぐり、冷たい風が吹き荒れる中を、左手が力強い旋律で進んでいきます。風はいっこうにやまず、ますます激しく渦を巻いていきます。最後は鍵盤を大きく駆け抜け、強い和音でたたきつけるように終わります。","len":"3:35","g":"クラシック"},"classical/wss":{"c":"バーンスタイン","w":"「ウエスト・サイド・ストーリー」より","p":"シンフォニック・ダンス","pt":"ミュージカルの名曲をオーケストラで味わえます。指を鳴らす音から始まり、街角の少年たちの張りつめた空気が伝わってきます。夢見るように美しい「サムホエア」、ラテンのリズムが燃え上がる「マンボ！」の掛け声、いまにも爆発しそうな緊張感の場面が次々に続きます。最後は悲劇のあと、静かな祈りのような響きで終わります。","len":"23:22","g":"クラシック"},"classical/wtc1":{"c":"バッハ","w":"平均律クラヴィーア曲集 第1巻 第1番","p":"前奏曲とフーガ ハ長調","pt":"前奏曲は、同じ形の分散和音（和音を1音ずつ順に鳴らすこと）が、さざ波のように静かにくり返されます。和音が少しずつ移り変わるだけなのに、光の色が変わっていくような不思議な美しさがあります。続くフーガでは、短いメロディが声部を変えながら次々に追いかけ合い、糸が織り上がるように重なっていきます。澄みきった心で聴きたい、「ピアノの旧約聖書」の最初の1曲です。","len":"4:34","g":"クラシック"},"classical/y1812":{"c":"チャイコフスキー","w":"序曲「1812年」","p":"1曲","pt":"ヴィオラとチェロが、ロシアの教会の祈りの歌を、低く厳かに奏でて始まります。やがて不安な空気が広がり、軍隊の行進や戦いの音楽が激しくぶつかり合います。待つべきは最後、勝利を祝う鐘が一斉に鳴りわたり、大砲がドーンと轟く場面。本物の大砲を使う演奏もあるほどの、胸のすくような大音響のクライマックスです。","len":"14:45","g":"クラシック"},"classical/zara":{"c":"R.シュトラウス","w":"交響詩「ツァラトゥストラはかく語りき」","p":"冒頭「日の出」","pt":"映画「2001年宇宙の旅」でおなじみの冒頭です。地の底から響くような低い音が鳴り続ける中、トランペットが3つの音をのばして、日の出を告げます。続くオーケストラの大きな和音と、ティンパニの力強い連打。これがくり返されるたびに光が強くなり、最後はオルガンも加わって、まぶしい太陽が昇りきります。","len":"1:55","g":"クラシック"},"opera/aida-celeste":{"c":"ヴェルディ","w":"『アイーダ』","p":"「清きアイーダ」（第1幕）","pt":"幕が開いてすぐ、将軍ラダメスが「もし自分が総大将に選ばれたら」と、勇ましく夢を語りはじめます。そのあと音楽はふっとやわらかくなり、木管楽器のやさしい響きの中で、ひそかに愛するアイーダを「天のように清らか」とたたえます。戦いの勇ましさと、恋する若者の甘さが同じ歌に入っているのが魅力。最後の高い音まで、声の輝きを味わってください。","len":"3:18","g":"オペラ"},"opera/aida-march":{"c":"ヴェルディ","w":"『アイーダ』","p":"凱旋行進曲（第2幕）","pt":"長いトランペット（アイーダ・トランペット）が、高らかに有名な行進の旋律を鳴りひびかせます。凱旋した軍隊が、大勢の民衆の歓声の中をきらびやかに進んでいく情景が目に浮かびます。合唱が加わり、音がどんどん厚く大きくなって、舞台いっぱいに祝祭の空気が満ちます。思わず胸を張りたくなる、晴れやかな高揚感です。","len":"6:14","g":"オペラ"},"opera/aida-patria":{"c":"ヴェルディ","w":"『アイーダ』","p":"「おお、わが故郷」（第3幕）","pt":"月明かりのナイル川のほとりで、アイーダがひとり故郷を思います。もの悲しい前奏が、静かな夜の川辺の空気を描き出します。「青い空、やさしい風…もう二度と見ることはない」と、思い出を一つずつ数えるように歌う声は、切なさに満ちています。高く、弱く、細く歌われる声に、帰れない故郷への思いがにじみます。","len":"6:54","g":"オペラ"},"opera/aida-ritorna":{"c":"ヴェルディ","w":"『アイーダ』","p":"「勝ちて帰れ」（第1幕）","pt":"アイーダは思わず、恋人ラダメスに「勝って帰って」と声をあげ、すぐにはっと我に返ります。恋人の勝利は、自分の祖国の敗北。激しい言葉と、苦しみに引きさかれるような旋律がめまぐるしく入れかわります。最後は力をなくしたように静かになり、「神よ、あわれみを」と弱く祈ります。その静けさがいちばん痛切です。","len":"7:30","g":"オペラ"},"opera/aida-terra":{"c":"ヴェルディ","w":"『アイーダ』","p":"「さらば、大地よ」（第4幕）","pt":"地下の墓に閉じこめられたラダメスとアイーダが、静かに死を待ちます。オーケストラはとても弱く、高い音で天の光のように透きとおった響きを奏でます。2人は「さらば大地よ」と、かわるがわる、やがて声を重ねて、穏やかに歌います。その上で、もうひとりの女アムネリスが祈る声が重なり、すべてが静かに消えていきます。","len":"4:46","g":"オペラ"},"opera/ariadne":{"c":"R.シュトラウス","w":"『ナクソス島のアリアドネ』","p":"ツェルビネッタのアリア（抜粋）","pt":"喜劇役者ツェルビネッタが、悲しむ女性に「恋はくり返すもの」と、自分の恋の哲学を語る場面です。はじめは語りかけるように、少しからかうように歌いはじめます。やがて声は鳥のように細かく、高く、軽やかに飛びまわり、息をのむような技が次々にくり出されます。あっけらかんとした明るさと、ちらりと見える本音の両方に耳をすませてください。","len":"5:10","g":"オペラ"},"opera/babbino":{"c":"プッチーニ","w":"『ジャンニ・スキッキ』","p":"「私のお父さん」","pt":"娘ラウレッタが「結婚を許してくれなければ川に飛びこむ」と父にせがむ、短く愛らしいアリアです。弦のやさしい響きにのって、とろけるように甘い旋律が流れ出します。いちばん高いところへ声がふわりと上がる瞬間は、思わずため息が出る美しさです。わずか2分ほどの中に、恋する娘のまっすぐな気持ちが詰まっています。","len":"2:57","g":"オペラ"},"opera/ballo":{"c":"ヴェルディ","w":"『仮面舞踏会』","p":"「永久に君を失えば」（第3幕）","pt":"総督（国王）リッカルドが、愛する人をあきらめる決意をします。最初はつぶやくように、迷いながら心を決めていきます。そして「永久に君を失えば」と歌いだす旋律は、深い愛と別れの痛みに満ちていて、声がだんだん熱を帯びていきます。自分の心と戦うような、誇り高くも切ない歌です。","len":"5:49","g":"オペラ"},"opera/bar-calunnia":{"c":"ロッシーニ","w":"『セビリアの理髪師』","p":"「陰口はそよ風のように」（第1幕）","pt":"音楽教師バジリオが、うわさの恐ろしさをバルトロに語ります。はじめは弦楽器のささやくような小さな音で、うわさが耳から耳へこっそり忍びこむ様子を描きます。そこから少しずつ音が大きく、厚くなり、ついには大砲の爆発のような大音響へ。小さな風が嵐になるまでを、耳で体験できる歌です。","len":"4:41","g":"オペラ"},"opera/bar-ecco":{"c":"ロッシーニ","w":"『セビリアの理髪師』","p":"「空はほほえみ」（第1幕）","pt":"夜明け前、伯爵がロジーナの窓の下で歌うセレナードです。前半はゆったりと甘く、「空はほほえみ、美しい夜明けが来る」と、まだ眠る恋人に呼びかけます。後半は速くなり、細かい音を転がす技巧（アジリタ）がたっぷり出てきて、はやる恋心が軽やかに躍ります。白みはじめた空と、窓の向こうの恋人を思い浮かべながら聴いてください。","len":"3:59","g":"オペラ"},"opera/bar-largo":{"c":"ロッシーニ","w":"『セビリアの理髪師』","p":"「私は町の何でも屋」（第1幕）","pt":"オーケストラの陽気な前奏にのって、理髪師フィガロが「ラ・ラ・ラ」と口ずさみながら登場します。「みんながおれを呼ぶ」と得意顔で自慢しはじめ、「フィガロ！フィガロ！」と名前を連呼するところで最高潮に。後半はものすごい早口になり、舌が回るのかとはらはらします。町いちばんの人気者の、自信満々で楽しい自己紹介です。","len":"5:05","g":"オペラ"},"opera/bar-ov":{"c":"ロッシーニ","w":"『セビリアの理髪師』","p":"序曲","pt":"はじめはゆったりした序奏で、これから始まる舞台への期待をふくらませます。やがて速い部分に入ると、軽やかな旋律が弾むように駆けだし、いたずらっぽい空気が広がります。聴きどころは、同じ音型をくり返しながら楽器が1つずつ加わり、音がどんどん大きく盛り上がっていくところ。最後はわくわくが頂点に達したまま、勢いよく終わります。","len":"7:25","g":"オペラ"},"opera/bar-unavoce":{"c":"ロッシーニ","w":"『セビリアの理髪師』","p":"「今の歌声は」（第1幕）","pt":"ロジーナが、窓の下で聞いた恋の歌声を思い出しながら歌いだします。前半はゆったりと、恋する気持ちを確かめるように、甘く夢見るような旋律。後半は調子が変わり、「私はおとなしいの、でも怒らせたら毒蛇よ」と、いたずらっぽく本性をのぞかせます。軽やかな音の転がしに、かわいらしさと気の強さの両方が光ります。","len":"7:20","g":"オペラ"},"opera/boh-addio":{"c":"プッチーニ","w":"『ラ・ボエーム』","p":"「ミミの別れ」（第3幕）","pt":"雪の降る冬の朝、ミミがロドルフォに静かに別れを告げます。「私が来たところへ帰ります」と、穏やかに、やさしく語る声は、泣き叫ぶのではなく、そっとほほえむよう。思い出の小さな帽子を「とっておいて」と頼むところは、胸がきゅっとなります。最後の「恨みっこなしで、さようなら」まで、そのやさしさがかえって切ない歌です。","len":"3:34","g":"オペラ"},"opera/boh-gelida":{"c":"プッチーニ","w":"『ラ・ボエーム』","p":"「冷たい手を」（第1幕）","pt":"暗い屋根裏部屋で、ロドルフォの手が、暗がりでミミの冷たい手にふれます。「なんて冷たい手」と、やさしく語りかけるように歌いはじめ、「僕は詩人です」と自己紹介をします。夢と希望を語るうちに声はどんどん熱を帯び、最後は高い音（ハイC）へと舞い上がります。恋が生まれる瞬間のときめきを、そのまま聴くような歌です。","len":"4:40","g":"オペラ"},"opera/boh-mimi":{"c":"プッチーニ","w":"『ラ・ボエーム』","p":"「私の名はミミ」（第1幕）","pt":"お針子のミミが、少しはにかみながら自分のことを話します。最初は素朴で控えめな語り口で、つつましい暮らしや、刺繍の花の話をします。そして「春になると、最初の日ざしは私のもの」と語るところで、旋律が大きく花開くように広がります。小さな幸せを大切にする人の、あたたかくて少しさびしい歌です。","len":"4:45","g":"オペラ"},"opera/boh-musetta":{"c":"プッチーニ","w":"『ラ・ボエーム』","p":"ムゼッタのワルツ（第2幕）","pt":"クリスマス・イヴのにぎやかなカフェ。派手好きのムゼッタが、元恋人の気を引こうと、ゆったりしたワルツで歌いだします。「私が街を歩けば、みんなが振り向く」と、色っぽく自信たっぷり。やがて周りの人々の声も重なり、ワルツはどんどん華やかにふくらんでいきます。気まぐれなのに憎めない、彼女の魅力があふれます。","len":"2:40","g":"オペラ"},"opera/boh-soave":{"c":"プッチーニ","w":"『ラ・ボエーム』","p":"「愛らしい乙女よ」（第1幕）","pt":"月の光が窓から差しこみ、ロドルフォがミミの姿に見とれます。オーケストラが、さっきの2人の歌の旋律をよみがえらせ、気持ちがひとつに重なっていきます。2人の声が寄りそうように歌い、やがて手をとって部屋を出ていきながら、舞台の外から高い声で「愛！」と歌って終わります。遠ざかる声の余韻まで、ゆっくり味わってください。","len":"4:15","g":"オペラ"},"opera/boh-zimarra":{"c":"プッチーニ","w":"『ラ・ボエーム』","p":"「古い外套よ」（第4幕）","pt":"哲学者コッリーネが、着古した外套（コート）を手に、静かに別れを告げます。低くゆっくりとした歌は、まるで長年の友に語りかけるよう。重々しいなかに、ほのかなユーモアとあたたかさがにじみます。2分ほどの短い歌ですが、友のために大事なものを手放す、男の静かな優しさが胸に残ります。","len":"1:47","g":"オペラ"},"opera/boris":{"c":"ムソルグスキー","w":"『ボリス・ゴドゥノフ』","p":"戴冠式の場","pt":"ボリスが皇帝に即位する、戴冠式の場面です。オーケストラが重々しい2つの和音を何度もくり返し、その上に大小の鐘が鳴りひびいて、モスクワの広場いっぱいに音が満ちていきます。民衆の合唱が皇帝をたたえ、盛大な祝いの空気に包まれます。そのさなかにボリスが心の不安をもらす場面があり、華やかさのかげの暗い影にも耳をすませてください。","len":"4:33","g":"オペラ"},"opera/callas-casta":{"c":"ベッリーニ","w":"『ノルマ』","p":"「清らかな女神よ」（マリア・カラス）","pt":"巫女ノルマが、月の女神に平和を祈るアリアです。弦のやさしいゆれの上を、フルートが静かに旋律を歌い、月の光が森に降りそそぐような情景が広がります。そこにカラスの声が入り、長く美しい旋律を、息の長い流れでたっぷりと歌い上げます。声の中に、祈り、悲しみ、気高さが同時に感じられる、カラスならではの深い表現を味わってください。","len":"7:14","g":"オペラ"},"opera/carlo":{"c":"ヴェルディ","w":"『ドン・カルロ』","p":"王の独白「妻は私を愛したことがない」（第4幕）","pt":"夜明け前、スペイン王フィリッポ2世がひとり書斎で、眠れぬまま孤独をかみしめます。低く沈んだ弦の響きの中で、「妻は私を愛したことがない」と、つぶやくように歌いはじめます。やがて「眠れるのは墓の中だけ」と、権力を持ちながら孤独な男の深いため息へ。重く深い低い声に、王のさびしさがしみこんでいます。","len":"8:11","g":"オペラ"},"opera/carmen-entracte":{"c":"ビゼー","w":"『カルメン』","p":"第3幕への間奏曲","pt":"激しいオペラの中で、ふっと息をつけるような静かな間奏曲です。ハープがやさしく爪弾く上を、フルートがひとりで、ゆったりと澄んだ旋律を歌います。やがてほかの木管楽器も加わり、旋律がやさしく受け渡されていきます。夜明け前の山あいのような、清らかで少しさびしい静けさに包まれます。","len":"2:40","g":"オペラ"},"opera/carmen-final":{"c":"ビゼー","w":"『カルメン』","p":"終幕の二重唱","pt":"闘牛場の外で、ホセとカルメンが最後に向き合う場面です。ホセは「やり直そう」と必死にすがりますが、カルメンははっきりとそれを拒みます。闘牛場の中からは「闘牛士の歌」の明るい合唱と歓声が聞こえ、外の2人の緊張と残酷なほど対照的です。不吉な運命の旋律が鳴りひびき、ホセの悲痛な叫びで幕が下ります。","len":"10:26","g":"オペラ"},"opera/carmen-flower":{"c":"ビゼー","w":"『カルメン』","p":"「花の歌」（第2幕）","pt":"ホセが、牢屋でも大事に持っていたカルメンの花を見せながら、彼女への想いを打ち明ける歌です。静かでやわらかな響きの中、ホセはつらかった日々を思い出すように歌いはじめます。想いが高まるにつれて声も熱を帯び、ひたむきな恋心があふれ出します。最後の「カルメン、愛している」という言葉に、すべての想いがこめられています。","len":"4:43","g":"オペラ"},"opera/carmen-gypsy":{"c":"ビゼー","w":"『カルメン』","p":"「ジプシーの歌」（第2幕）","pt":"酒場でカルメンたちが踊りながら歌う場面です。はじめはゆったりとした、少し気だるいリズムで始まります。くり返すたびに少しずつ速く、熱くなり、タンバリンやカスタネットも加わって、踊りの輪がどんどん激しくなっていきます。最後は息もつかせぬ熱狂の渦になって、一気に締めくくられます。","len":"5:10","g":"オペラ"},"opera/carmen-habanera":{"c":"ビゼー","w":"『カルメン』","p":"「ハバネラ」（第1幕）","pt":"カルメンが初めて登場して歌う「恋は野の鳥」です。低い弦が刻むゆったりとしたリズムの上を、半音ずつすべり落ちるような色っぽい旋律が流れます。合唱が「気をつけて！」と合いの手を入れ、カルメンの自由奔放な魅力がぐんぐん広がります。気まぐれで、つかまえられない恋そのもののような歌です。","len":"6:22","g":"オペラ"},"opera/carmen-micaela":{"c":"ビゼー","w":"『カルメン』","p":"「ミカエラのアリア」（第3幕）","pt":"ホセを連れ戻すため、ひとりで山の中の密輸団の隠れ家へ来た娘ミカエラの歌です。ホルンのやわらかな響きに導かれ、おだやかで清らかな旋律が始まります。「何も怖くない」と言いながらも、途中で不安に揺れ、声がふるえるところがあります。神に力を祈りながら勇気をふりしぼる、けなげで心に残る歌です。","len":"6:29","g":"オペラ"},"opera/carmen-prel":{"c":"ビゼー","w":"『カルメン』","p":"前奏曲","pt":"闘牛場のにぎわいを思わせる、明るく元気な行進曲で始まります。途中で「闘牛士の歌」のおなじみの旋律が出てきて、華やかな気分はさらに盛り上がります。ところが急に空気が変わり、低い弦がうなるように不吉な「運命の動機」を奏でます。最後は緊張したまま、断ち切られるように終わり、悲劇の幕開けを予感させます。","len":"2:22","g":"オペラ"},"opera/carmen-seguidilla":{"c":"ビゼー","w":"『カルメン』","p":"「セギディーリャ」（第1幕）","pt":"縛られたままのカルメンが、見張りの兵士ホセを誘惑する歌です。スペインの踊りのリズムにのせて、軽やかでいたずらっぽい旋律が流れます。「町はずれの酒場で踊りましょう」とささやくような歌に、ホセの心がしだいにぐらついていくのが伝わります。甘く危険な駆け引きのスリルを楽しんでください。","len":"4:20","g":"オペラ"},"opera/carmen-toreador":{"c":"ビゼー","w":"『カルメン』","p":"「闘牛士の歌」（第2幕）","pt":"闘牛士エスカミーリョが、酒場に颯爽と登場して歌う歌です。力強い行進曲のようなリズムで、闘牛場の興奮を語ってみせます。くり返しの部分では酒場の人々も合唱に加わり、「闘牛士よ、構えよ」と大きく盛り上がります。自信たっぷりで男らしい、華やかなスターの登場をたっぷり味わってください。","len":"4:32","g":"オペラ"},"opera/cav-easter":{"c":"マスカーニ","w":"『カヴァレリア・ルスティカーナ』","p":"復活祭の合唱「主はよみがえりたまえり」","pt":"復活祭の朝、教会から聞こえる祈りに合わせて、村人たちが広場で歌う合唱です。はじめはオルガンと静かな祈りの声で、厳かな空気に包まれます。そこへ苦しい恋に悩むサントゥッツァの声が加わり、合唱とともにどんどん大きくふくらんでいきます。最後は全員の声が空に向かってわき上がる、胸がいっぱいになるクライマックスです。","len":"6:42","g":"オペラ"},"opera/cav-int":{"c":"マスカーニ","w":"『カヴァレリア・ルスティカーナ』","p":"間奏曲","pt":"激しい悲劇が起こる直前に流れる、静かで美しい間奏曲です。弦楽器が祈るような旋律をやさしく歌い、オルガンの響きがその下で静かに支えます。旋律はゆるやかにふくらんで一度だけ大きく高まり、また穏やかに落ち着いていきます。嵐の前のつかのまの安らぎで、このあと何が起きるかを知って聴くと、その美しさがいっそう切なく感じられます。","len":"3:28","g":"オペラ"},"opera/cav-voilo":{"c":"マスカーニ","w":"『カヴァレリア・ルスティカーナ』","p":"「ママも知るとおり」","pt":"サントゥッツァが、恋人トゥリッドゥの母に、彼に裏切られたことを打ち明ける歌です。はじめは事情を静かに語り出しますが、思い出すうちに声がだんだん震え、高まっていきます。捨てられた悔しさと、それでも消えない愛が、激しい叫びとなってあふれ出します。心の傷をさらけ出す、痛いほどまっすぐな歌です。","len":"3:46","g":"オペラ"},"opera/chefaro":{"c":"グルック","w":"『オルフェオとエウリディーチェ』","p":"「エウリディーチェを失って」","pt":"妻エウリディーチェを二度失ったオルフェオが、亡きがらを前に嘆く歌です。でも旋律は、意外なほど明るい長調で、静かに流れていきます。何度も「エウリディーチェ」と名前を呼びかける声に、胸がしめつけられます。明るい旋律だからこそ、悲しみがいっそう透明に、深く伝わってくる、ふしぎな歌です。","len":"4:41","g":"オペラ"},"opera/chenier":{"c":"ジョルダーノ","w":"『アンドレア・シェニエ』","p":"「亡くなった母を」","pt":"フランス革命で家を焼かれ、母を失った娘マッダレーナの告白です。チェロのしみじみとした旋律に導かれ、彼女は悲しい夜の出来事を静かに語りはじめます。どん底の中で「私は愛」という声が聞こえたところから音楽は光を帯び、少しずつ大きく高まっていきます。絶望から生きる力へと変わっていく、魂がふるえるような歌です。","len":"4:44","g":"オペラ"},"opera/cosi-aura":{"c":"モーツァルト","w":"『コジ・ファン・トゥッテ』","p":"「いとしい人の愛の息吹は」（第1幕）","pt":"フェルランドが、恋人の愛の息吹があれば心は満たされる、とうっとり歌います。弦と木管のやわらかな響きに包まれて、テノールの声がゆっくりと、とろけるように流れていきます。大きく盛り上がるのではなく、甘い吐息がふくらんではしぼむような歌で、夢見心地の幸福感があります。静かな部屋で、目を閉じて聴きたいアリアです。","len":"5:27","g":"オペラ"},"opera/cosi-scoglio":{"c":"モーツァルト","w":"『コジ・ファン・トゥッテ』","p":"「岩のように動かず」（第1幕）","pt":"姉フィオルディリージが、言い寄る男たちをきっぱり退けます。はじめは堂々とした宣言のような歌い出しで、「私の心は岩のように動かない」と胸を張ります。声は大きく上下し、気高さとともに、どこか大げさで力みすぎた感じも伝わってきます。最後は速くなり、勢いよく言い切って締めくくります。その強がりの裏にある揺れも感じてみてください。","len":"4:35","g":"オペラ"},"opera/cosi-soave":{"c":"モーツァルト","w":"『コジ・ファン・トゥッテ』","p":"「風よ、穏やかに」（第1幕）","pt":"恋人たちを乗せた船が港を離れていきます。弦楽器がさざ波のようにやわらかく揺れ、その上に姉妹と老哲学者の3人の声が静かに重なります。「風よ、穏やかに、波よ、静かに」という祈りは、海面に光がきらめくような透きとおった美しさ。短い曲ですが、ゆっくり遠ざかる船を見送るように、最後の響きが消えるまで耳をすませてください。","len":"3:12","g":"オペラ"},"opera/dalila":{"c":"サン＝サーンス","w":"『サムソンとデリラ』","p":"「あなたの声に心は開く」","pt":"デリラが、怪力の英雄サムソンを誘惑する、甘く官能的なメゾソプラノのアリアです。深くやわらかな声で、相手の心にしみこむようにささやきかけます。くり返しの部分ではサムソンも思わず声を重ね、2人の想いがひとつになるように高まっていきます。うっとりするほど美しい旋律の裏に、罠が隠されていると思って聴くと、背筋がぞくりとします。","len":"6:41","g":"オペラ"},"opera/dg-batti":{"c":"モーツァルト","w":"『ドン・ジョヴァンニ』","p":"「ぶってよ、マゼット」（第1幕）","pt":"すねた婚約者マゼットに、ツェルリーナが「ぶってもいいのよ」と甘えるように歌いかけます。前半はゆっくりやわらかく、なだめるような声に、思わず許してしまいそうな愛らしさがあります。後半は軽やかに揺れるリズムに変わり、「仲直りしましょう」と晴れやかに弾みます。けんかのあとの、照れくさくてうれしい空気が伝わってきます。","len":"5:27","g":"オペラ"},"opera/dg-catalog":{"c":"モーツァルト","w":"『ドン・ジョヴァンニ』","p":"「カタログの歌」（第1幕）","pt":"召使いレポレッロが、捨てられたドンナ・エルヴィーラに分厚い帳面を広げて見せます。前半は軽快で、主人の恋の相手を国ごとに数え上げる早口がおかしくて仕方ありません。後半はゆったりした踊りのリズムに変わり、金髪の人、小柄な人…と好みを並べ立てます。笑いの中に、聞かされる側の傷つく心がちらりと見えるのも、この歌の深さです。","len":"6:26","g":"オペラ"},"opera/dg-champagne":{"c":"モーツァルト","w":"『ドン・ジョヴァンニ』","p":"「シャンパンの歌」（第1幕）","pt":"ジョヴァンニが「宴会だ、みんなを呼べ、踊らせろ」と命じる歌。最初から最後まで猛烈な速さで、オーケストラも声も、息つく間もなく駆け抜けます。わずか1分半ほどの間に、彼のあふれる欲望と、止まることを知らない生き方がぎゅっと詰めこまれています。聴き終わると、嵐が通り過ぎたように少し呆然とするはずです。","len":"1:39","g":"オペラ"},"opera/dg-finestra":{"c":"モーツァルト","w":"『ドン・ジョヴァンニ』","p":"「窓辺においで」（第2幕）","pt":"夜、窓の下で、ジョヴァンニがマンドリンの伴奏で甘い恋の歌を歌います。ぽろんぽろんとはじかれる小さな音色が、月明かりの静かな通りを思わせます。声はささやくようにやさしく、短い旋律が2回くり返されるだけの、とても素朴な歌。その甘さが本物かどうか、口のうまい男の歌として聴くと、いっそう味わいがあります。","len":"2:37","g":"オペラ"},"opera/dg-ov":{"c":"モーツァルト","w":"『ドン・ジョヴァンニ』","p":"序曲","pt":"いきなり重く暗い和音が鳴りひびき、石像が現れる場面の恐ろしさを先に聞かせます。低い音がうごめき、音階が上ったり下ったりして、不吉な影がじわじわ迫ってくるよう。やがて霧が晴れるように明るく速い音楽に変わり、主人公の軽やかで大胆な性格が駆けだします。闇と光、その2つの顔を聴きくらべてください。","len":"7:11","g":"オペラ"},"opera/dg-tesoro":{"c":"モーツァルト","w":"『ドン・ジョヴァンニ』","p":"「私の恋人を」（第2幕）","pt":"オッターヴィオが「私の恋人をなぐさめに行ってくれ」と願うアリアです。ゆったりした伴奏の上で、テノールの声がなめらかに、息長くのびていきます。細かく音を転がしながら長いフレーズを歌いきるところは、張りつめた糸のような美しさで、聴いているこちらも思わず息を止めてしまいます。誠実でまっすぐな人柄が、そのまま声になったような歌です。","len":"4:14","g":"オペラ"},"opera/dido":{"c":"パーセル","w":"『ディドとエネアス』","p":"ディドの嘆き「私が土に横たえられたとき」","pt":"女王ディドが、愛する人に去られ、死を前に歌う嘆きの歌です。低音が半音ずつゆっくり下がっていく、重い足取りのような型が何度もくり返されます。その上で、ディドは静かに、気高く「私を忘れないで」と歌いかけます。悲しみを叫ぶのではなく、深く受け入れようとする姿に、胸が熱くなる歌です。","len":"4:43","g":"オペラ"},"opera/domingo-otello":{"c":"ヴェルディ","w":"『オテロ』","p":"「オテロの死」（ドミンゴ）","pt":"嫉妬のあまり妻デズデーモナを殺してしまったオテロが、真実を知ったあとに歌う最後の場面です。はじめは静かに、うちひしがれた声で、もう誰も恐れることはないとつぶやきます。横たわる妻に口づけしようとすると、第1幕の愛の場面の「口づけ」の旋律がオーケストラから再びよみがえります。愛と後悔が入りまじる、胸がしめつけられるような幕切れです。","len":"5:45","g":"オペラ"},"opera/dutch-ov":{"c":"ワーグナー","w":"『さまよえるオランダ人』","p":"序曲","pt":"嵐の海と、呪われて永遠にさまよう幽霊船を描く序曲です。いきなり弦が荒波のようにざわめき、ホルンが荒々しく呼びかけて、冷たい潮風が吹きつけてきます。嵐がおさまると、木管がやさしく救いを思わせる旋律を歌い、ひとときの光がさしこみます。荒れ狂う海と救いの祈りが何度もぶつかり合い、最後は明るい響きで締めくくられます。","len":"11:34","g":"オペラ"},"opera/elektra":{"c":"R.シュトラウス","w":"『エレクトラ』","p":"エレクトラの登場のモノローグ「ひとりぼっち」","pt":"父を殺した母への復讐を誓うエレクトラが、ひとりで父の名を呼ぶ独白です。冒頭からオーケストラが父の名を叫ぶような激しい響きを鳴らし、ただならぬ空気に包まれます。エレクトラは亡き父を思い出し、殺された夜の情景を語り、復讐の日を思い描いていきます。最後はその日の勝利の踊りを夢見て、声がしだいに高揚していく、すさまじい迫力の場面です。","len":"9:29","g":"オペラ"},"opera/elisir":{"c":"ドニゼッティ","w":"『愛の妙薬』","p":"「人知れぬ涙」（第2幕）","pt":"喜劇の中で、ここだけ時間がゆっくり流れます。もの悲しい前奏のあと、ハープの静かな伴奏にのって、ネモリーノが「彼女の目に、ひそかな涙が光った」と歌いだします。短調（暗い響き）で始まった旋律が、「彼女は僕を愛している」と気づくところで明るく変わる瞬間がいちばんの聴きどころ。驚きと喜びが胸いっぱいに広がっていきます。","len":"4:10","g":"オペラ"},"opera/falstaff":{"c":"ヴェルディ","w":"『ファルスタッフ』","p":"終幕のフーガ「世の中すべて冗談」","pt":"騒動が終わり、全員が「世の中すべて冗談、人はみな道化」と歌いだします。まずファルスタッフが歌い出し、そのあとを1人ずつ、同じ旋律で追いかけるように加わっていきます（これを「フーガ」といいます）。声がどんどん重なって、にぎやかに渦を巻くように盛り上がり、最後は大きな笑いで締めくくられます。人生を笑いとばす、明るく温かい幕切れです。","len":"2:58","g":"オペラ"},"opera/faust-jewel":{"c":"グノー","w":"『ファウスト』","p":"「宝石の歌」","pt":"田舎娘マルグリートが、贈られた宝石を身につけて鏡に映る自分を見る場面です。はじめはおどろきとためらいがありますが、やがて「まるでお姫様みたい」と、はずむようなワルツに変わっていきます。声が細かく転がるように動く「装飾」がちりばめられ、うれしさで胸がいっぱいになる様子が伝わります。きらきらとした喜びの裏に、このあとの悲劇の影がひそんでいる歌です。","len":"5:07","g":"オペラ"},"opera/fidelio-ov":{"c":"ベートーヴェン","w":"『フィデリオ』","p":"序曲","pt":"ベートーヴェンらしい、明るく力強い序曲です。冒頭で力強い呼びかけがあると、すぐにゆっくりとした静かな部分に変わり、この2つが交互にあらわれます。やがて音楽は勢いよく走りだし、ホルンなどの響きが加わって、晴れやかな気分が広がります。希望に向かってまっすぐ進んでいくような、胸のすく高揚感で締めくくられます。","len":"6:48","g":"オペラ"},"opera/fig-ballare":{"c":"モーツァルト","w":"『フィガロの結婚』","p":"「もし伯爵様が踊りたいなら」（第1幕）","pt":"伯爵のたくらみを知ったフィガロが、ひとりで「受けて立つ」と歌いだします。はじめは上品な踊りのリズムで、弦をはじく音がギターのようにつまびかれ、うやうやしい顔の下に怒りを隠しています。途中で急に速くなり、こらえていた本音が一気にあふれ出すところが聴きどころ。最後はまた静かな踊りに戻り、不敵な笑みが目に浮かびます。","len":"2:42","g":"オペラ"},"opera/fig-deh":{"c":"モーツァルト","w":"『フィガロの結婚』","p":"「恋人よ、早くここへ」（第4幕）","pt":"夜の庭で、スザンナが「恋人よ、早くここへ」と歌います。弦をはじく静かな伴奏に、木管楽器がやさしくこだまして、月明かりと花の香りが漂ってくるようです。ゆったり揺れるリズムに乗って、声は甘く、ひそやかに夜の空気へ溶けていきます。隠れて聞くフィガロの気持ちを思いながら聴くと、ほほえましさと切なさがまじります。","len":"4:39","g":"オペラ"},"opera/fig-dove":{"c":"モーツァルト","w":"『フィガロの結婚』","p":"「楽しい思い出はどこへ」（第3幕）","pt":"伯爵夫人がひとり、幸せだった日々を思い出します。ゆっくりした前半は、遠い記憶をたどるような静かな旋律で、「あの楽しい時はどこへ」と問いかける声に胸がしめつけられます。やがて「夫の心を取り戻そう」と決意すると、音楽は速く明るくなり、悲しみの底から希望が立ち上がります。沈んだ心が顔を上げる、その変わり目を待ってください。","len":"4:46","g":"オペラ"},"opera/fig-fin2":{"c":"モーツァルト","w":"『フィガロの結婚』","p":"第2幕フィナーレ","pt":"はじめは伯爵と夫人の2人だけの、とげとげしいやりとりから始まります。そこへスザンナ、フィガロ、庭師…と次々に人が飛びこんできて、そのたびに音楽の速さや色が変わり、話はどんどんこじれていきます。約20分、切れ目なく続く中で声の数が増えていく様子は、雪だるまが坂を転がるよう。最後は7人が入り乱れ、息もつかせぬ速さで幕が下ります。","len":"21:14","g":"オペラ"},"opera/fig-letter":{"c":"モーツァルト","w":"『フィガロの結婚』","p":"「手紙の二重唱」（第3幕）","pt":"伯爵夫人が手紙の文句を口で言い、スザンナがそれを書きとりながらくり返します。オーボエやファゴットがやさしく合いの手を入れ、ふたりの声がそよ風のようにやわらかく重なっていきます。たくらみの場面なのに、音楽はどこまでも澄んでいて、空気がふわりと浮かぶよう。最後にふたりの声が寄りそって溶けあうところは、時間が止まったように感じられます。","len":"3:26","g":"オペラ"},"opera/fig-nonso":{"c":"モーツァルト","w":"『フィガロの結婚』","p":"「自分で自分がわからない」（第1幕）","pt":"少年ケルビーノが、胸のどきどきをそのまま音にしたような早口で歌いだします。弦がせわしなくざわめき、息つく暇もなく「女の人を見ると、話すだけで心がふるえる」と言葉があふれます。最後に急にゆっくりになり、聞いてくれる人がいなければ自分に恋を語る、とつぶやくところは、思春期のせつなさがふっとにじむ瞬間です。","len":"3:04","g":"オペラ"},"opera/fig-ov":{"c":"モーツァルト","w":"『フィガロの結婚』","p":"序曲","pt":"せわしなく駆けだす明るい曲で、「1日の大騒動」の始まりです。弦がひそひそと、小走りするように細かい音を刻んで始まり、いきなりオーケストラ全体がわっと明るく鳴りひびきます。登場人物たちがあわただしく走りまわる様子が目に浮かぶようです。息をつく暇もなく、楽しいはずみのまま、勢いよく終わります。","len":"4:39","g":"オペラ"},"opera/fig-perdono":{"c":"モーツァルト","w":"『フィガロの結婚』","p":"「奥様、許してくれ」（終幕）","pt":"大騒ぎの1日の終わり、伯爵がひざまずいて「奥様、許してくれ」と歌います。ひと呼吸おいて、夫人が静かに、やさしく許しの言葉を返す瞬間は、すべてが止まったような静けさ。そこへ全員の声がそっと加わり、祈りのような和音が広がっていきます。そのあと音楽は一気に明るく速くなり、にぎやかなお祝いで幕となります。","len":"3:42","g":"オペラ"},"opera/fig-porgi":{"c":"モーツァルト","w":"『フィガロの結婚』","p":"「愛の神よ、照覧あれ」（第2幕）","pt":"幕が開くと、伯爵夫人がひとり部屋にいます。木管楽器がやわらかく歌う長い前奏が、夫人のさびしい心をそっと包みこむようです。ゆっくりと静かに「愛の神よ、夫の心を返して」と願う声は、取り乱さず、気品を失わないところがかえって切なく響きます。大声を出さない悲しみに耳をすませてください。","len":"3:51","g":"オペラ"},"opera/fig-voiche":{"c":"モーツァルト","w":"『フィガロの結婚』","p":"「恋とはどんなものかしら」（第2幕）","pt":"ケルビーノが伯爵夫人の前で、自作の恋の歌を少し照れながら披露します。弦をはじく軽やかな伴奏に乗って、素直でやさしい旋律がゆっくり流れ、木管楽器がそっと合いの手を入れます。途中で調子がゆらいで心が迷うように揺れ、また最初の旋律に戻るところが愛らしい。初恋の甘さと、まだ言葉にならない思いが詰まった歌です。","len":"2:50","g":"オペラ"},"opera/fledermaus":{"c":"J.シュトラウス2世","w":"『こうもり』","p":"序曲","pt":"ワルツやポルカなど、オペレッタの中の楽しい旋律が次々に出てくる、華やかな序曲です。はじめは勢いよく始まり、すぐに軽やかで楽しい気分に包まれます。途中で、ゆったりとした優雅なワルツが流れ出すと、ウィーンの舞踏会にまぎれこんだような気分になります。最後は速く、にぎやかに駆け抜け、笑顔で幕が開くのを待つような高揚感に満ちています。","len":"8:39","g":"オペラ"},"opera/forza-ov":{"c":"ヴェルディ","w":"『運命の力』","p":"序曲","pt":"金管楽器の重く鋭い3つの音が、運命の扉をたたくように鳴りひびきます。続いて弦楽器が、不安げにせきたてるような旋律を奏で、逃れられない運命が追いかけてくるよう。途中には、祈りのような美しい旋律も現れ、悲しみと希望がまじりあいます。めまぐるしく表情を変えながら、最後は力強く盛り上がって終わります。","len":"7:21","g":"オペラ"},"opera/forza-pace":{"c":"ヴェルディ","w":"『運命の力』","p":"「神よ、平和を与えたまえ」（第4幕）","pt":"修道院の近くの洞くつで、隠れ住むレオノーラが「神よ、平和を」と祈ります。はじめの「平和を」という言葉が、高く長くのびる声で静かに歌われ、その一声だけで空気が澄みわたります。苦しい胸の内を訴えるうちに感情が高まり、最後は激しい叫びで締めくくられます。静かな祈りから嵐のような叫びへ、その振れ幅を味わってください。","len":"6:23","g":"オペラ"},"opera/freischutz":{"c":"ウェーバー","w":"『魔弾の射手』","p":"狩人の合唱","pt":"ホルンが勇ましく鳴りひびく、狩人たちの明るい合唱です。男声合唱が元気よく、狩りの喜びを胸を張って歌います。「ヨーホー」というかけ声のような部分では、森に声がこだまするような楽しさがあります。ドイツの深い森と、そこで生きる人々の素朴な誇りが感じられる、すがすがしい歌です。","len":"2:28","g":"オペラ"},"opera/grimes":{"c":"ブリテン","w":"『ピーター・グライムズ』","p":"4つの海の間奏曲より「夜明け」","pt":"北海の夜明けを描く間奏曲です。高いヴァイオリンとフルートが、細く冷たい一本の線のような旋律を奏で、凍える空気と光がさしこむ情景が浮かびます。その下で、波がゆれるような響きと、低い金管の重い和音が、海のうねりのように静かに押し寄せます。冷たく澄んだ美しさの中に、どこか不安な気配がただよう音楽です。","len":"3:42","g":"オペラ"},"opera/hansel":{"c":"フンパーディンク","w":"『ヘンゼルとグレーテル』","p":"夕べの祈り","pt":"森で迷った兄妹ヘンゼルとグレーテルが、眠る前に「14人の天使が守ってくれますように」と祈る歌です。2人の声がやさしく寄りそい、子守歌のような素朴で清らかな旋律を歌います。祈りが終わると、オーケストラがその旋律を引き継ぎ、大きくあたたかく包みこむように広がっていきます。暗い森の中で、ふっと心が安らぐような、やさしい光に満ちた音楽です。","len":"2:45","g":"オペラ"},"opera/hoffmann-barc":{"c":"オッフェンバック","w":"『ホフマン物語』","p":"舟歌","pt":"ヴェネツィアの夜、ゴンドラにゆられて2人の女声が歌う二重唱です。ゆったりとゆれる波のようなリズムが、水面にゆらめく灯りの情景を思い浮かばせます。2つの声がやさしく寄りそい、からみ合いながら、ため息のような旋律を歌います。甘く、夢見るような、どこか物憂い夜の空気に身をまかせてください。","len":"3:38","g":"オペラ"},"opera/hoffmann-doll":{"c":"オッフェンバック","w":"『ホフマン物語』","p":"「オランピアの人形の歌」","pt":"機械じかけの人形オランピアが、客の前で歌を披露する場面です。かわいらしい旋律の中で、声がきらきらと細かく転がり、とても高い音まで駆けのぼります。途中でぜんまいが切れると歌がだんだん遅く弱くなって止まり、巻き直されるとまた元気よく歌い出します。超絶技巧と、人形らしいおかしみのどちらにも目と耳をこらしてください。","len":"7:57","g":"オペラ"},"opera/igor":{"c":"ボロディン","w":"『イーゴリ公』","p":"だったん人の娘たちの踊りと合唱","pt":"捕らわれの地で、異国の娘たちが歌い踊る場面です。はじめは女声合唱が、遠いふるさとを想うような、甘く物悲しい旋律を歌います。やがて音楽は速く激しくなり、力強い男たちの踊りや、跳ねるようなリズムが次々にあらわれます。夢のような旋律から熱狂的な踊りへと移っていく、色とりどりの絵巻のような音楽です。","len":"13:44","g":"オペラ"},"opera/jenufa":{"c":"ヤナーチェク","w":"『イェヌーファ』","p":"イェヌーファの祈り（第2幕）","pt":"赤ん坊を失ったことを知らないイェヌーファが、聖母マリアに祈る場面です。オーケストラは静かに、そっと彼女に寄りそいます。歌は素朴で、まっすぐで、子どもを思う母のやさしさがそのまま声になっています。その純粋な祈りを、真実を知っている観客として聴くと、胸がしめつけられるような悲しさがこみ上げてきます。","len":"7:49","g":"オペラ"},"opera/lakme":{"c":"ドリーブ","w":"『ラクメ』","p":"「花の二重唱」","pt":"インドの巫女ラクメと侍女が、花をつみに川へ向かいながら歌う二重唱です。2つの女声がゆったりと寄りそい、ほんの少し高さをずらして重なりながら、ゆらゆらと流れていきます。水面に光がきらめき、花の香りがただようような、うっとりする情景が目に浮かびます。時間がゆっくり流れていくような、やさしい美しさを味わってください。","len":"4:38","g":"オペラ"},"opera/lascia":{"c":"ヘンデル","w":"『リナルド』","p":"「私を泣かせてください」","pt":"とらわれの姫が、自由を願って静かに歌うアリアです。ゆったりとした歩みの中で、「私を泣かせてください」と、悲しみをそっと打ち明けます。中ほどで少し気持ちが高ぶったあと、最初の旋律がもう一度戻ってきます。このとき歌手は、自分で飾りの音を加えて歌うことが多く、悲しみがいっそう深く胸にしみこみます。","len":"5:34","g":"オペラ"},"opera/loh-act3":{"c":"ワーグナー","w":"『ローエングリン』","p":"第3幕への前奏曲","pt":"婚礼の祝いを描く、にぎやかで勢いのある前奏曲です。始まったとたん、弦がはじけるように駆けだし、金管が高らかに鳴りひびいて、祝宴の熱気が一気に広がります。途中で木管がやわらかく歌う、少し落ち着いた部分がはさまれます。そしてまた華やかな音楽が戻り、輝くような高揚の中で駆け抜けていきます。","len":"3:30","g":"オペラ"},"opera/loh-bridal":{"c":"ワーグナー","w":"『ローエングリン』","p":"「婚礼の合唱」（第3幕）","pt":"花嫁が入場するときにおなじみの「タンタカターン」の合唱です。実際に聴くと、思ったより静かでやわらかく、祝福の気持ちをそっと手渡すような響きです。合唱の声がやさしく重なり、ろうそくの灯りの中を花嫁が進んでいく情景が浮かびます。幸せに満ちた響きの中に、どこか夢のようなはかなさも感じられます。","len":"6:30","g":"オペラ"},"opera/lucia":{"c":"ドニゼッティ","w":"『ランメルモールのルチア』","p":"「狂乱の場」（第3幕）","pt":"結婚式の夜、正気を失ったルチアが、血に染まった姿で人々の前に現れます。かつて恋人と交わした愛の旋律が、遠い記憶のようにオーケストラから聞こえてきます。ルチアの声と楽器が、こだまのように追いかけあいながら、細かい音で舞い上がっていく場面は、美しいのに背筋が寒くなるほど。夢と狂気の境目をさまよう声に耳をすませてください。","len":"13:41","g":"オペラ"},"opera/macbeth":{"c":"ヴェルディ","w":"『マクベス』","p":"マクベス夫人の夢遊の場（第4幕）","pt":"真夜中、眠ったままのマクベス夫人がろうそくを手に現れ、医者と侍女が息をひそめて見守ります。弱音器（音を弱める道具）をつけた弦楽器が、すすり泣くような音型をくり返し、不気味で重い空気をつくります。夫人は「この手の血が落ちない」と、とぎれとぎれにつぶやきます。最後は消え入りそうな高い声で去っていき、背筋がひやりとします。","len":"11:18","g":"オペラ"},"opera/manon-adieu":{"c":"マスネ","w":"『マノン』","p":"「さようなら、小さなテーブル」","pt":"マノンが、恋人と暮らした小さな部屋のテーブルに別れを告げる歌です。ぜいたくな暮らしを選んで去ろうとする彼女は、大きな声を張り上げず、ささやくように歌います。2人で囲んだ食卓の思い出がよみがえり、声の中にためらいと後悔がにじみます。華やかさのかげにある、ひとりの女性の弱さと切なさが伝わる、しっとりとした歌です。","len":"3:31","g":"オペラ"},"opera/manon-int":{"c":"プッチーニ","w":"『マノン・レスコー』","p":"間奏曲（第3幕の前）","pt":"捕らえられたマノンと、それでも彼女を追い続けるデ・グリューの心を、オーケストラだけで描く間奏曲です。はじめは低く沈んだ、ひとりごとのような寂しい調べで始まります。やがて弦楽器が熱く歌いはじめ、抑えきれない恋の苦しさが大きなうねりとなって押し寄せます。言葉がないからこそ、胸を締めつける切なさがまっすぐ伝わってきます。","len":"5:51","g":"オペラ"},"opera/mb-addio":{"c":"プッチーニ","w":"『蝶々夫人』","p":"「さらば、愛の家よ」（第2幕・第3幕）","pt":"蝶々さんの家に戻ったピンカートンが、自分のしたことの重さにようやく気づきます。「さらば、花にあふれた愛の家よ」と、悔やみと恥ずかしさをこめて歌う声は、苦しげで熱い。短い歌ですが、もう取り返しがつかないという痛みがにじみます。蝶々さんに会えず逃げるように去っていく、その弱さも感じてください。","len":"1:58","g":"オペラ"},"opera/mb-dovunque":{"c":"プッチーニ","w":"『蝶々夫人』","p":"「世界中どこでも」（第1幕）","pt":"アメリカの海軍士官ピンカートンが、領事シャープレスに「ヤンキーはどこへ行っても楽しむ」と、得意げに語ります。明るく軽快で、自信たっぷりの歌い方に、彼の気楽さと身勝手さがにじみます。シャープレスが心配そうにたしなめても、どこ吹く風。このあと起こる悲劇を思うと、この陽気さがかえって胸に刺さります。","len":"2:59","g":"オペラ"},"opera/mb-humming":{"c":"プッチーニ","w":"『蝶々夫人』","p":"ハミング・コーラス（第2幕）","pt":"夫を待って、蝶々さんが子どもとスズキと一緒に、夜通し窓辺に座っています。歌詞のないハミングの合唱が、遠くから静かに聞こえてきて、夜の空気がしんと澄んでいきます。何も起こらない、ただ時間だけが流れていく静けさ。希望を抱いて待ち続ける姿を思うと、そのやさしい響きがかえって切なく胸にしみます。","len":"3:01","g":"オペラ"},"opera/mb-love":{"c":"プッチーニ","w":"『蝶々夫人』","p":"愛の二重唱（第1幕の最後）","pt":"夜がしずかに降りてきて、白い花嫁衣装の蝶々さんとピンカートンが2人きりになります。はじめは恥じらうように、ゆっくりやさしく声をかわし、満天の星を見上げます。気持ちが高まるにつれて音楽はどんどん熱を帯び、最後は2人の声とオーケストラが大きく燃えあがります。美しさの中に、どこか不安な影がひそむのも感じてください。","len":"6:05","g":"オペラ"},"opera/mb-tutu":{"c":"プッチーニ","w":"『蝶々夫人』","p":"「かわいい坊や」（最後の場面）","pt":"蝶々さんが、幼い息子を抱きしめて最後の別れを告げます。「かわいい坊や、ママの顔をよく見て覚えておいて」と、愛しさと悲しみがはちきれそうな声で歌います。オーケストラも激しく高まり、声は叫ぶように強く、そして震えます。最後に彼女が決意を果たすと、オーケストラが重く鳴りひびいて幕となります。","len":"5:35","g":"オペラ"},"opera/mb-unbel":{"c":"プッチーニ","w":"『蝶々夫人』","p":"「ある晴れた日に」（第2幕）","pt":"蝶々さんが、女中スズキに夫が帰ってくる日を語って聞かせます。静かに「ある晴れた日に、水平線に煙が見えて」と語りはじめ、船が港に入り、彼が丘を登ってくる様子を、目の前の出来事のように思い描きます。思いがあふれて声はどんどん高まり、最後は「私は待つ」と力強く歌い上げます。信じる心の強さと切なさに胸が熱くなります。","len":"4:44","g":"オペラ"},"opera/meis-prel":{"c":"ワーグナー","w":"『ニュルンベルクのマイスタージンガー』","p":"第1幕への前奏曲","pt":"職人歌人たちの堂々とした行進で始まる前奏曲です。冒頭からオーケストラ全体が胸を張るように鳴りひびき、晴れやかな祭りの空気に包まれます。途中では、若者の恋を思わせる甘い旋律や、軽やかでおどけた場面が次々にあらわれます。最後はすべてが大きな流れにまとまり、誇らしい高揚の中で力強く終わります。","len":"10:29","g":"オペラ"},"opera/merrywidow":{"c":"レハール","w":"『メリー・ウィドウ』","p":"「ヴィリアの歌」","pt":"未亡人ハンナが、森の妖精ヴィリアの民謡を歌って聞かせる場面です。はじめは語り聞かせるように、ふるさとの昔話をしみじみと歌います。「ヴィリア、ああヴィリア」と呼びかける甘い旋律では、合唱がそっと応え、なつかしさと恋しさが広がっていきます。遠いふるさとの森を想うような、やさしく少しさびしい歌です。","len":"6:36","g":"オペラ"},"opera/mf-ach":{"c":"モーツァルト","w":"『魔笛』","p":"「ああ、私にはわかる」（第2幕）","pt":"恋人タミーノに口をきいてもらえず、パミーナが「愛は消えてしまった」と悲しみます。伴奏はとても控えめで、ため息のような弦の音の上に、細く澄んだ声がぽつりぽつりと落ちていきます。高い音へ上るたびに、こらえていた涙があふれそうになるよう。最後は声が消えたあと、オーケストラだけが静かに余韻を残して終わります。","len":"4:01","g":"オペラ"},"opera/mf-bildnis":{"c":"モーツァルト","w":"『魔笛』","p":"「なんと美しい絵姿」（第1幕）","pt":"王子タミーノが、パミーナの肖像画を見つめて歌いだします。長い前置きはなく、いきなり「なんと美しい絵姿」と、心をつかまれたままの声で始まります。胸の高鳴りに戸惑い、言葉をさがすようにためらいながら、だんだん思いが確かになっていく流れが聴きどころ。最後は「彼女を自分のものに」と晴れやかに決意し、恋の始まりのときめきがあふれます。","len":"4:04","g":"オペラ"},"opera/mf-hallen":{"c":"モーツァルト","w":"『魔笛』","p":"「この聖なる殿堂には」（第2幕）","pt":"ザラストロが「この聖なる殿堂には、復讐はない」と、深く落ち着いた低い声で歌います。伴奏は静かでやさしく、ゆっくり穏やかな旋律が、大きな手でそっと包みこむように進みます。声がずっと下の低い音まで沈んでいくところは、大地の底から響くような安らぎ。怒りや争いがすっと引いていく、心がしずまる歌です。","len":"3:54","g":"オペラ"},"opera/mf-papagena":{"c":"モーツァルト","w":"『魔笛』","p":"「恋人か女房がいればいい」（第2幕）","pt":"パパゲーノが「恋人か女房がほしいなあ」と、魔法の鈴（グロッケンシュピール）を鳴らしながら歌います。キラキラした鈴の音が、歌の合間に楽しく鳴りひびき、旋律は素朴でのんき。同じ節が何度かくり返されるうちに、歌い方がだんだん切実になっていくのがおかしくて、少しいじらしい。気楽に笑って聴いてほしい一曲です。","len":"4:48","g":"オペラ"},"opera/mf-queen":{"c":"モーツァルト","w":"『魔笛』","p":"夜の女王のアリア「復讐の心は」（第2幕）","pt":"怒りに燃える夜の女王が、娘に「あいつを殺せ」と迫ります。オーケストラが激しく打ちつける中、声は鋭く高く跳ね上がり、とがった短い音が氷の粒のように連打されます。人間の声とは思えない高さで、怒りが噴き上がるようです。美しさと恐ろしさが同じ一瞬に同居する、その張りつめた空気に身をまかせてください。","len":"3:01","g":"オペラ"},"opera/mf-vogel":{"c":"モーツァルト","w":"『魔笛』","p":"「おいらは鳥刺し」（第1幕）","pt":"鳥刺しパパゲーノが、パンフルートを「ピロロロ」と吹きながら陽気に登場します。素朴で覚えやすい旋律が何度かくり返され、民謡のような親しみやすさで、聴くとすぐ口ずさみたくなります。歌の合間に入る笛の音が、森の小鳥を呼ぶ合図のようでかわいらしい。むずかしいことは考えず、楽しそうなお兄さんの自己紹介として味わってください。","len":"2:52","g":"オペラ"},"opera/mf-zittre":{"c":"モーツァルト","w":"『魔笛』","p":"「恐れなくてよい、若者よ」（第1幕）","pt":"雷鳴のような激しい響きとともに、夜の女王が姿を現します。まずは堂々と若者に語りかけ、続くゆっくりした部分では、さらわれた娘を思う母として、悲しげにしっとりと歌います。そして後半、テンポが上がると「娘を救って」と力強く命じ、高い音を細かく転がす華やかな技巧が花開きます。悲しみから威厳への変わり目を味わってください。","len":"4:57","g":"オペラ"},"opera/nabucco":{"c":"ヴェルディ","w":"『ナブッコ』","p":"合唱「行け、わが想いよ」（第3幕）","pt":"とらわれのヘブライ人たちが、遠い故郷を思って歌います。静かな前奏のあと、合唱がみんなで同じ旋律をそろえて、ささやくように歌いはじめます。望郷の思いがだんだんふくらみ、声が大きく広がっていくところでは、胸の奥がじんと熱くなります。派手さはないのに、大勢の祈りがひとつになる重みが、まっすぐ心に届く合唱です。","len":"5:07","g":"オペラ"},"opera/norma":{"c":"ベッリーニ","w":"『ノルマ』","p":"「清らかな女神よ」（第1幕）","pt":"月の光が差しこむ聖なる森で、巫女ノルマが月の女神に祈ります。フルートが、長く流れるような旋律を静かに歌いはじめ、それを受けついでノルマの声がゆっくりと空へのびていきます。息の長い旋律は、どこまでも途切れずに続く月の光のよう。やがて合唱が加わり、祈りが大きく広がっていきます。","len":"7:14","g":"オペラ"},"opera/orfeo-t":{"c":"モンテヴェルディ","w":"『オルフェオ』","p":"トッカータ（幕開け）","pt":"ラッパが鳴りわたる、現存する最初期のオペラの幕開けです。トランペットが、同じ旋律を何度もくり返し、高らかに鳴りひびきます。王さまの宮廷で「さあ、これから始まるよ」と知らせるような、はなやかでまばゆいファンファーレです。400年以上前の音楽とは思えない、胸がわくわくする響きを楽しんでください。","len":"1:41","g":"オペラ"},"opera/otello-credo":{"c":"ヴェルディ","w":"『オテロ』","p":"ヤーゴの「信条」（第2幕）","pt":"悪役ヤーゴが、ひとりになって本性を明かします。オーケストラがいきなり激しく、力強い音をたたきつけ、悪意がむき出しになります。「私は残酷な神を信じる」と、あざけるように、ときにささやくように歌い、最後は「死は無だ、天国など古いおとぎ話だ」と言い放って高笑い。背筋が冷えるような、悪の独白です。","len":"5:10","g":"オペラ"},"opera/otello-esultate":{"c":"ヴェルディ","w":"『オテロ』","p":"登場の第一声「喜べ！」（第1幕）","pt":"嵐の海の場面。オーケストラが荒れ狂う波と雷を描き、人々が船の無事を祈ります。そこへ戦いに勝った将軍オテロが船から降り立ち、「喜べ！」と力強く第一声をとどろかせます。わずか十数小節ですが、輝かしい声が嵐を切りさくように響き、群衆の歓声がそれに続きます。短い一瞬の、圧倒的な存在感を味わってください。","len":"1:06","g":"オペラ"},"opera/pag-vesti":{"c":"レオンカヴァッロ","w":"『道化師』","p":"「衣装をつけろ」","pt":"妻の浮気を知った道化師カニオが、それでも舞台に出なければならない苦しみを歌うアリアです。はじめは呆然とつぶやくような声で、心が追いつかない様子が伝わります。「笑え、道化師よ」と自分に言い聞かせるところで声は大きく張り上がり、やがてすすり泣きに変わります。歌い終わったあと、オーケストラが嘆きの旋律を引き取って、悲しみをもう一度ふくらませます。","len":"2:50","g":"オペラ"},"opera/parsifal":{"c":"ワーグナー","w":"『パルジファル』","p":"第1幕への前奏曲","pt":"聖杯の騎士団を思わせる、静かで神聖な響きの前奏曲です。はじめは伴奏のない旋律がゆっくりと流れ、まるで祈りのことばのように聞こえます。旋律がくり返されるたびに和音がそえられ、長い沈黙が教会の高い天井のような広がりを感じさせます。急がず、音と音のあいだの静けさまで味わうように聴いてください。","len":"14:18","g":"オペラ"},"opera/pavarotti-pira":{"c":"ヴェルディ","w":"『イル・トロヴァトーレ』","p":"「見よ、恐ろしい炎を」（パヴァロッティ）","pt":"主人公マンリーコが、恋人との結婚式を目前にしながら、母を救いに行くと決め、仲間を戦いに呼びかける勇ましい歌です。力強い行進のようなリズムにのって、テノールが燃えるような声で駆けだします。合唱が「武器をとれ」と加わり、熱気はどんどん高まります。最後の輝かしい高い音は、まさに「キング・オブ・ハイC」の真骨頂です。","len":"2:15","g":"オペラ"},"opera/pearl":{"c":"ビゼー","w":"『真珠採り』","p":"「聖なる神殿の奥で」（テノールとバリトンの二重唱）","pt":"昔同じ女性に恋をした2人の友が、再会して当時の思い出を語り合い、友情を誓う二重唱です。はじめは、フルートとハープのきらめくような響きの中、神殿で女神のような女性を見た日のことを静かに回想します。やがてテノールとバリトンの声が寄りそうように重なり、夢のように美しい旋律が広がっていきます。2人の男声がとけ合う、あたたかく切ない響きを味わってください。","len":"6:17","g":"オペラ"},"opera/queenspades":{"c":"チャイコフスキー","w":"『スペードの女王』","p":"リーザのアリア「もう真夜中」","pt":"真夜中の運河のほとりで、恋人ゲルマンを待つリーザのアリアです。夜の闇の中、彼女は「もうすぐ真夜中」と、不安と期待で胸をいっぱいにして歌いはじめます。彼を信じたい気持ちと、疑いの気持ちのあいだで心がゆれ、声が高まっていきます。暗い夜の冷たさと、ひとりの女性の切ない想いが伝わる歌です。","len":"3:54","g":"オペラ"},"opera/rig-caronome":{"c":"ヴェルディ","w":"『リゴレット』","p":"「慕わしい人の名は」（第1幕）","pt":"ジルダが、初めて恋した人の名前をそっと胸に抱いて歌います。木管楽器のやさしい前奏に導かれて、声は小鳥がさえずるように細かく、軽やかに舞います。名前を何度もくり返すうち、うれしさで胸がいっぱいになっていく様子が伝わってきます。最後は、ささやくように細かくふるえる声が、静かに夜へ消えていきます。","len":"6:34","g":"オペラ"},"opera/rig-cortigiani":{"c":"ヴェルディ","w":"『リゴレット』","p":"「悪魔め、鬼め」（第2幕）","pt":"娘をさらわれた道化リゴレットが、廷臣たちに「この悪魔め」と怒りをたたきつけます。オーケストラも荒れ狂い、声は激しくとどろきます。しかし誰も動かないと知ると、力が抜けたように泣きくずれ、低い弦楽器に寄りそわれながら「娘を返してくれ」と頼みこみます。怒りから哀願へ、父親の心がくずれていく変わり目に胸を打たれます。","len":"4:15","g":"オペラ"},"opera/rig-donna":{"c":"ヴェルディ","w":"『リゴレット』","p":"「女心の歌」（第3幕）","pt":"オーケストラが弾むような短い前奏をくり返し、それに乗って公爵が「女は気まぐれ、風に舞う羽のよう」と歌います。一度聴いたら忘れられない軽快な旋律で、何度も戻ってくるたびに口ずさみたくなります。最後は高い音でかっこよく決めます。陽気で明るい歌ほど、この悲劇の中では残酷に響く、その皮肉も感じてみてください。","len":"2:07","g":"オペラ"},"opera/rig-questa":{"c":"ヴェルディ","w":"『リゴレット』","p":"「あれかこれか」（第1幕）","pt":"幕が開いてすぐ、華やかな舞踏会の中で、公爵が「あの女でも、この女でも同じこと」と軽やかに歌います。弾むような明るいリズムで、深刻さはまるでなく、口笛でも吹くような気楽さ。その軽さこそが、この人物の危うさを物語っています。楽しい曲ですが、このあと起こる悲劇を思いながら聴くと、明るさが少し冷たく感じられます。","len":"2:21","g":"オペラ"},"opera/ring-forest":{"c":"ワーグナー","w":"『ジークフリート』","p":"森のささやき（第2幕）","pt":"森の中で、ジークフリートが木の下に寝そべり、小鳥の声に耳をすませる場面です。弦がさわさわと葉ずれのようにゆれ、木もれ日の中にいるような安らかな空気が広がります。そこへ木管が、小鳥のさえずりをかわいらしく歌います。会ったことのない母を思う少しさびしい気持ちと、森の明るさがやさしく溶け合う時間です。","len":"8:33","g":"オペラ"},"opera/ring-forge":{"c":"ワーグナー","w":"『ジークフリート』","p":"鍛冶の歌（第1幕）","pt":"若者ジークフリートが、折れた剣を自分の手で打ち直す場面です。ふいごで火をおこす音、そして金床をカンカンとたたく音がリズムになって、仕事場の熱気が伝わってきます。「ノートゥング！」と剣の名を呼ぶ力強い声が、何度もくり返されて高まっていきます。恐れを知らない若者のエネルギーがはじけるような、胸のすく場面です。","len":"7:38","g":"オペラ"},"opera/ring-funeral":{"c":"ワーグナー","w":"『神々の黄昏』","p":"ジークフリートの葬送行進曲","pt":"殺された英雄ジークフリートの遺体が、静かに運ばれていく場面です。ティンパニの重い一打と低い金管の響きが、ずしりと胸にのしかかります。その中で、これまでの物語に出てきた旋律が、思い出のように次々によみがえります。やがて彼の角笛の旋律が金管で巨大に鳴りひびく瞬間は、英雄の生涯への壮大な弔いの叫びのようです。","len":"8:19","g":"オペラ"},"opera/ring-immolation":{"c":"ワーグナー","w":"『神々の黄昏』","p":"ブリュンヒルデの自己犠牲（終幕）","pt":"ブリュンヒルデが、亡きジークフリートを想いながら炎に飛びこむ、物語の最後の場面です。長い独白は、静かな語りから、怒り、許し、そして大きな愛へと移っていきます。彼女が炎に身を投じると、オーケストラは燃え上がる炎とあふれるライン川を描き、神々の城が崩れ落ちていきます。すべてが燃え尽きたあと、静かな響きの中に幕が下りる、深い余韻の残る終わりです。","len":"14:25","g":"オペラ"},"opera/ring-rheingold":{"c":"ワーグナー","w":"『ラインの黄金』","p":"前奏曲","pt":"低い変ホの音がずっと鳴り続ける中から、ライン川の流れが生まれてくる前奏曲です。最初はコントラバスの深い響きだけで、水の底のような暗さと静けさがあります。そこへホルンが一本ずつ同じ形の旋律を重ね、やがて弦がゆれ動いて、流れがだんだん速く、明るくなっていきます。何もないところから世界が目覚めていく、壮大な夜明けのような音楽です。","len":"4:36","g":"オペラ"},"opera/ring-rhine":{"c":"ワーグナー","w":"『神々の黄昏』","p":"ジークフリートのラインの旅","pt":"英雄ジークフリートが、新たな冒険に出発する明るい管弦楽です。ホルンが彼の角笛の旋律をのびやかに吹き鳴らし、朝の空気の中へ若者が意気揚々と歩き出します。やがて音楽は大きく流れはじめ、ライン川を舟で下っていく情景が広がります。晴れやかで力に満ちた旅立ちの音楽を、ぜひ大きめの音で味わってください。","len":"10:16","g":"オペラ"},"opera/ring-ride":{"c":"ワーグナー","w":"『ワルキューレ』","p":"ワルキューレの騎行（第3幕）","pt":"戦乙女ワルキューレたちが、天馬にまたがって空を駆ける場面です。弦と木管が風を切るように駆け上がり、その上に金管が勇ましい旋律を高らかに鳴らします。やがて乙女たちの「ホヨトホー」という叫び声が加わり、空いっぱいに馬が駆けめぐるような熱気になります。体が自然に前のめりになるような、圧倒的な高揚感を味わってください。","len":"6:24","g":"オペラ"},"opera/ring-valhalla":{"c":"ワーグナー","w":"『ラインの黄金』","p":"神々のヴァルハラ入城","pt":"神々が虹の橋をわたって、新しい城ヴァルハラに入っていく場面です。雷神が雲を払う一撃のあと、ハープのきらめく響きの中に、空に架かる虹が浮かび上がります。金管が城の旋律を堂々と奏で、神々の誇りと威厳が大きく広がっていきます。その輝かしさの陰で、黄金を奪われたラインの乙女たちの嘆きがかすかに聞こえてくるのにも耳をすませてください。","len":"7:48","g":"オペラ"},"opera/ring-winter":{"c":"ワーグナー","w":"『ワルキューレ』","p":"「冬の嵐は過ぎ去り」（第1幕）","pt":"生き別れの双子とは知らずに出会った2人の前で、ジークムントが春の訪れと愛を歌います。扉が開き、月の光と春の空気が部屋に流れこむ情景に合わせて、ゆったりとゆれる旋律が始まります。冬の嵐が去り、心がほどけていくようなあたたかさに満ちた歌です。このあとジークリンデが答えて、2人の想いがひとつになっていきます。","len":"3:52","g":"オペラ"},"opera/ring-wotan":{"c":"ワーグナー","w":"『ワルキューレ』","p":"ヴォータンの告別と魔の炎の音楽（第3幕）","pt":"神々の長ヴォータンが、愛する娘ブリュンヒルデに別れを告げる場面です。はじめは威厳ある声で、やがて父親としての深い愛がにじむ、やさしくおだやかな歌に変わっていきます。娘を眠らせたあと、火の神を呼ぶと、オーケストラから炎がちらちらと燃え上がり、きらめく音で岩山を包みます。厳しさとやさしさ、別れの悲しみが一度に押し寄せる、心ゆさぶられる幕切れです。","len":"14:38","g":"オペラ"},"opera/romeo-waltz":{"c":"グノー","w":"『ロメオとジュリエット』","p":"ジュリエットのワルツ「私は夢に生きたい」","pt":"舞踏会の夜、ジュリエットが「恋より楽しい今を生きたい」と歌うワルツです。軽やかな3拍子にのって、ソプラノが鳥のように高く、軽く舞い上がります。細かく転がるような声の技が次々に出てきて、少女のはずむ心がそのまま音になっています。まだ恋を知らない、いちばん無邪気で明るい時間のジュリエットを感じてください。","len":"4:34","g":"オペラ"},"opera/rosen-final":{"c":"R.シュトラウス","w":"『ばらの騎士』","p":"最後の二重唱「夢なのね」","pt":"元帥夫人が去り、若い2人だけが残って歌う、最後の二重唱です。「夢なのね」と、2人はまるで子守歌のような、素朴でやさしい旋律を歌います。重い三重唱のあとなので、春風のような軽やかさとほっとする明るさが感じられます。夢見心地の幸せのまま、そっと幕が下りていきます。","len":"5:56","g":"オペラ"},"opera/rosen-mono":{"c":"R.シュトラウス","w":"『ばらの騎士』","p":"元帥夫人の独白（第1幕）","pt":"元帥夫人が、若い恋人との別れを予感しながら、「時というものは、ふしぎなもの」と語る独白です。オーケストラはやわらかく、静かに、彼女の心の動きに寄りそいます。歌は語りかけるようにおだやかで、ためいきのような響きが続きます。過ぎてゆく時を見つめる、大人の女性のさびしさと気品が胸にしみる場面です。","len":"9:26","g":"オペラ"},"opera/rosen-trio":{"c":"R.シュトラウス","w":"『ばらの騎士』","p":"三重唱（第3幕）","pt":"元帥夫人が身を引き、若い恋人オクタヴィアンとゾフィーを祝福する三重唱です。3人がそれぞれの想いを、別々の言葉で歌いはじめます。その声がしだいに重なり、からみ合いながら、どんどん高く、大きくふくらんでいきます。頂点で3つの声がひとつにとけ合う瞬間は、喜びと悲しみが同時にあふれる、息をのむ美しさです。","len":"5:43","g":"オペラ"},"opera/rosen-waltz":{"c":"R.シュトラウス","w":"『ばらの騎士』","p":"オックス男爵のワルツ（第2幕）","pt":"上機嫌のオックス男爵が、ウィンナ・ワルツにのって歌う場面です。ゆったりとした、少しのんびりしたワルツの旋律が流れ出し、思わず体がゆれてしまいます。男爵は自分のもてぶりに得意満面で、太い声で鼻歌まじりのように歌います。甘くとろけるようなワルツと、男爵のこっけいさが重なる、楽しい場面です。","len":"5:08","g":"オペラ"},"opera/rusalka":{"c":"ドヴォルザーク","w":"『ルサルカ』","p":"「月に寄せる歌」","pt":"人間の王子に恋をした水の精ルサルカが、月に向かって想いを託す歌です。ハープのやわらかな響きと、ゆったりとした弦にのって、月の光が湖面をやさしく照らすような情景が浮かびます。ソプラノが「月よ、あの人に伝えて」と、清らかに、せつなく歌いかけます。静かな夜の美しさと、かなわぬ恋の切なさがとけ合う、ため息の出るような名曲です。","len":"7:11","g":"オペラ"},"opera/salome-dance":{"c":"R.シュトラウス","w":"『サロメ』","p":"七つのヴェールの踊り","pt":"王女サロメが、王の前で妖しく踊る場面の音楽です。はじめはゆっくりと、くねるような旋律が流れ、どこか異国めいた、まとわりつくような空気が広がります。踊りが進むにつれて、テンポはしだいに速く、激しくなっていきます。最後は熱狂の頂点で一気に終わり、そのあとにくる恐ろしい要求を予感させます。","len":"9:17","g":"オペラ"},"opera/summertime":{"c":"ガーシュウィン","w":"『ポーギーとベス』","p":"「サマータイム」","pt":"母親が赤ちゃんに歌って聞かせる子守歌です。ゆったりとしたリズムにのって、けだるくあたたかな夏の空気がただよいます。「夏は暮らしが楽、泣かないで」とやさしく語りかける声には、愛情と、どこか物悲しい響きが同時にこもっています。南部の暑い夏の夕暮れのような、ぼんやりとした美しさに身をまかせてください。","len":"2:22","g":"オペラ"},"opera/tann-abend":{"c":"ワーグナー","w":"『タンホイザー』","p":"「夕星の歌」（第3幕）","pt":"騎士ヴォルフラムが、夕暮れの空に光る宵の明星に、愛する人エリーザベトの無事を祈る歌です。ハープがやさしく爪弾く伴奏にのって、バリトンがおだやかに語りかけるように歌います。自分の恋がかなわないと知りながら、相手の幸せだけを願う心が、深くあたたかな声にこめられています。夕闇がゆっくり降りてくるような、静かでしみじみとした時間です。","len":"5:30","g":"オペラ"},"opera/tann-pilgrim":{"c":"ワーグナー","w":"『タンホイザー』","p":"巡礼の合唱（第3幕）","pt":"ローマから帰ってきた巡礼たちが歌う、厳かな男声合唱です。はじめは遠くからかすかに聞こえ、少しずつ近づいてくるように大きくなっていきます。ゆったりとした旋律には、罪を許された人たちの安らぎと感謝がこもっています。やがて行列が遠ざかるように静かになっていくところに、待つ者の不安がそっと重なります。","len":"7:23","g":"オペラ"},"opera/tell-ov":{"c":"ロッシーニ","w":"『ウィリアム・テル』","p":"序曲（最後の部分）","pt":"トランペットの呼び声が高らかに鳴りひびき、合図のように最後の部分が始まります。続いて、馬が駆けるような速いリズムが弦楽器でたたみかけられ、胸がどんどん高鳴っていきます。金管と打楽器が加わって、勢いは止まることなく最後まで一直線。運動会のかけっこを思い出しながら、思わず体が前に出るような高揚を味わってください。","len":"3:06","g":"オペラ"},"opera/thais":{"c":"マスネ","w":"『タイス』","p":"タイスの瞑想曲","pt":"独奏ヴァイオリンが、ハープのやさしい伴奏にのって歌う間奏曲です。ゆったりとした美しい旋律が、まるで心の中の祈りのように静かに流れ出します。中ほどで旋律が熱を帯び、心がゆれ動くように高まりますが、やがてまた最初の静かな旋律に戻っていきます。心がしずかに洗われていくような、清らかな時間です。","len":"5:59","g":"オペラ"},"opera/three-nessun":{"c":"プッチーニ","w":"『トゥーランドット』","p":"「誰も寝てはならぬ」（三大テノール 1990年）","pt":"パヴァロッティ、ドミンゴ、カレーラスの「三大テノール・コンサート」での「誰も寝てはならぬ」です。夜空の下の野外会場で、テノールの名旋律が静かに歌いはじめられます。3人それぞれの声の色、明るさや深みのちがいにも耳をすませてください。最後の「勝つぞ」に向けて会場全体が高まっていく、祝祭のような熱気に包まれます。","len":"3:22","g":"オペラ"},"opera/tosca-recondita":{"c":"プッチーニ","w":"『トスカ』","p":"「妙なる調和」（第1幕）","pt":"教会で絵を描く画家カヴァラドッシが、恋人トスカを思いながら歌います。木管楽器のやわらかな前奏に導かれ、黒髪のトスカと、金髪の絵のモデル、2人の美しさのちがいを語ります。そばで堂守（教会の番人）がぶつぶつ文句を言うのもおかしみがあります。最後は「でもぼくの心はトスカだけ」と、熱く高らかに歌い上げます。","len":"2:38","g":"オペラ"},"opera/tosca-stelle":{"c":"プッチーニ","w":"『トスカ』","p":"「星は光りぬ」（第3幕）","pt":"夜明け前の城の屋上、処刑を待つカヴァラドッシが、星空の下でトスカとの思い出をたどります。悲しい前奏のあと、静かに「星は光っていた」と語りはじめます。甘い夜の記憶がよみがえるほどに声は高まり、最後は「こんなにも生きたかったことはない」と、絶望の叫びになります。美しい思い出と、迫る死との落差に心がふるえます。","len":"2:58","g":"オペラ"},"opera/tosca-tedeum":{"c":"プッチーニ","w":"『トスカ』","p":"テ・デウム（第1幕の幕切れ）","pt":"教会の鐘が鳴り、遠くで大砲がとどろき、厳かな行列とともに賛美の合唱が始まります。その祈りの響きの中で、悪役スカルピアが「トスカを手に入れる」と、ひそかに邪悪な欲望を語りはじめます。合唱とオルガン、鐘の音がどんどん大きく重なり、最後は聖なる響きと悪の叫びがひとつになって頂点に達します。鳥肌が立つような幕切れです。","len":"4:17","g":"オペラ"},"opera/tosca-vissi":{"c":"プッチーニ","w":"『トスカ』","p":"「歌に生き、愛に生き」（第2幕）","pt":"悪役スカルピアに追いつめられた歌姫トスカが、ひとりつぶやくように歌いだします。「歌に生き、愛に生きてきた」と、静かに、自分の人生をふり返ります。やがて「なぜ神は、こんな仕打ちを」と思いがあふれ、声は高く大きく盛り上がり、そしてまた力なく沈んでいきます。祈りと嘆きが入りまじる、胸をしぼるような歌です。","len":"3:21","g":"オペラ"},"opera/trav-amami":{"c":"ヴェルディ","w":"『椿姫』","p":"「愛して、アルフレード」（第2幕）","pt":"別れを決めたヴィオレッタが、何も知らないアルフレードに思わず「愛して、アルフレード」と叫びます。それまでおさえていた気持ちが、せきを切ったようにあふれ出し、オーケストラが大きくうねるように鳴りひびきます。ほんの短い瞬間ですが、全身で泣いているような声に、聴いている胸もしめつけられます。そのまま走り去る姿が目に浮かびます。","len":"1:54","g":"オペラ"},"opera/trav-brindisi":{"c":"ヴェルディ","w":"『椿姫』","p":"「乾杯の歌」（第1幕）","pt":"パーティーのにぎわいの中、アルフレードが杯を手に歌いはじめます。三拍子の弾むリズムで、明るく楽しい旋律。続いてヴィオレッタが同じ旋律を受けて歌い返し、2人の声が軽やかにやりとりします。合唱が加わってパーティー全体が歌に包まれると、グラスの音が聞こえてきそうな華やかさです。","len":"3:09","g":"オペラ"},"opera/trav-parigi":{"c":"ヴェルディ","w":"『椿姫』","p":"「パリを離れて」（第3幕）","pt":"病床のヴィオレッタのもとに、やっとアルフレードが戻ってきます。「パリを離れて、2人で暮らそう」とアルフレードがやさしく語りかけ、ヴィオレッタも同じ旋律で答えます。ゆらゆら揺れるような穏やかな旋律は、夢を見ているように甘く、どこかはかない響き。弱々しい声が懸命に希望を歌うところに、涙がこみあげます。","len":"5:10","g":"オペラ"},"opera/trav-prel":{"c":"ヴェルディ","w":"『椿姫』","p":"第1幕への前奏曲","pt":"弦楽器だけで、高く細く、消え入りそうな和音が静かに鳴りはじめます。まるで病床の弱々しい息づかいのようで、聴いた瞬間に胸がしんとします。やがて低めの弦が、歌うような美しい愛の旋律を奏で、その上で高い弦がきらきらと飾りをつけます。最後はまた静かに消えていき、はかない命の物語を予感させます。","len":"4:02","g":"オペラ"},"opera/trav-pura":{"c":"ヴェルディ","w":"『椿姫』","p":"「天使のように清らかな娘が」（第2幕）","pt":"アルフレードの父ジェルモンが、ヴィオレッタに息子と別れてほしいと頼みます。父の落ち着いた、品のある旋律に対して、ヴィオレッタは必死に拒み、声は乱れていきます。けれど最後には、力の抜けた静かな声で「その娘さんに伝えてください」と、身を引く決心を歌います。ぶつかりあいから、あきらめへと変わる心の動きをたどってください。","len":"7:16","g":"オペラ"},"opera/trav-sempre":{"c":"ヴェルディ","w":"『椿姫』","p":"「花から花へ」（第1幕）","pt":"客が帰ったあと、ひとりになったヴィオレッタは「あの人こそ私の恋人？」と、しっとり心の内を探ります。アルフレードの愛の旋律が胸によみがえりますが、彼女は「ばかげている」とふりはらい、速く華やかな歌へ。細かい音が次々と舞い上がる超絶技巧で「自由に生きる」と歌いきります。外から聞こえる彼の歌声に、心が揺れる様子も聴きのがさないでください。","len":"3:46","g":"オペラ"},"opera/trav-undi":{"c":"ヴェルディ","w":"『椿姫』","p":"「ある日、幸せにも」（第1幕）","pt":"アルフレードが、ヴィオレッタにそっと愛を打ち明けます。「ある日、あなたが現れて」と語りはじめた声は、やがて、胸の鼓動のような熱い「愛の旋律」へと高まります。ヴィオレッタは軽やかな声で笑ってかわしますが、2人の声が重なると、心が少しずつ近づいていくのがわかります。この旋律をしっかり覚えておくと、あとで何度も心を揺さぶられます。","len":"3:47","g":"オペラ"},"opera/tristan-pl":{"c":"ワーグナー","w":"『トリスタンとイゾルデ』","p":"前奏曲と愛の死","pt":"チェロがひとりで、あこがれるように上へとのびていく音から始まります。そこに重なる不思議な響きの「トリスタン和音」は、答えが出ないまま宙に浮き、満たされない想いが波のように何度も押し寄せます。後半の「愛の死」では、イゾルデの歌が少しずつ高まって大きな頂点に達します。最後に響きがようやく静かに落ち着き、長い苦しみから解き放たれるような安らぎが訪れます。","len":"20:58","g":"オペラ"},"opera/trov-anvil":{"c":"ヴェルディ","w":"『イル・トロヴァトーレ』","p":"「アンヴィル・コーラス」（第2幕）","pt":"夜が明けた山あいのジプシーの野営地。オーケストラが力強く鳴りはじめ、男たちが金づちで金床（かなとこ）をカーン、カーンと打ち鳴らします。その金属の響きにあわせて、合唱が「さあ働こう」と元気よく歌います。朝の光と火花が目に浮かぶような、たくましく弾むリズムの合唱です。","len":"2:43","g":"オペラ"},"opera/trov-pira":{"c":"ヴェルディ","w":"『イル・トロヴァトーレ』","p":"「見よ、恐ろしい炎を」（第3幕）","pt":"捕らわれた母を救いに行こうと、マンリーコが剣を手に立ち上がります。速く勇ましいリズムで、トランペットが鳴りひびくような力強い伴奏にのって、「見よ、恐ろしい炎を」と叫ぶように歌います。後半は兵士たちの合唱が加わり、「戦いへ！」と熱気が一気に高まります。最後の一声まで、怒りと勇気がみなぎる歌です。","len":"3:22","g":"オペラ"},"opera/trov-stride":{"c":"ヴェルディ","w":"『イル・トロヴァトーレ』","p":"「炎は燃えて」（第2幕）","pt":"ジプシーの老婆アズチェーナが、たき火を見つめながら、母が火あぶりにされた日を語りはじめます。三拍子の揺れるリズムにのって、暗くうねる声が、炎がはぜる様子や群衆のざわめきを描き出します。歌の中に細かくふるえる音が混じり、燃え上がる火の揺らめきのよう。恐ろしい記憶にとりつかれた女の、低く重い声に引きこまれます。","len":"3:02","g":"オペラ"},"opera/tur-nessun":{"c":"プッチーニ","w":"『トゥーランドット』","p":"「誰も寝てはならぬ」（第3幕）","pt":"「夜が明ければ私が勝つ」と、カラフが夜空に向かって歌う名アリアです。眠れない都の夜の静けさの中、テノールがひとり、ささやくように歌いはじめます。遠くから女声の合唱がかすかに聞こえ、夜の神秘がいっそう深まります。旋律は少しずつ熱を帯び、最後の「勝つぞ」で一気に夜明けの光へ駆けのぼる、胸の高鳴る瞬間を待ってください。","len":"3:16","g":"オペラ"},"opera/tur-nonpiangere":{"c":"プッチーニ","w":"『トゥーランドット』","p":"「泣くな、リュー」（第1幕）","pt":"カラフが、泣いているリューをやさしくなぐさめ、年老いた父のことを頼む歌です。はじめは語りかけるような静かな旋律で、相手の涙をそっとぬぐうような温かさがあります。やがて声に力がこもり、自分の運命を覚悟した男の決意がにじみます。やさしさと別れの予感が同時に聴こえてくる、胸の痛む場面です。","len":"3:11","g":"オペラ"},"opera/tur-reggia":{"c":"プッチーニ","w":"『トゥーランドット』","p":"「この宮殿の中で」（第2幕）","pt":"氷の姫トゥーランドットが、昔異国の男に殺された祖先の姫の恨みを語るアリアです。はじめは低く冷たい声で、古い物語を語るように静かに始まります。語るうちに怒りが燃え上がり、声はどんどん高く、鋭くなっていきます。最後はカラフも加わって2人の声が高い音でぶつかり合い、火花が散るような緊張に包まれます。","len":"6:24","g":"オペラ"},"opera/tur-signore":{"c":"プッチーニ","w":"『トゥーランドット』","p":"「お聞きください、王子様」（第1幕）","pt":"女奴隷リューが、ひそかに想う王子カラフに「謎に挑まないで」と涙ながらに頼む歌です。細く震えるような声で、ことばを一つずつ差し出すように歌いはじめます。短い曲ですが、こらえていた想いが少しずつあふれ、最後は高い音が消え入るように弱く結ばれます。届かない恋の切なさが、胸にしみる数分間です。","len":"2:42","g":"オペラ"},"opera/tur-tuchedigel":{"c":"プッチーニ","w":"『トゥーランドット』","p":"「氷のような姫君の心も」（第3幕）","pt":"リューが死を前に、冷たい姫に向かって歌う最後のアリアです。その声は責めるのではなく、静かに、祈るように響きます。「あなたもいつか愛を知るでしょう」という想いが、やわらかな旋律にこめられています。自分を捨ててまで人を愛した娘の、透きとおるような悲しさと気高さに耳をすませてください。","len":"2:50","g":"オペラ"},"opera/werther":{"c":"マスネ","w":"『ウェルテル』","p":"「春風よ、なぜ私を目覚めさせるのか」","pt":"ウェルテルが、人妻になったシャルロットの前で、詩を読み聞かせる場面のアリアです。はじめは、詩を朗読するように静かに、しみじみと歌いはじめます。詩の言葉に自分の想いが重なるにつれ、声はどんどん熱を帯び、苦しいほどの叫びへと高まっていきます。かなわぬ恋に身を焦がす青年の悲しみが、胸に迫ってきます。","len":"3:12","g":"オペラ"},"opera/wozzeck":{"c":"ベルク","w":"『ヴォツェック』","p":"第3幕の間奏曲","pt":"悲劇がすべて終わったあとに、オーケストラだけで流れる嘆きの音楽です。それまでの不安定な響きとはちがい、ロマン派の音楽のように深く、心にまっすぐ届く響きで始まります。悲しみがしだいにふくらみ、最後は大きな叫びのように高まっていきます。救われなかった人への、作曲者自身の涙のような音楽です。","len":"5:21","g":"オペラ"},"opera/yuzuru":{"c":"團伊玖磨","w":"『夕鶴』","p":"つうのアリア「与ひょう、わたしの大事な与ひょう」","pt":"鶴の化身のつうが、お金に心を奪われて変わっていく夫・与ひょうを思って歌うアリアです。日本語の言葉のひとつひとつが、ていねいに、やさしく、そして悲しく歌われます。「わたしの大事な与ひょう」と呼びかける声には、深い愛と、もう戻れない寂しさがこもっています。日本の昔話の情景と、ひとりの女性の切なさが胸に迫る歌です。","len":"5:46","g":"オペラ"},"wind/african":{"c":"ヴァン・マッコイ","w":"アフリカン・シンフォニー","p":"全曲","pt":"太鼓が鳴り、金管が「パーパーパー」と大きく吹く。高校野球の応援でおなじみ","len":"4:35","g":"吹奏楽"},"wind/aidamarch":{"c":"ヴェルディ","w":"歌劇『アイーダ』より 凱旋行進曲","p":"全曲","pt":"長いトランペット（アイーダ・トランペット）が吹く、晴れやかなメロディ。だれもが聞いたことのある名旋律","len":"5:13","g":"吹奏楽"},"wind/akizorani":{"c":"上岡洋一","w":"行進曲「秋空に」","p":"全曲","pt":"すみきった秋の空のように、明るくすっきりしたメロディ。2分あまりの短さに、マーチの楽しさがぎゅっとつまっている","len":"3:14","g":"吹奏楽"},"wind/alvamar":{"c":"バーンズ","w":"アルヴァマー序曲","p":"全曲","pt":"元気に走り出す出だし、中間部のゆったりしたメロディ、また元気に戻って締めくくる。わかりやすい3つの部分","len":"8:30","g":"吹奏楽"},"wind/americanswe":{"c":"フィルモア","w":"アメリカンズ・ウィー","p":"全曲","pt":"胸を張って歩くような、明るく堂々としたマーチ。低音のかけあいも楽しい","len":"2:49","g":"吹奏楽"},"wind/amparito":{"c":"テシドール","w":"アンパリート・ロカ","p":"全曲","pt":"明るく軽やかなスペインのマーチ。トリオ（中間部）の、のびやかなメロディが印象的","len":"3:09","g":"吹奏楽"},"wind/amsalute":{"c":"グールド","w":"アメリカン・サリュート","p":"全曲","pt":"有名な歌「ジョニーが凱旋するとき」を、ファゴットのささやきから始めて、最後は全員の大合奏までふくらませていく","len":"4:33","g":"吹奏楽"},"wind/anchors":{"c":"ジマーマン","w":"錨を上げて","p":"全曲","pt":"晴れやかで、胸を張って海へ出ていくようなメロディ。アメリカの「海の男」の歌","len":"1:44","g":"吹奏楽"},"wind/aprilleaf":{"c":"近藤悠介","w":"マーチ「エイプリル・リーフ」","p":"全曲","pt":"4月の若葉のように、みずみずしくてはずむようなメロディ。中間部のやわらかい歌も美しい","len":"3:33","g":"吹奏楽"},"wind/armenian":{"c":"リード","w":"アルメニアン・ダンス パート1","p":"全曲","pt":"アルメニアの民謡が5つつながる。最後の「ゴー、ゴー」は、はやしたてるような速い踊りで最高潮に","len":"11:39","g":"吹奏楽"},"wind/arsenal":{"c":"ヴァンデルロースト","w":"アルセナール","p":"全曲","pt":"はじけるようなファンファーレで始まり、中間部では一転して、ゆったりと広がる美しいメロディを歌う","len":"3:48","g":"吹奏楽"},"wind/asphalt":{"c":"マッキー","w":"アスファルト・カクテル","p":"全曲","pt":"騒がしい都会の道路のような、ごちゃまぜの迫力。リズムがせわしなく変わり続ける","len":"5:40","g":"吹奏楽"},"wind/aurora":{"c":"マッキー","w":"オーロラの目覚め","p":"全曲","pt":"静かな夜明けの前から、まぶしい光があふれる朝へ。最後の高まりは鳥肌もの","len":"11:03","g":"吹奏楽"},"wind/barnes3":{"c":"バーンズ","w":"交響曲第3番","p":"第3楽章（メスト）","pt":"胸がしめつけられるように美しい、ゆったりとした歌。静かに始まり、大きくふくらんで、また静かに消えていく","len":"13:13","g":"吹奏楽"},"wind/barnum":{"c":"キング","w":"バーナムとベイリーのお気に入り","p":"全曲","pt":"息つくひまもない速さで、トロンボーンやチューバが走り回る。サーカスの象や曲芸師が次々に出てくるようなにぎやかさ","len":"2:39","g":"吹奏楽"},"wind/berlioz":{"c":"ベルリオーズ","w":"葬送と勝利の大交響曲","p":"第3楽章（アポテオーズ）","pt":"大編成の吹奏楽が、勝利をたたえて高らかに鳴りひびく。最後は合唱が加わる版もある","len":"9:01","g":"吹奏楽"},"wind/blackhorse":{"c":"スーザ","w":"ブラック・ホース・トループ","p":"全曲","pt":"馬がパカパカと駆けるような、はずむリズム。最後は騎兵隊が堂々と進んでいくように終わる","len":"3:20","g":"吹奏楽"},"wind/blueshades":{"c":"ティケリ","w":"ブルー・シェイズ","p":"全曲","pt":"ジャズの「ブルース」の色あいを使った曲。クラリネットがジャズ風に大活躍する場面がある","len":"10:21","g":"吹奏楽"},"wind/bluespring":{"c":"鈴木雅史","w":"マーチ「ブルー・スプリング」","p":"全曲","pt":"「青春」を英語にした題のとおり、まぶしくて少し切ない、若々しいマーチ","len":"3:57","g":"吹奏楽"},"wind/bogey":{"c":"アルフォード","w":"ボギー大佐","p":"全曲 en":"8:19","g":"マーチとワルツ"},"march-waltz/romeo-waltz":{"c":"グノー","w":"『ロメオとジュリエット』","p":"ジュリエットのワルツ「私は夢に生きたい」","pt":"舞踏会の夜、ジュリエットが「恋より楽しい今を生きたい」と歌うワルツです。軽やかな3拍子にのって、ソプラノが鳥のように高く、軽く舞い上がります。細かく転がるような声の技が次々に出てきて、少女のはずむ心がそのまま音になっています。まだ恋を知らない、いちばん無邪気で明るい時間のジュリエットを感じてください。","len":"4:34","g":"マーチとワルツ"},"march-waltz/rosen":{"c":"R.シュトラウス","w":"楽劇「ばらの騎士」","p":"組曲","pt":"ホルンが高らかに叫ぶように駆け上がる、情熱的な始まりで幕を開けます。銀のばらを手渡す場面では、チェレスタなどがきらきらと光る和音を鳴らし、まるで時間が止まったよう。やがてウィーン風のワルツがたっぷりと流れ、甘く、少しけだるい優雅さに包まれます。華やかさの中に、過ぎていく時への切なさもにじむ音楽です。","len":"27:07","g":"マーチとワルツ"},"march-waltz/rosen-waltz":{"c":"R.シュトラウス","w":"『ばらの騎士』","p":"オックス男爵のワルツ（第2幕）","pt":"上機嫌のオックス男爵が、ウィンナ・ワルツにのって歌う場面です。ゆったりとした、少しのんびりしたワルツの旋律が流れ出し、思わず体がゆれてしまいます。男爵は自分のもてぶりに得意満面で、太い声で鼻歌まじりのように歌います。甘くとろけるようなワルツと、男爵のこっけいさが重なる、楽しい場面です。","len":"5:08","g":"マーチとワルツ"},"march-waltz/rosensud":{"c":"J.シュトラウス2世","w":"南国のバラ","p":"1曲","pt":"最初のワルツの、大きく弧を描くような旋律。バラの花びらが開くように華やか","len":"10:02","g":"マーチとワルツ"},"march-waltz/sabrespurs":{"c":"スーザ","w":"サーベルと拍車","p":"1曲","pt":"騎兵隊のラッパの合図で始まり、馬が駆けていくような軽快なリズムが続く","len":"3:22","g":"マーチとワルツ"},"march-waltz/sambre":{"c":"プランケット","w":"サンブル・エ・ミューズ連隊","p":"全曲","pt":"ラッパのファンファーレのあと、力強い歌が行進曲になって進む。フランスの軍楽隊のまばゆい響き","len":"4:28","g":"マーチとワルツ"},"march-waltz/sardar":{"c":"イッポリトフ＝イヴァノフ","w":"組曲「コーカサスの風景」","p":"酋長の行列","pt":"ピッコロと打楽器がひびく、異国の行列。遠くから近づいてくるように大きくなる","len":"3:41","g":"マーチとワルツ"},"march-waltz/scaffold":{"c":"ベルリオーズ","w":"幻想交響曲","p":"第4楽章「断頭台への行進」","pt":"不気味な低音の行進が、やがてやけっぱちのように明るく行進していく。最後に恋人のメロディが一瞬あらわれ、刃が落ちる","len":"4:41","g":"マーチとワルツ"},"march-waltz/schatz":{"c":"J.シュトラウス2世","w":"宝のワルツ","p":"1曲","pt":"宝物を見つけたよろこびがあふれるような、明るくはずむワルツ","len":"7:58","g":"マーチとワルツ"},"march-waltz/schubertmarch":{"c":"シューベルト","w":"軍隊行進曲 第1番","p":"1曲","pt":"ラッパのような合図から始まる、きびきびした行進。中間部はやさしく歌う","len":"5:20","g":"マーチとワルツ"},"march-waltz/seasongs":{"c":"ヴォーン・ウィリアムズ","w":"海の歌","p":"全曲","pt":"イギリスの船乗りの歌が3つ、次々につながって出てくる。中間部は少しゆったりと、懐かしい歌になる","len":"4:02","g":"マーチとワルツ"},"march-waltz/semper":{"c":"スーザ","w":"センパー・フィデリス","p":"全曲","pt":"中ほどで太鼓だけが残り、そこ     case "flower": return [0,72,144,216,288].map(a => `<ellipse cx="50" cy="32" rx="7" ry="14" transform="rotate(${a} 50 46)" stroke-width=".9"/>`).join("") + `<circle cx="50" cy="46" r="5" stroke-width="1"/>` + L("M50 60v28",.8);
    case "drum": return `<ellipse cx="50" cy="40" rx="26" ry="8" stroke-width="1.1"/>` + L("M24 40v26q26 14 52 0V40",1.1) + L("M24 48l12 26M40 50l12 26M58 50l-8 26M76 48l-12 26",.5) + L("M30 18l18 18M70 18 52 36",1);
    case "keys": return L("M10 30h80v40H10z",1) + L("M21.4 30v40M32.8 30v40M44.2 30v40M55.6 30v40M67 30v40M78.4 30v40",.6) + `<g fill="currentColor" stroke="none"><rect x="18" y="30" width="6" height="22"/><rect x="29.4" y="30" width="6" height="22"/><rect x="52.2" y="30" width="6" height="22"/><rect x="63.6" y="30" width="6" height="22"/><rect x="75" y="30" width="6" height="22"/></g>`;
    case "strings": return L("M10 30h80",.7) + L("M10 44h80",1) + L("M10 58h80",1.4) + `<path d="M10 72h80" stroke-width="2.6"/>` + L("M10 72q10-6 20 0t20 0t20 0t20 0",.6);
    case "mask": return L("M18 22h64v18c0 22-14 36-32 36S18 62 18 40z",1.1) + L("M30 38q5-5 10 0M60 38q5-5 10 0M38 56q12 8 24 0",1) + L("M4 10h92",.6);
    default: return L("M8 34h84M8 42h84M8 50h84M8 58h84M8 66h84",.5) + `<g fill="currentColor" stroke="none"><ellipse cx="30" cy="62" rx="6" ry="4.4" transform="rotate(-20 30 62)"/><ellipse cx="54" cy="54" rx="6" ry="4.4" transform="rotate(-20 54 54)"/><ellipse cx="74" cy="46" rx="6" ry="4.4" transform="rotate(-20 74 46)"/></g>` + L("M35.6 60V26M59.6 52V22M79.6 44V18",1);

}
// big=true：大きい額（3:2）。false：小さい正方形
function plate(k, big, label){
  const m = motifOf(k);
  if (!big) return `<svg class="pl" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" style="fill:var(--plate)"/><rect x="5" y="5" width="90" height="90" fill="none" style="stroke:var(--gold)" stroke-width="1.5"/><g fill="none" style="stroke:var(--pline);color:var(--pline);stroke-width:2.6px" stroke-linecap="round" stroke-linejoin="round" transform="translate(16 16) scale(.68)">${motif(m).replace(/stroke-width="[\d.]+"/g, "")}</g></svg>`;
  return `<svg class="art" viewBox="0 0 150 100" aria-hidden="true"><rect width="150" height="100" style="fill:var(--plate)"/><rect x="4" y="4" width="142" height="92" fill="none" style="stroke:var(--gold)" stroke-width=".7"/><rect x="7" y="7" width="136" height="86" fill="none" style="stroke:var(--gold)" stroke-width=".3"/><g fill="none" style="stroke:var(--pline);color:var(--pline)" stroke-linecap="round" stroke-linejoin="round" transform="translate(37 10) scale(.8)">${motif(m)}</g>${label ? `<text x="75" y="93" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="5.2" letter-spacing="1.6" style="fill:var(--gold)">${esc(label)}</text>` : ""}</svg>`;
}


{ const d = new Date(); document.getElementById("m-date").textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`; }
const keys = Object.keys(ALL).sort(), today = ymd(new Date());
const k = keys[hash(today + "top") % keys.length], t = ALL[k], href = k.replace("/", "/#k-");
GENRE = t.g;
document.getElementById("today").innerHTML = `<div class="in">
  ${plate(k, true, LATIN[t.g] || "")}
  <div class="kicker">— ${esc(t.g)} —</div>
  <div class="comp">${esc(t.w.startsWith("『") ? t.c + t.w : t.c)}</div>
  <div class="ttl">${esc(t.w.startsWith("『") ? t.p : t.w)}</div>
  <div class="part">${esc(t.w.startsWith("『") ? "" : t.p)}</div>
  <p class="pt">${esc(t.pt)}</p>
  <a class="btn" href="${href}"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v18l16-9z" fill="currentColor"/></svg>開演<span class="lat">${t.len}</span></a>
  <div class="stamp" id="t-stamp" hidden><b>聴いた</b><span class="lat">${today.replace(/-/g, ".")}</span></div>
</div>`;
let heard = []; try { const v = JSON.parse(localStorage.getItem("listened-v1") || "[]"); if (Array.isArray(v)) heard = v; } catch {}
document.getElementById("t-stamp").hidden = !heard.some(e => e.p + "/" + e.k === k && e.d === today);
let shown = 5;
function renderLog(){
  const now = new Date(), days = new Set(heard.map(e => e.d)), wk = document.getElementById("l-week");
  let n7 = 0, h = "";
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i), s = ymd(d), on = days.has(s);
    if (on) n7++;
    h += `<li class="${on ? "on" : ""}${i === 0 ? " now" : ""}" title="${mdw(s)}"><i>${d.getDate()}</i><span>${WD[d.getDay()]}</span></li>`;
  }
  wk.innerHTML = h;
  const month = ymd(now).slice(0, 7);
  const rows = heard.slice().sort((a, b) => (b.d + (b.at || "")).localeCompare(a.d + (a.at || "")));
  document.getElementById("l-stat").textContent = rows.length
    ? `今月${new Set(heard.filter(e => e.d.startsWith(month)).map(e => e.t)).size}曲。これまで${rows.length}回・${new Set(rows.map(e => e.t)).size}曲。`
    : "曲のページで「聴いた」のハンコを押すと、ここに半券が残ります（この端末の中だけ）。";
  document.getElementById("l-list").innerHTML = rows.slice(0, shown).map(e => {
    const d = new Date(e.d + "T00:00:00");
    const inner = `<span class="d"><b>${d.getMonth()+1}.${d.getDate()}</b><span>${WD[d.getDay()]}</span></span><span class="t">${esc(e.t)}<small>${esc(e.g || "")}</small></span>`;
    return `<li>${e.p ? `<a href="${e.p}/#k-${encodeURIComponent(e.k)}">${inner}</a>` : `<span class="nolink">${inner}</span>`}</li>`;
  }).join("");
  document.getElementById("l-more").hidden = rows.length <= shown;
}
document.getElementById("l-more").onclick = () => { shown += 30; renderLog(); };
renderLog();
</script>
